# Remote access on a cloud box (the door, its certificate job, the volumes
# they share with the Host, their network and its firewall: every unit named
# cseries-remote-*, which systemd gives this drop-in by the name's prefix)
# starts only while the vault is open, or on a machine with no vault
# (cseries-vault.service), as the Host does: their volumes are in podman's
# storage, which is in the vault, and the certificate's key is the
# customer's. cseries-unlocked.target starts the door and its job after an
# unlock.
[Unit]
Requires=cseries-vault.service
After=cseries-vault.service
