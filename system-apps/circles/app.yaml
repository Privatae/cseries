#   (app-web-kit/search.tsx), changed there. read:search stays: the pane
#   still calls the route until the cards replace the rail, when
#   Circles drops the scope and Context holds the everything-search. Bundle
#   rebuilt and repacked.
# 0.16.0 (2026-10-11): the
#   cards are Circles. index.html is the deck of cards; the rail, its eleven
#   panes, the sidebar and the chat view are gone, and cards.html with them
#   (it never shipped). Everything they did is on the cards or in another
#   app: a page's Rename, Close, Clear, Delete, Split and turn type; mood,
#   context and the background ribbon; the box's pills, file rules, paste,
#   drop and Store in Keys; notes, Block, Remove and Clear on a contact's
#   card, All your contacts, your number; Load earlier; the Decisions sheet
#   and support in full; the platform's notices and your Host's older asks;
#   Calendar, Response Shaping, the rules and machines in their own apps.
#   Regenerate and A/B are gone end to end, and the Activity feed.
#   The Host is told what Circles is now. Scopes: write:calendar (the
#   Calendar app writes), read:search (Context searches),
#   write:brain_personality and read/write:brain_codebooks (Settings shapes
#   replies) are dropped; read:brain_personality stays, and read:inference_log
#   for the background ribbon (GET /api/inference/activity). Bundle rebuilt,
#   repacked and re-signed.
# 0.16.7 (2026-10-12): two topics at once are both seen working. A message
#   on another topic, sent while your Host works, streams its reply live with
#   its own working line, and words typed while a turn runs get their topic
#   picked too. Questions your Host asked on any topic come up as cards, and
#   "Where this stands" shows the topic you last wrote to and names it. The
#   activity panel lists the threads your Host runs on its own, each with its
#   current step (GET /api/circles/work). Bundle rebuilt, repacked and
#   re-signed.
# 0.16.6 (2026-10-12): your Host's back is one conversation. Every login opens
#   on a blank page with a greeting; earlier messages load as you scroll up,
#   across every topic, newest at the bottom (GET /api/circles/feed). There
#   are no thread tabs and no "new thread": your Host picks the topic of each
#   message, joining an earlier one only on a clear match, and a line shows
#   where the talk turns ("continuing: <topic>, <date>" / "new topic: …").
#   Words for the topic already being worked on go into that turn; words for
#   another topic start their own turn at the same time. The Root thread is
#   written to only through "Write in Root" on its line. last-open stays for
#   links. Bundle rebuilt, repacked and re-signed.
# 0.16.5 (2026-10-11): words you type while your Host is working are never
#   lost. The server keeps them from the moment it gets them, so the page no
#   longer keeps its own copy to send again: a reload, a closed tab or a
#   dropped connection cannot lose them. After a reload they show again as
#   sent and not yet read (GET /api/circles/pending). If the turn ends
#   before reading them, they start your Host's next turn on that page, and
#   the page follows it. Bundle rebuilt, repacked and re-signed.
# 0.16.5 (2026-10-11): in PII mode, where your Host writes nothing down, the
#   words you type while it works stay on the page until the turn reads them,
#   and go as your next message if it never does. Bundle rebuilt, repacked
#   and re-signed.
# 0.16.3 (2026-10-11): when the platform's crisis check flags your words,
#   Circles shows the platform's own notice over the page — the 988 Suicide
#   & Crisis Lifeline (call or text 988, chat at 988lifeline.org), marked as
#   the platform's, never your Host's — and you can dismiss it. It does not
#   cover the reply or stop you typing, and it comes back after a reload
#   until you dismiss it. Your Host answers in its own words, told the check
#   fired; the check no longer replaces its reply. Bundle rebuilt, repacked
#   and re-signed.
# 0.16.4 (2026-10-11): your Host's back, from first use of the cards.
#   One working line just above the box, outside the scrolled conversation:
#   "<Host> is working", what it is doing now (the running tool in words,
#   "Writing" only while words are arriving, "Thinking" in every silence)
#   and how long it has taken, from the send to the turn's last frame, and
#   after a reload from the turn's own start (GET /api/circles/turns/active).
#   It replaces the status line under the streaming reply and the "is
#   working" line under the conversation; the step used to say "Writing the
#   reply" for the rest of a turn once any word had arrived. Tapping it lists
#   what is running: the turn here, a turn on another page, each background
#   agent (GET /api/agents), and background work that failed. A turn on
#   another page keeps the line up on this one too ("is working · on
#   <page>"), also after leaving its page mid-turn. The background
#   ribbon is gone; a failure shows on the working line until dismissed.
#   "Where this stands" is one line until tapped, and each page remembers.
#   "Where did everything go?" is gone. Sending scrolls your words into
#   view. Scopes unchanged; bundle rebuilt and repacked.
# 0.16.8 (2026-10-12): there is no original conversation. Every message,
#   scheduled task report and agent result lands in a topic, so the page
#   never lists, opens or names "The original conversation": a decision
#   asked nowhere is listed under your Host's name, and a note asks you to
#   answer in Circles. A link naming the original conversation, Tell
#   <Host> on an older ask, and deleting the page on screen all open the
#   blank page, and the context bar is never drawn for the old scope.
#   Bundle rebuilt, repacked and re-signed.
# 0.16.9 (2026-10-18): when your Host's words start arriving after a
#   silence, the working line says "Writing" as they appear. It used to keep
#   saying "Thinking" for up to a second, until its clock next ticked, and
#   after a reload mid-turn that was the first thing it said over the new
#   words. The same for a reply on another topic in the line's panel. And
#   when a tool answers after words that came while it ran, the line says
#   "Thinking" at once; it used to say "Writing" for up to a second first.
#   Bundle rebuilt, repacked and re-signed.
# 0.16.10 (2026-10-18): the mood indicator on your card's back is gone with the
#   simulated psyche: no mood stream frame, no /api/brain/mood, no derivation
#   panel. The bundle calls no /api/brain route, so read:brain_personality is
#   dropped from permissions. prompt_behavior is one paragraph saying what the
#   app is and what lives in it; do_when_active is gone from the manifest
#   contract, and its how-to lines live in skills and tool descriptions the
#   Host reads on demand. Bundle rebuilt, repacked and re-signed.
# 0.16.11 (2026-10-18): rebuilt from sources whose comments were rewritten as plain rationale; no behaviour change.
version: "0.16.12"
# 0.15.0 (2026-10-10): the
#   cards, on their own address. cards.html, beside index.html in this
#   bundle, draws Circles as a deck of cards: each contact one card, the
#   person on the front and their Host on the back; your own card with your
#   Host's threads on its back; At the door, Waiting on you and Coming up.
#   index.html is still the rail and still opens by default; a card link
#   (card:<kind>:<id>, as Network's Message sends) or the view `cards` moves
#   the window to cards.html. A later release makes the cards Circles.
# 0.14.11 (2026-10-10): a Host's message that named a person this
#   Host could not verify says so on its author line, "<Host> · host · says
#   this is from <address>" (claimed_person from GET /api/circles/thread/
#   entity/<id>; components/chat/chat-message.tsx AuthorLine). Rebuilt on
#   main's 0.14.10 (the nudge id), which it carries. Scopes unchanged;
#   bundle rebuilt and repacked.
# 0.14.10 (2026-10-10): a
#   nudge is matched to its receipt by an id, not by its words. The
#   conversation holds each nudge it sends into a running turn until the
#   turn's nudge_read receipt, and sends it as the next message when none
#   comes. It matched the receipt by the first 48 characters of the words,
#   so words whose opening the platform changed (a secret shape cut from it)
#   never matched and went to the Host a second time. Each nudge now
#   carries an id (POST /api/circles/nudge client_id, which the receipt
#   echoes) and is matched on it, by the book's rule in the shared kit
#   (app-web-kit/book/nudge.ts readIndex), the one the Workbench's page
#   uses; a receipt with no id is still matched by the words' opening.
#   Scopes unchanged; bundle rebuilt and repacked.
# 0.14.9 (2026-10-10): a new
#   link, card:entity:<id>, which the Network app's Message on a machine's
#   Host sends. Circles draws no cards yet, so it opens the conversation with
#   that Host, as the Bastions pane's Message does (src/lib/app-view.ts; slice
#   10 swaps that one mapping for the Host's card). The Bastions and Domain
#   policy panes stay until the cards replace the rail. Scopes unchanged;
#   bundle rebuilt and repacked.
# 0.12.13 (2026-10-02, batch merge): two branches each shipped a 0.12.12 —
#   the ask card following the answer's turn (above), and desktop-render-check
#   (no note of its own): Regenerate and Compare follow the job a slow request
#   turns into (server/applications/long_request.py) instead of failing at
#   the router's 30 s. One release carries both, its bundle rebuilt from
#   npm ci. Scopes unchanged.
# 0.12.11 (2026-10-01): the agents strip reads GET /api/agents and vetoes with
#   POST /api/agents/{id}/cancel, and both routes now require a scope — they had
#   none, so any app on the Host could list and cancel the Host's agents.
#   Declares read:brain_tasks + write:brain_tasks (the scopes /api/brain/manage/
#   tasks already takes). Manifest-only change; bundle repacked.
# 0.12.10 (2026-09-28): no per-project style: all artifacts default to the
#   current UI.
#   The design-template doctrine (0.4.14/0.4.15: read the active template's
#   DESIGN.md, set_default, update_project design_system) is replaced by one
#   line: artifacts wear the desktop, and a new look is a desktop designed in
#   this conversation, never a project ("every time a UI is designed ANOTHER
#   project opens up empty"). Manifest-only; bundle repacked.
# 0.12.9 (2026-09-27): Delete, for threads and circles (there was no way
#   to delete a conversation, a thread or a circle).
#   A thread row carries Delete beside Rename/Close: DELETE
#   /api/circles/threads/{id} archives the thread's messages AND every row
#   the Host learned in it (summaries, goals, facts), so a bad test thread
#   stops steering the Host; the thread leaves the list and the original
#   conversation is shown if it was open. It also cancels the scheduled tasks
#   set in the thread, and the confirm dialog names them first (GET
#   /api/circles/threads/{id}/wakeups). A circle row gets the hover
#   control Clear already had: the owner deletes the circle for everyone, a
#   member leaves (bridge circles.leave). The original conversation keeps
#   Clear only.
# 0.12.8 (2026-09-25): the approval card for an op on one of the person's
#   machines. mgmt_run's op door files
#   the ticket (kind op_ask, locked to the user) and its result carries the
#   ask, so the card rises over the chat like a pipeline proposal's; the
#   machine's own dry-run diff rides as an ATTACHMENT the card folds under the
#   words (app-web-kit/ask.ts `attachment`, read from a platform ask only —
#   a Host's escalate cannot attach). The Tickets pane shows the same fold,
#   where the click is bound and what became of it, and every run a "from now
#   on" answer has covered since.
# 0.12.7 (2026-09-24): a pipeline change that adds a check running outside the
#   platform takes a code from the person's authenticator. The ask card shows
#   a code box on the option the kernel marked (the `pipeline` result's
#   stepup_option), the Tickets pane on 'apply' of a card whose platform-only
#   pipeline_proposal metadata asks for it — never from an option a Host
#   wrote. 'apply' stays disabled until six digits are in; the code rides
#   that decide only, and a wrong one leaves the card open.
# 0.12.6 (2026-09-24): the ask card also rises for a pipeline proposal — the
#   `pipeline` tool's result carries the decision ticket the kernel filed
#   (app-web-kit/ask.ts RESULT_ASK_TOOLS). Only
#   that named tool, read from `operate`'s args.tool when the Host runs it as
#   a registry op: an ask-shaped result from any other tool raises nothing.
# 0.12.5 (2026-09-24): the ask card — an answer the turn never read is sent
#   as the next message after EVERY attempt, not only on a status edge: a
#   send the server rejected left the status unchanged, so the answers
#   queued behind it waited for the person's next turn. Bounded by the queue; each attempt takes its entry first.
# 0.12.4 (2026-09-24): the ask card — an overlay over the chat, never a message
#   in it.
#   An `escalate` the Host raises on a live turn opens a dialog over the
#   conversation: the sitrep, the choices with the recommended one marked, a
#   note, Not now. The click decides the ticket through the same route the
#   Tickets pane uses, then the Host reads the person's words — nudged into a
#   running turn, sent as the next message when the turn has ended. Not now
#   leaves the ticket open in Tickets. One card at a time; a credential ask
#   points at Tickets, where it is sealed. app-web-kit/ask.ts + ui/ask-overlay.
# 0.12.3 (2026-09-24): tickets — one system, two shapes. A support
#   card from another Host (the operator's queue) is refreshed by the Host
#   while it sits open when that user writes again; the decide now sends the
#   mark the card was rendered with (`seen_event_max`) and the route applies
#   it only if the card still shows what the person read — else 409, the pane
#   reloads the card and says why — inline on the card (the sidebar is hidden
#   on mobile), as is a decide the platform recorded but could not apply yet.
# 0.12.2 (2026-09-24): tickets — one system, two shapes (one
#   ticket system: the Workbench for engineering, Circles for operations). A decision now carries the person's own
#   note (the route always took one; the pane never sent it). A ticket with one
#   option reads as something only they can do ("When you have done it"). An
#   option may ask for a credential (`credential_request` {name, cred_type,
#   purpose}): the card shows the same sealed "Store in Keys" field the
#   composer has, seals the pasted value under that name (POST
#   /api/vault/secrets, write:vault — already declared) and decides the ticket
#   with the name in the note; the Host never sees the value. A ticket joined
#   to a Workbench phase (metadata.phase_id) shows the link and what the phase
#   last reported; a phase gated on the user's approval raises its own ticket
#   here (metadata.kind=phase_gate) and Approve on it is the Workbench's
#   approved_at. Kernel: server/routes/tickets.py on_phase_outcome /
#   raise_phase_gate_ticket / resolve_phase_gate_tickets; the build path and
#   the Workbench approve route call them. Scopes unchanged.
# 0.12.1 (2026-09-23): faster streaming replies. The reply text now lands at most
#   once per animation frame (app-web-kit/stream-batch.ts) instead of one React
#   update per streamed chunk; tool calls, errors and the end of the turn flush
#   it first, so what the user sees arrives in the same order. Messages split
#   into blocks incrementally while they stream (app-web-kit/incremental-
#   blocks.ts) — only the end of the reply is re-split, not the whole text —
#   pinned equal to Streamdown's own split by test/incremental-blocks.test.ts.
#   Streamdown 2.5.0 -> 2.6.0 for remend 1.3.1, whose link repair was measured
#   at 47 ms per update on a 40 KB reply under 1.3.0 (7.8 ms under 1.3.1).
#   Build assets are now cached by the browser (server/applications/proxy.py
#   _asset_cache_control), so reopening the window no longer re-downloads the
#   app. Scopes unchanged.
# 0.12.0 (2026-09-23): the Bastions folder (a bastions folder for hosts
#   and people). A rail pane listing every
#   machine this Host is paired to: online or not, local or networked, who
#   anchors it (or that it is too old to say), this Host's own pairing state
#   there, and the other Hosts the machine announced, pending ones marked.
#   Each Host carries its contact card and the person behind it; Message opens
#   the thread when you are connected, and Request connection sends the
#   peer-gated request (POST /api/contacts/request-peer, which had no button
#   anywhere until now). "Open in Network" opens that machine's inspector
#   (Network 1.10.5). Everything is labelled as the machine's own report.
#   Backend: GET /api/circles/bastions (server/network/bastion_directory.py),
#   narrowed to that and nothing else — no keys, grants, addresses or folder
#   stores. Needs read:topology and write:address_book, both already held.
#   View 'bastions' opens the pane. Scopes unchanged.
# 0.11.11 (2026-09-23): the Tickets pane reads the bug lane's `validated`
#   status ("validated, in the operator's queue"). A bug ticket is now filed
#   as a pull request on the platform's bug repo, never a row in an operator
#   database (server/routes/support.py); the pane's Reply on a bug row lands
#   on that report through proposal.reply. Scopes unchanged.
# 0.11.10 (2026-09-23): a link can open a pane or a decision. The views
#   `inbox`, `tickets` and `decision:<id>` — on the frame (`#view=`) or as a
#   `cseries:app-view` message — switch to that pane; a decision opens the
#   Inbox on the decision's own message (a decision is an inbox kind, and
#   the user answers it by telling the host). It is what a "decision is
#   waiting" reach-out links to (server/deep_link.py). The decision is found
#   by the inbox list's `decision_id` (the list carries no payload); one not
#   found says so. A view posted before the app mounted is held, not lost
#   (the listener is installed in main.tsx before render). src/lib/app-view.ts;
#   scopes unchanged.
# 0.11.8 (2026-09-17): Rendezvous — the UI half. Settings gains an Interests
#   section (list, add, remove, withdraw all) over GET/POST/DELETE
#   /api/groups/rendezvous, and the inbox gains a `rendezvous_intro` card over
#   /api/groups/rendezvous/introductions[/{id}/accept], plus its filter pill.
#   Settings, not a rail entry: it is a standing per-user preference like every
#   other section there, and a rail icon would read as a place to browse tags —
#   the directory the feature exists to avoid needing.
#   NO CAP on the number of tags; only one tag's LENGTH (64) and
#   charset are bounded, shown as guidance because the tag becomes a community
#   group slug. The POST's `dropped` is rendered by name: a save that succeeds
#   while discarding one of the user's interests is what that field exists to
#   prevent. "Saved but not listed yet" is shown as its own state, never as
#   success — the bridge may be unreachable and the tags are stored either way.
#   The intro card shows a COUNT of others and nothing that could name them;
#   "Not now" archives, because there is no decline endpoint and must not be.
#   Scopes unchanged — read:group / write:group already cover these routes.
# 0.11.7 (2026-09-17): Search on the rail — the one index. One box over
#   everything the host can see: its memory and the user's documents (the SAME
#   recall engine, filters and relevance floor the host's per-turn pre-fire
#   uses; not its per-model visibility filter, own-words cap or 6-item cut —
#   a person searching wants every match), plus projects, the journal and the in-pod
#   code index, each under its own heading and honest when it could not run.
#   One index surface for finding context, files, etc. Shared
#   with the Workbench through app-web-kit/search.tsx; the route is GET
#   /api/search (server/routes/search.py). New scope read:search — declared
#   here because app tokens are minted from THIS list (the 0.8.1 lesson).
# 0.11.6 (2026-09-16): the same per-turn spend budget as the workbench —
#   "Budget for each turn" in dollars beside the depth dial, with the
#   projected next turn and the last turn's actual cost under it. The tool
#   loop stops starting rounds it cannot afford rather than stopping at a
#   per-model round count; a reply is never cut mid-sentence. A model with no
#   published per-token price says so and is budgeted in tokens.
# 0.11.5 (2026-09-16): the context panel says WHY it has nothing to show.
#   A peer thread (dm/entity) is built by the OTHER host, so no prompt is
#   assembled here and the block list and pre-fired memories are empty
#   permanently — the panel now says that in a sentence instead of
#   rendering an empty section that reads as a bug. A thread that simply
#   has not had a turn yet says that instead. Reads the new
#   `prefire_state` field on GET thread-context; a backend that does not
#   send it renders exactly as before. No scope change.
# 0.11.4 (2026-09-15): the chat agent card reads "unpriced" when the platform
#   holds no published rate for the model an agent ran on, instead of rendering
#   nothing. An empty cost reads as $0 to a person, and $0 and "we have no rate
#   card" are opposite facts — the same distinction cost_method (v113) exists to
#   keep. Matches the Workbench card; a still-running agent is unchanged.
# 0.11.3 (2026-09-06): the composer's app pills (the Artifacts window's
#   tune-mode references) ride the request as `frame.pills` beside the text,
#   so the host's per-turn "This Turn" block names them as references
#   instead of parsing them out of the message (host prompt map, phase 4).
#   The text still carries them in brackets, so the turn row is unchanged.
#   Scopes unchanged.
# 0.11.2 (2026-09-06): a tool card is titled by what the host DID, not by
#   what it typed. "<Tool> <op>" ("Gitea grep", "Artifact write", "Read"),
#   with the argument as a muted, quoted subject after it. The title used to
#   be "<Tool> · <first string argument>", so a host grepping for a sentence
#   headlined the card with that sentence, which read badly.
#   A reloaded card reads the same as a live one (the persisted chip's `op`,
#   written by the tool trail). The build card keeps its stage sentence as a
#   plain, unquoted continuation and never titles "Build build". Bundle
#   repacked.
# 0.11.1 (2026-09-04): "How much your Host explains" — a three-position
#   setting on the Personality pane (explain everything / explain new things /
#   use the terms), saved on click through PUT /api/brain/personality/
#   explanation (scope write:brain_personality, already held). The Host reads
#   it in its identity block and can move it for the user when they ask in
#   words (the `explanation_level` tool, same route). A setting
#   the user declares and changes live, never an inferred rating.
# 0.8.6 (2026-08-18): provenance printed. Every assistant turn's meta line
# now shows the model and provider that answered (it was a hover title) and
# flags a provider failover in amber — same stamp the Workbench prints.
# 0.8.5 (2026-08-13): ship the app's icon as a FILE. app.yaml had declared
# icon.png + icon-64.png since before either was produced, so every surface that
# loads the image rather than the shared glyph 404'd — the launcher's icon_url
# and the floating bubble's probe. The mark itself was never missing: it is the
# "linked rings" glyph at dashboard/base/js/icons.js:30, and CSeriesIcons.markup()
# prefers a glyph over icon_url (icons.js:90-93), which is why every other
# surface always drew it correctly. Same geometry, materialised as icon.svg with
# concrete colours (an <img> has no CSS context, so currentColor would render
# black). One SVG serves both declared sizes. Version bumped because the
# installed copy comes from native-bundles/circles.cseries, not from source — the
# bundle is repacked in this commit and the installer needs the version to move.
# 0.8.4 (2026-07-31): chat hardening (the circles-rich-chat WIP intent, rebuilt
# on current main). (1) Render-error firewall: a reusable ErrorBoundary wraps
# each pane, the message list, each message, the reply markdown, and each tool
# card — one hostile/malformed payload costs one card or one bubble, never the
# whole desktop (the 0.4.6 blank-screen mode, structurally closed). (2) The
# bare "working · Ns" line is now a tool-aware TurnStatus: phase labels driven
# by live tool frames ("Searching the web", "Writing the reply", "Calling
# <model>" when a thread pick is set) + the elapsed clock; model-picker/A-B
# chrome untouched. (3) Tool payloads serialize through safeStringify
# (circular-ref-proof, display-clipped at 50k chars) before the curated-shiki
# raw fold — highlight what it can, degrade to text. (4) A finished turn with
# no visible reply says so inline ("Finished without a reply — try again")
# instead of a silent bubble; covers persisted history and tools-ran-but-no-
# text turns the onDone invariant misses.
# 0.8.3 (2026-07-25): removed the offline mock fixtures and the ?mock=1 gate.
# They shipped in the bundle, so anyone could put the LIVE app into a state
# that rendered invented conversations, contacts and security policy. Safe to
# drop now that the panes they stood in for are real (routes/contacts.py,
# migrations/v048_circles_contacts_policy.sql). Also: the per-peer rule input
# no longer uses real people as its example.
# 0.8.1 (2026-07-21): declare write:brain_personality — the personality
# sliders 403'd because the scope addition shipped without a
# version bump and the only-ever-forward installer correctly skipped it.
# How the entity is briefed when active in this app. Rendered by
# runtime/prompt_builder._build_surface_role into the "## Where You Are"
# section. Replaces the hardcoded "if surface == 'circles'" body.
prompt_behavior:
  project_scoped: false
  what_it_is: >-
    Circles is the user's open conversational space, tied to no project. The window
    is a deck of cards. Their own card: its back is their conversation with you, by
    topic (threads they can rename, close, clear, delete or split), and its front is
    how people see them. A card for each person they know: the front is that
    person's chat with them, read only when its reading switch is on, and the back
    is that person's Host. Cards for Hosts with no person, rooms of Hosts, groups
    (roster, signed votes) and Support (support tickets and answers). Waiting on
    you: decisions you are waiting on them for, support drafts awaiting Send, and
    who is at the door. At the door: requests to connect, knocks, introductions,
    Hosts found on their machines, requests to use a machine. Coming up: the next
    events. Calendar, Response Shaping (Settings), who may reach them (Network) and
    search (Context) are other apps.
  user_path: "the Circles app, in the dock — a deck of cards: your own card (its back is your conversation with your Host), one for each person and Host you know, Waiting on you, and At the door"

provenance: standard
price_usd: 1.99
billing: one_time

window:
  title: Circles
  width: 1600
  height: 1000
  resizable: true
  min_width: 1120
  min_height: 720
  # Phone mode: render native full-width and reflow (rail -> bottom bar,
  # panes -> master-detail single column) instead of the shell's scale shim.
  mobile: responsive

permissions:
  - read:circles
  - write:circles
  - read:address_book
  - write:address_book
  - read:domain_policy
  - write:domain_policy
  - read:tickets
  - write:tickets
  - read:inbox
  - write:inbox
  # Coming up reads the next events; the Calendar app writes them (Circles
  # holds no write:calendar).
  - read:calendar
  - read:decision
  - resolve:decision
  - read:inference_catalog
  - write:inference_routing
  # The background-activity ribbon read GET
  # /api/inference/activity, which is gated on read:inference_log; since
  # 0.16.1 the working line above the box reads it for background failures
  # (server/routes/inference.py). App tokens are minted from THIS list
  # (server/routes/applications.py), so without the line the fetch
  # 403s and — being fire-and-forget — renders nothing and re-polls a dead
  # route forever, with no error anywhere. Read-only: the same scope the
  # Compute and Workbench apps already hold.
  - read:inference_log
  # The door's card (it was the Inbox's) for a `machine_request` reads the offer
  # row and the user's own machines (GET /api/network/bastions/machine-offers
  # and /api/network/bastions — both read:topology) and refuses one on
  # .../machine-offers/decline (write:network). Exactly the failure the note
  # above records, on a new surface: app tokens are minted from THIS list and
  # requires_permission has no system-app bypass, so without these two lines
  # both fetches 403, the offer never resolves, and the Share button stays
  # disabled with nothing on screen to say why. Accepting is resolve:decision,
  # already held — it is a widen like every other decision this app resolves.
  - read:topology
  - write:network
  # Groups. The door's card (it was the Inbox's) for a `group_join` reads the group so it
  # can name it (GET /api/groups/{id}, read:group) and answers it on
  # .../join-requests/{entity}/accept|deny (write:group). The SAME failure the
  # two notes above record, on a third surface — app tokens are minted from THIS
  # list (server/routes/applications.py) and requires_permission has no
  # system-app bypass (server/applications/middleware.py), so without these two
  # lines getGroup 403s, the card reads "wants to join grp-a1b2..." with no
  # group name, and both Accept and Deny fail with a generic error.
  #
  # Reach is bounded twice over: every group mutation is refused unless this
  # host OWNS the group (server/groups/roster.py _require_owner), and an invite
  # still requires the invitee to be an accepted contact. This is the first
  # manifest in the tree to declare either scope; they were admitted to the
  # publish allowlist for exactly this kind of consumer.
  - read:group
  - write:group
