# netavark writes the containers' network rules through iptables, not nftables.
# Its nftables rules use the fib expression in the inet family, and WSL's
# kernel has no nft_fib_inet (CONFIG_NFT_FIB_INET is unset in
# 6.6.87.2-microsoft-standard-WSL2), so every container failed to start with
# "Could not process rule: No such file or directory" (2026-10-21). The
# iptables path needs only modules that kernel ships, loaded through kmod.
[network]
firewall_driver = "iptables"
