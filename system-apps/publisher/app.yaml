id: publisher
name: Publisher
provenance: standard
description: Manage the apps you publish, set prices, and watch your sales flywheel.
icon: icon.svg
icon_small: icon.svg
entrypoint: index.html
system: true
# 0.3.10 (2026-10-01): the HTML escape helper escapes both quotes as well, so a
# value from the Host, a machine or a provider stays inside the attribute it
# is written into. App-only change.
# 0.3.11 (2026-10-18): the product is renamed C-Series (names, paths, env vars).
# 0.3.12 (2026-10-18): comments rewritten as plain rationale, with no tracker or review references; no behaviour change.
version: "0.3.12"
# 0.3.9 (2026-09-23): the flywheel card said sales credits land in a wallet
# that also pays for inference. There is no wallet;
# paid sales are Stripe Connect charges paid to the seller's own Stripe
# account. index.html copy only; no route, scope or schema change.
# 0.3.6 (2026-09-05): the Publish tab says what the store now accepts: a
# bundle the platform packed from a committed project, carrying its build record (attestation.json). A zip
# assembled by hand is refused by the bar with that reason — the copy said
# "zip the directory and drop it below", which is exactly the lane that
# closed. index.html only; no route, scope or schema change.
# 0.3.5 (2026-08-27): the version the publish-for-review UI needed and never
# got. An earlier change rewrote app.js/index.html/style.css for that lane
# — publishing now says it goes to human review, price is a disabled
# "Free — the store launches without pricing" field, the fork-policy picker
# arrived, and the third-party auto-install checkbox went (the lane refuses
# it). Both landed after 092c3e11 set 0.3.4, so the store upgrade (strictly
# newer only, default_install.py) would have skipped every one of those
# changes forever. No code change here — this is the bump that lets the
# shipped UI reach an install.
# 0.3.4 (2026-08-27): My-Apps empty state stops pointing users at
# scripts/app_store/publish.py — an operator-only CLI that lives in the
# platform repo and cannot be run from inside a pod. It now names the real
# lanes: build in the Workbench, publish from there (or via the host's
# publish_app tool), or drop a finished zip on the Publish tab.
# Environment-catalog facts (host-facing, code-true). Source for the L1
# topology block + describe_app — NOT a surface_role body (this is a control
# panel, not a conversational surface): what_it_is/user_path only.
prompt_behavior:
  what_it_is: "Publisher is where the user publishes apps they've built to the marketplace, sets pricing, and manages their published apps and earnings."
  user_path: "the Publisher app, in the dock"

window:
  title: Publisher
  width: 1000
  height: 720
  resizable: true
  min_width: 720
  min_height: 480

permissions:
  - read:billing
  - write:billing
  - publish:apps
  - read:address_book   # /api/hosts/cards — a buyer's contact-card name
