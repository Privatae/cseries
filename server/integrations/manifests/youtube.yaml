key: youtube
display_name: YouTube
categories: [video, google]

connection_kind: video
connection_provider: youtube

auth:
  mode: oauth2
  family: google
  authorize_endpoint: https://accounts.google.com/o/oauth2/v2/auth
  token_endpoint: https://oauth2.googleapis.com/token
  revoke_endpoint: https://oauth2.googleapis.com/revoke
  scopes:
    - https://www.googleapis.com/auth/youtube.readonly
    - https://www.googleapis.com/auth/userinfo.email
  extra_authorize:
    access_type: offline
    prompt: consent
    include_granted_scopes: "true"

proxy:
  base_url: https://youtube.googleapis.com/youtube/v3
  rate_limit:
    requests_per_minute: 60
    concurrent: 2

resources:
  - name: subscription_activity
    canonical_model: Video
    sync:
      strategy: incremental_poll      # activities.list since publishedAfter
      cursor_field: publishedAfter
      endpoint: activities.list
      page_size: 50
      poll_seconds: 600               # subs shouldn't burn quota
    signal:
      operation_read: read
      source_display: YouTube

reauth_triggers:
  - invalid_grant
  - unauthorized_client
