<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network">
  <rect width="256" height="256" rx="56" fill="#141A22"/>
  <rect x="0.5" y="0.5" width="255" height="255" rx="55.5" stroke="#1f2937"/>
  <!-- links (host hub → satellites) -->
  <g stroke="#374151" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="128" x2="68"  y2="72"/>
    <line x1="128" y1="128" x2="190" y2="80"/>
    <line x1="128" y1="128" x2="64"  y2="180"/>
    <line x1="128" y1="128" x2="188" y2="184"/>
  </g>
  <!-- one live link, accented -->
  <line x1="128" y1="128" x2="190" y2="80" stroke="#7fcfae" stroke-width="3" stroke-linecap="round"/>
  <!-- satellite gateway/peer nodes -->
  <g>
    <circle cx="68"  cy="72"  r="15" fill="#1B2430" stroke="#374151" stroke-width="3"/>
    <circle cx="64"  cy="180" r="15" fill="#1B2430" stroke="#374151" stroke-width="3"/>
    <circle cx="188" cy="184" r="15" fill="#1B2430" stroke="#374151" stroke-width="3"/>
    <!-- live node -->
    <circle cx="190" cy="80"  r="15" fill="#1B2430" stroke="#5fae7f" stroke-width="3"/>
    <circle cx="190" cy="80"  r="5.5" fill="#9be3c2"/>
  </g>
  <!-- host hub (center) -->
  <circle cx="128" cy="128" r="26" fill="#4F7F6A"/>
  <circle cx="128" cy="128" r="26" stroke="#9be3c2" stroke-width="2" opacity="0.5"/>
  <circle cx="128" cy="128" r="9" fill="#0E141B"/>
</svg>
