<style>/* ── The desktop's tokens (the default design, and two made-up ones) ───────── */
:root{
  --cseries-ink:#0A0E0F; --cseries-night:#0E1416; --cseries-twilight:#131B1D; --cseries-silk:#1A2427; --cseries-veil:#223034;
  --cseries-mist:#263135; --cseries-mist-strong:#3B4C51;
  --cseries-paper:#E5E7EB; --cseries-linen:#9CA3AF; --cseries-ash:#6B7280;
  --cseries-ember:#4F7F6A; --cseries-dusk:#7fcfae; --cseries-moss:#5fae7f; --cseries-clay:#c75f55; --cseries-gold:#c2a86b;
  --cseries-bright:#9be3c2; --cseries-glow:rgba(127,207,174,0.45);
}
:root[data-desktop="light"]{
  --cseries-ink:#E3E7E1; --cseries-night:#FAFBF8; --cseries-twilight:#FFFFFF; --cseries-silk:#FFFFFF; --cseries-veil:#FFFFFF;
  --cseries-mist:#D3DAD1; --cseries-mist-strong:#B6C0B4;
  --cseries-paper:#1B2420; --cseries-linen:#4A5650; --cseries-ash:#68736D;
  --cseries-ember:#2E6B55; --cseries-dusk:#22624C; --cseries-moss:#3D8C64; --cseries-clay:#B4473B; --cseries-gold:#B07A16;
  --cseries-bright:#8FDCB9; --cseries-glow:rgba(46,107,85,0.30);
}
:root[data-desktop="warm"]{
  --cseries-ink:#15110E; --cseries-night:#1D1814; --cseries-twilight:#26201B; --cseries-silk:#2F2721; --cseries-veil:#382F28;
  --cseries-mist:#3A312A; --cseries-mist-strong:#56493E;
  --cseries-paper:#F2E8DA; --cseries-linen:#C9B9A3; --cseries-ash:#A08F7B;
  --cseries-ember:#7D9A57; --cseries-dusk:#B4CF8A; --cseries-moss:#8EB86A; --cseries-clay:#D46E52; --cseries-gold:#E2A646;
  --cseries-bright:#CFE6A3; --cseries-glow:rgba(180,207,138,0.40);
}

/* ── Every colour below comes from those tokens ───────────────────────────── */
:root{
  --desk:var(--cseries-ink);
  --surface:var(--cseries-night);
  --raised:var(--cseries-twilight);
  --raised2:var(--cseries-silk);
  --line:var(--cseries-mist);
  --line2:var(--cseries-mist-strong);
  --ink:var(--cseries-paper);
  --ink2:var(--cseries-linen);
  --ink3:var(--cseries-ash);
  --accent:var(--cseries-ember);
  --accent-text:var(--cseries-dusk);
  --green:var(--cseries-moss);
  --amber:var(--cseries-gold);
  --red:var(--cseries-clay);
  --bright:var(--cseries-bright);
  --glow:var(--cseries-glow);
  /* Hosts carry a trace of the accent; people a trace of warmth. */
  --host-panel:color-mix(in oklab, var(--cseries-twilight) 90%, var(--cseries-ember));
  --host-raised:color-mix(in oklab, var(--cseries-silk) 86%, var(--cseries-ember));
  --person-panel:color-mix(in oklab, var(--cseries-night) 93%, var(--cseries-gold));
  --person-raised:color-mix(in oklab, var(--cseries-twilight) 88%, var(--cseries-gold));
  --amber-wash:color-mix(in oklab, var(--cseries-gold) 16%, transparent);
  --green-wash:color-mix(in oklab, var(--cseries-moss) 16%, transparent);
  --accent-wash:color-mix(in oklab, var(--cseries-ember) 22%, transparent);

  --serif:"C Newsreader", "Newsreader", Georgia, serif;
  --sans:"C Inter", "Inter", system-ui, sans-serif;
  --mono:"C Mono", "JetBrains Mono", ui-monospace, monospace;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:var(--accent-wash)}
.mono{font-family:var(--mono)}
.serif{font-family:var(--serif)}
.caps{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:color-mix(in oklab, var(--ink3) 35%, transparent);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

/* ── The mockup's own bar (not part of the design) ────────────────────────── */
#mockbar{position:fixed;inset:0 0 auto 0;height:34px;display:flex;align-items:center;gap:18px;padding:0 14px;
  background:var(--desk);border-bottom:1px solid var(--line);font:12px/1 var(--sans);color:var(--ink3);z-index:50}
#mockbar b{color:var(--ink2);font-weight:600}
#mockbar .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
#mockbar .seg button{padding:5px 9px;color:var(--ink3)}
#mockbar .seg button[aria-pressed="true"]{background:var(--raised2);color:var(--ink)}
#mockbar .grow{flex:1}
#mockbar .note{font-family:var(--mono);font-size:11px}
.app{position:fixed;inset:34px 0 0 0}

/* ── People are round, Hosts are square. Everywhere. ─────────────────────── */
.av{--s:32px;width:var(--s);height:var(--s);flex:none;display:grid;place-items:center;
  font:500 calc(var(--s)*.44)/1 var(--serif);color:var(--ink);position:relative;
  background:color-mix(in oklab, var(--hue) 46%, var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--hue) 60%, transparent)}
.av.person{border-radius:50%}
.av.host{border-radius:28%;font-style:italic;
  background:linear-gradient(155deg, color-mix(in oklab, var(--hue) 62%, var(--surface)), color-mix(in oklab, var(--hue) 30%, var(--surface)))}
.av.host::after{content:"";position:absolute;inset:3px;border-radius:24%;border:1px solid color-mix(in oklab, var(--ink) 14%, transparent)}
.av.group{background:none;box-shadow:none}

<script>/* Shared by the three Circles directions. The content is made up. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function frag(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

/* ── The mockup bar, the desktop switch, and fitting small screens ─────────── */
function mockbar(letter, name) {
  const bar = frag(`<div id="mockbar">
    <span><b>Circles · ${letter}</b> ${esc(name)}</span>
    <span class="grow"></span>
    <span>Desktop colours</span>
    <span class="seg" id="desk">
      <button data-d="default" aria-pressed="true">Default</button><button data-d="light" aria-pressed="false">Light</button><button data-d="warm" aria-pressed="false">Warm</button>
    </span>
    <span class="note">mockup · made-up content</span>
  </div>`);
  document.body.prepend(bar);
  $$("#desk button").forEach(b => b.onclick = () => setDesktop(b.dataset.d));
  const q = new URLSearchParams(location.search).get("desktop");
  if (q) setDesktop(q);
}
function setDesktop(d) {
  if (d === "default") delete document.documentElement.dataset.desktop; else document.documentElement.dataset.desktop = d;
  $$("#desk button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.d === d)));
}
function fit() {
  if (document.documentElement.dataset.device === "phone") { document.body.style.zoom = ""; return; }
  const w = window.innerWidth;
  document.body.style.zoom = w < 1240 ? String(w / 1280) : "";
}
window.addEventListener("resize", fit);

function popover(id, anchor, html) {
  let p = document.getElementById(id);
  if (!p) { p = frag(`<div class="pop" id="${id}"></div>`); document.body.appendChild(p); }
  if (p.classList.contains("open")) { p.classList.remove("open"); return; }
  $$(".pop.open").forEach(x => x.classList.remove("open"));
  p.innerHTML = html;
  const r = anchor.getBoundingClientRect();
  const z = parseFloat(document.body.style.zoom || "1");
  p.style.top = (r.bottom / 1 + 8) + "px";
  p.style.left = Math.max(10, Math.min(r.right - 360, window.innerWidth / z - 390)) + "px";
  p.classList.add("open");
}
document.addEventListener("click", e => {
  if (!e.target.closest(".pop") && !e.target.closest("[data-pop]")) $$(".pop.open").forEach(x => x.classList.remove("open"));
});
function comingUpHtml() {
  return `<h4>Coming up · this week</h4><ul>${COMING_UP.map(([w, t]) => `<li><span class="when">${esc(w)}</span><span>${esc(t)}</span></li>`).join("")}</ul>`;
}

function toast(msg) {
  let t = $(".toast"); if (!t) { t = frag(`<div class="toast"></div>`); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600);
}
function ballotHtml(b) {
  const total = b.choices.reduce((s, c) => s + c[1], 0) || 1;
  return `<div class="ballot"><div class="caps">Vote · ${esc(b.q)}</div>${b.choices.map(([c, n]) =>
    `<button class="bchoice"><span>${esc(c)}</span><span class="bbar"><i style="width:${Math.round(n / total * 100)}%"></i></span><span class="mono">${n}</span></button>`).join("")}
    <div class="bnote">${esc(b.note)}</div></div>`;
}

<script>

/* ── content ── */

const S = { card: "ana", flipped: false, thread: "dinner", peerThread: { juno: "lake", kestrel: "inv" },
  unread: {}, edgeNew: {}, ivyReads: {}, wrenSeen: false, priyaIn: false, supportSent: false, rules: { juno: "can message you", kestrel: "can message you", wren: "can message you" } };

    const me = m.who === "you", fr = m.fresh; m.fresh = false;
    const nm = group && !me ? `<span class="nmx">${esc(PEOPLE[m.who].short)}</span>` : "";
    const ask = !me && !group && cardId !== "support" ? `<button class="askivy" data-ask="${i}">${av("ivy", 13)} ask Ivy</button>` : "";
    out += `<div class="msg"><div class="pb ${me ? "me" : "them"} ${fr ? "fresh" : ""}">${nm}${esc(m.text)}</div>`;
    out += m.carriedNote ? `<div class="pt">↳ given to Ivy · only you see this</div></div>` : `<div class="pt ${me ? "me" : ""}">${esc(m.t)}${ask}</div></div>`;
  });
  return out;
}
function slipHtml(s) {
  if (s.state === "done") return `<div class="slip"><span class="st done">Answered</span><h4>${esc(s.title)}</h4><div style="font-size:13px;color:var(--ink2)">${esc(s.body)}</div></div>`;
  if (S.supportSent) return `<div class="slip"><span class="st">Sent · just now</span><h4>${esc(s.title)}</h4><div style="font-size:13px;color:var(--ink2)">The platform's team has it. Their answer lands here.</div></div>`;
  return `<div class="slip"><span class="st">Draft · not sent</span><h4>${esc(s.title)}</h4><div style="font-size:13px;color:var(--ink2)">${esc(s.body)}</div>
    ${s.share.map(([t, on]) => `<label><input type="checkbox" ${on ? "checked" : ""}> ${esc(t)}</label>`).join("")}
    <div class="acts"><button class="btn primary" id="sendTicket">Send</button><button class="btn quiet">Not now</button></div></div>`;
}
function hm(m, fresh) {
  if (m.carried) return `<div class="hm you ${fresh ? "fresh" : ""}"><div class="lb"><span class="w">You</span><span class="t">${esc(m.t)}</span></div><div class="quote"><small>from Ana's card</small>${esc(m.carried)}</div><div class="tx">${esc(m.text)}</div></div>`;
  const who = m.who === "you" ? "You" : (HOSTS[m.who] || PEOPLE[m.who]).name;
  return `<div class="hm ${m.who === "you" ? "you" : ""} ${fresh ? "fresh" : ""}"><div class="lb"><span class="w">${esc(who)}</span><span class="t">${esc(m.t)}</span></div><div class="tx">${esc(m.text)}</div>${m.meta ? `<div class="mt">${esc(m.meta)}</div>` : ""}${m.ask ? `<div class="asks">${m.ask.map(a => `<button class="btn">${esc(a)}</button>`).join("")}</div>` : ""}</div>`;
}
const corner = (label, avId, light) => `<button class="corner" data-flip title="Turn the card over">${light ? `<span class="light ${light}"></span>` : ""}<span class="lab">${avId ? av(avId, 16) : ""} ${esc(label)} ↻</span></button>`;

function renderFront() {
  const id = S.card, el = $("#front");
  if (id === "lake") { el.innerHTML = `<div class="blank">This card has no front: only Hosts sit in Lake weekend.</div>`; return; }
  if (id === "you") {
    el.innerHTML = `${corner("Ivy", "ivy")}<div class="chead"><span class="kind">● The front · how people see you</span>${av("you", 52)}<div class="who"><h2>You</h2><div class="sub">you@example.com</div></div></div>
      <div class="cbody">
        <div class="pcard"><h3>Your interests</h3><div class="tags"><span class="chip">film-photography</span><span class="chip">trail-running</span><span class="chip">sourdough</span></div><p style="color:var(--ink3);font-size:12px;margin-top:9px">When others list the same thing, you get an introduction at the door. Nobody is named to you, and you aren't named to them.</p></div>
        <div class="pcard"><h3>Who can reach you</h3><p>People: anyone with your email can ask to connect.</p><p>Hosts: only Hosts you connect, and Hosts on your machines.</p><a class="elsewhere">Change it in Network ›</a></div>
        <div class="pcard"><h3>Machines you're on</h3><p>studio-mac · Wren, Mara's Host, is on it too</p><p>your laptop</p><a class="elsewhere">Manage machines in Network ›</a></div>
      </div>`;
    return;
  }
  if (id === "support") {
    el.innerHTML = `<div class="chead"><span class="kind">● The platform's support team · people</span><span class="av team" style="--s:52px">?</span><div class="who"><h2>Support</h2><div class="sub">Ivy writes the ticket; you choose what's shared and send it</div></div></div>
      <div class="cbody" id="fbody">${pmsgs(SUPPORT, false, "support")}</div>`;
    return;
  }
  const group = id === "bookclub", p = PEOPLE[id], reads = S.ivyReads[id];
  el.innerHTML = `${group ? corner("Their Hosts", null) : p.host ? corner(HOSTS[p.host].name, p.host, id === "mara" && !S.wrenSeen ? "green" : null) : ""}
    <div class="chead"><span class="kind">● The front · ${group ? "people" : "a person"}</span>${group ? `<span class="stack">${av("ana", 42)}${av("mara", 42)}${av("theo", 42)}${av("june", 42)}</span>` : av(id, 52)}
      <div class="who"><h2>${group ? "Book club" : esc(p.name)}</h2><div class="sub">${group ? "5 people · every vote is signed" : `a person · ${esc(p.email)}`}</div></div>
      ${group ? "" : `<button class="chip readchip" id="reading" style="${reads ? "border-color:var(--accent-text);color:var(--accent-text);" : ""}margin-right:76px">${reads ? "Ivy can read this card" : "Ivy can't read this card"}</button>`}</div>
    ${reads ? `<div class="banner">${av("ivy", 18)} You let Ivy read this chat. ${esc(p.short)} sees this too.</div>` : ""}
    <div class="cbody" id="fbody">${pmsgs(CHATS[id] || [], group, id)}</div>
    <div class="composer"><textarea id="fin" placeholder="Message ${group ? "Book club" : esc(p.short)}"></textarea><button class="send" id="fsend">↑</button></div>`;
  const b = $("#fbody"); if (b) b.scrollTop = b.scrollHeight;
}
function renderBack(fresh) {
  const id = S.card, el = $("#back");
  if (id === "support") { el.innerHTML = ""; return; }
  if (id === "dad" || id === "priya") { el.innerHTML = `${corner(PEOPLE[id].short, id)}<div class="blank">${esc(PEOPLE[id].name)} hasn't connected a Host with you, so this side is blank.</div>`; return; }
  if (id === "bookclub") {
    el.innerHTML = `${corner("Book club", "ana")}<div class="chead"><span class="kind">■ The back · their Hosts</span><span class="stack">${av("juno", 40)}${av("wren", 40)}</span><div class="who"><h2>Book club's Hosts</h2><div class="sub">the roster, the signed votes, and the apps the circle shares</div></div></div>
      <div class="mini"><button><b>Roster</b><span>5 members · you created it</span></button><button><b>Votes</b><span>1 open · signed by each Host</span></button><button><b>Shared apps</b><span>Reading list</span></button></div>
      <div class="blank" style="margin-top:12px">The Hosts keep the circle's record. No Host reads the chat on the front.</div>`;
    return;
  }
  if (id === "lake") {
    el.innerHTML = `<div class="chead"><span class="kind">■ Hosts only</span><span class="stack">${av("juno", 40)}${av("wren", 40)}</span><div class="who"><h2>Lake weekend</h2><div class="sub">Juno (Ana's) and Wren (Mara's)</div></div></div>
      <div class="cbody">${LAKE_ROOM.filter(m => !m.day).map(m => hm(m)).join("")}</div>
      <div class="composer"><textarea placeholder="Ask Juno and Wren"></textarea><button class="send">↵</button></div>`;
    return;
  }
  const hostId = PEOPLE[id].host;
  if (hostId === "ivy") {
    const t = IVY_THREADS[S.thread];
    el.innerHTML = `${corner("You", "you")}<div class="chead"><span class="kind">■ The back · your Host</span>${av("ivy", 52)}<div class="who"><h2>Ivy</h2><div class="sub">Opus 5.5 · medium effort · <a style="color:var(--accent-text);cursor:pointer">how Ivy thinks is in Settings ›</a></div></div></div>
      <div class="tabs">${IVY_ORDER.map(k => `<button class="tab ${k === S.thread ? "on" : ""}" data-t="${k}">${IVY_THREADS[k].light && k !== S.thread ? `<span class="light ${IVY_THREADS[k].light}"></span>` : ""}${esc(IVY_THREADS[k].title)}</button>`).join("")}<button class="tab add" title="New thread">+</button></div>
      <div class="stands ${t.changed ? "changed" : ""}"><div class="caps">Where this stands</div><p>${esc(t.stands)}</p><div class="sf"><span>Ivy updated this ${esc(t.standsAt)}</span><span>so far <span class="mono">${esc(t.tokens)}</span></span></div></div>
      <div class="cbody" id="bbody">${t.msgs.map((m, i) => hm(m, fresh && i === t.msgs.length - 1)).join("")}${t.working ? `<div class="wk"><span class="working"><i></i><i></i><i></i></span>IVY IS WORKING</div>` : ""}</div>
      <div class="composer"><textarea id="bin" placeholder="Write to Ivy · ${esc(t.title)}"></textarea><button class="send" id="bsend">↵</button></div>`;
  } else {
    const h = HOSTS[hostId], pr = PEER_THREADS[hostId], person = PEOPLE[id];
    const tk = S.peerThread[hostId], t = tk ? pr.threads[tk] : null;
    const rule = `<span class="rule">${esc(h.name)} <button class="chip" data-rule="${hostId}">${esc(S.rules[hostId])} ▾</button></span>`;
    el.innerHTML = `${corner(person.short, id)}<div class="chead"><span class="kind">■ The back · ${esc(person.short)}'s Host</span>${av(hostId, 52)}<div class="who"><h2>${esc(h.name)}</h2><div class="sub">${esc(person.short)}'s Host, an AI${hostId === "wren" ? " · new on studio-mac, a machine of yours" : ""}</div></div></div>
      ${pr.reach.theirs.length ? `<div class="reach"><div><div class="caps">${esc(person.short)} lets you reach</div><ul>${pr.reach.theirs.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div><div class="caps">You let ${esc(h.name)} reach</div><ul>${pr.reach.yours.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div class="lim"><span>${esc(pr.reach.limits)}</span>${rule}</div></div>`
        : `<div class="reach"><div style="grid-column:1/-1;color:var(--ink3)">${esc(person.short)} hasn't let you reach anything yet, and you haven't let ${esc(h.name)} reach anything.</div><div class="lim"><span></span>${rule}</div></div>`}
      ${pr.order.length ? `<div class="tabs">${pr.order.map(k => `<button class="tab ${k === tk ? "on" : ""}" data-pt="${k}">${esc(pr.threads[k].title)}</button>`).join("")}<button class="tab add" title="New thread">+</button></div>` : ""}
      ${t ? `<div class="stands"><div class="caps">Where this stands</div><p>${esc(t.stands)}</p></div><div class="cbody">${t.msgs.map(m => hm(m)).join("")}</div>` : `<div class="blank">You and ${esc(h.name)} haven't talked yet.</div>`}
      <div class="composer"><textarea placeholder="Write to ${esc(h.name)}"></textarea><button class="send">↵</button></div>`;
  }
  const b = $("#bbody"); if (b) b.scrollTop = b.scrollHeight;
}
function flip() {
  if (S.card === "lake" || S.card === "support") return;
  S.flipped = !S.flipped;
  $("#card").classList.toggle("flipped", S.flipped);
  if (S.flipped && S.card === "mara" && !S.wrenSeen) { S.wrenSeen = true; renderDeck(); }
  updateHint();
}
function updateHint() {
  const noBack = S.card === "lake" || S.card === "support";
  $("#flipHint").textContent = noBack ? "" : S.flipped ? "the back · tap the corner for the front" : "the front · tap the corner for the back";
}
$("#card").addEventListener("click", e => {
  if (e.target.closest("[data-flip]")) { flip(); return; }
  const t = e.target.closest("[data-t]"); if (t) { S.thread = t.dataset.t; if (IVY_THREADS[S.thread].light === "green") IVY_THREADS[S.thread].light = null; renderBack(); renderDeck(); renderToday(); return; }
  const pt = e.target.closest("[data-pt]"); if (pt) { S.peerThread[PEOPLE[S.card].host] = pt.dataset.pt; renderBack(); return; }
  const ak = e.target.closest("[data-ask]"); if (ak) { askIvy(+ak.dataset.ask); return; }
  const rl = e.target.closest("[data-rule]"); if (rl) { const k = rl.dataset.rule; S.rules[k] = S.rules[k] === "can message you" ? "is blocked" : "can message you"; renderBack(); toast(`${HOSTS[k].name} ${S.rules[k]}. This was the Domain policy pane.`); return; }
  if (e.target.id === "reading") { S.ivyReads[S.card] = !S.ivyReads[S.card]; renderFront(); }
  if (e.target.id === "fsend") frontSend();
  if (e.target.id === "bsend") backSend();
  if (e.target.id === "sendTicket") { S.supportSent = true; renderAll(); toast("Sent. Only what you ticked went."); }
  const msg = e.target.closest(".msg"); if (msg && isPhone()) { $$(".msg.tap").forEach(x => x !== msg && x.classList.remove("tap")); msg.classList.toggle("tap"); }
});
$("#card").addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey) return;
  if (e.target.id === "fin") { e.preventDefault(); frontSend(); }
  if (e.target.id === "bin") { e.preventDefault(); backSend(); }
});
function frontSend() { const v = $("#fin").value.trim(); if (!v) return; (CHATS[S.card] = CHATS[S.card] || []).push({ who: "you", t: "Now", text: v }); renderFront(); }
async function backSend() {
  const v = $("#bin").value.trim(); if (!v) return;
  const t = IVY_THREADS[S.thread];
  t.msgs.push({ who: "you", t: "Now", text: v }); t.working = true; renderBack(true);
  await wait(1700); t.working = false;
  t.msgs.push({ who: "ivy", t: "Now", text: "On it. I'll write here when it's done.", meta: "Opus 5.5 · 2.2k tokens · $0.02" }); renderBack(true);
}
async function askIvy(i) {
  const m = CHATS[S.card][i];
  m.carriedNote = true; renderFront();
  toast("Given to Ivy, on Thursday dinner. Ana isn't told.");
  const t = IVY_THREADS.dinner;
  t.msgs.push({ who: "you", t: "Now", carried: m.text, text: "Can you move it?" });
  await wait(2200);
  t.msgs.push({ who: "ivy", t: "Now", text: "Moved to 7:30. Corvo confirmed, and Ana's invite now says 7:30.", meta: "Opus 5.5 · 3.4k tokens · $0.03" });
  t.stands = "Table for 2 at Corvo, Thursday 7:30 pm (moved when Ana asked). Ana's invite is updated."; t.standsAt = "just now"; t.tokens = "7.5k tokens · $0.06"; t.changed = true; t.light = "green";
  COMING_UP[0][0] = "Thu 7:30 pm";
  S.edgeNew.you = true; S.lift = "you";
  renderDeck(); renderToday(); if (S.card === "you") renderBack(true);
}

/* ── across every card (desktop column) ── */
function renderToday() {
  $("#today").innerHTML = `
    <div class="box"><div class="caps">Waiting on you</div>${waiting().map(([c, a, b, th]) => `<button class="item" data-go="${c}" ${th ? `data-th="${th}"` : ""}>${itemAv(c)}<b>${esc(a)}</b><span class="it2">${esc(b)}</span></button>`).join("")}</div>
    <div class="box"><div class="caps"><span>Coming up · from Calendar</span><a id="openCal">Open ›</a></div><div class="cu">${COMING_UP.map(([w, t]) => `<span class="w">${esc(w)}</span><span>${esc(t)}</span>`).join("")}</div></div>
    <div class="legend"><span class="s" style="border-radius:50%"></span>a person, always a human: the front of a card<br><span class="s" style="border-radius:2px"></span>a Host, an AI: the back of a card<br>Click the card you're holding to turn it over.</div>`;
}
$("#today").addEventListener("click", e => {
  if (e.target.id === "openCal") { toast("Opens the Calendar app."); return; }
  const g = e.target.closest("[data-go]"); if (g) goTo(g.dataset.go, g.dataset.th);
});

const GONE = [
  ["Conversations, Address book", "your cards: each card is the contact and the conversation"],
  ["Inbox", "at the door, at the bottom of your cards"],
  ["Tickets", "decisions: Waiting on you, and the card that asked. Support: its own card"],
  ["Calendar", "its own app. Circles shows what's coming up"],
  ["Search", "finding people, Hosts and conversations stays here. Searching everything Ivy knows moves to Context"],
  ["Response Shaping", "Settings, as its own section"],
  ["Bastions", "Network manages machines. A Host found on one of yours arrives at the door"],
  ["Domain policy", "who can reach you: Network, which already has it. Allow or block one Host: the back of its card"],
  ["Activity", "gone. Tool calls stay on Ivy's messages"],
  ["Settings", "the Settings app"],
];
const goneHtml = () => `<h4>Where the rail's panes went</h4><dl>${GONE.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl>`;
$("#goneBtn").onclick = e => popover("pop-gone", e.currentTarget, goneHtml());

function renderAll() { renderDeck(); renderFront(); renderBack(); $("#card").classList.toggle("flipped", S.flipped); renderToday(); updateHint(); }
if (!isPhone()) document.documentElement.dataset.screen = "card"; else document.documentElement.dataset.screen = "deck";
renderAll();

(async () => {
  await wait(2600);
  CHATS.ana.push({ day: "Today" }, { ...LIVE_ANA, fresh: true });
  if (S.card !== "ana" || (isPhone() && document.documentElement.dataset.screen === "deck")) S.unread.ana = "can we do 7:30?";
  S.lift = "ana"; renderDeck(); if (S.card === "ana") renderFront();
  await wait(2600);
  IVY_THREADS.backups.light = "green";
  IVY_THREADS.backups.msgs.push({ who: "ivy", t: "Today 02:00", text: "Nightly backup done: 1,284 files, 2.1 GB changed. Everything checks out.", meta: "Haiku 4.5 · 1.2k tokens · $0.00" });
  S.edgeNew.you = true; S.lift = "you"; renderDeck(); if (S.card === "you") renderBack();
})();
</script>
