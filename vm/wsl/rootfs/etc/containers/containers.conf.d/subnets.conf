# The subnets podman hands a network made without one (cseries.network's
# cseries_default, say): its own default pools (containers.conf(5)) less
# 10.89.78.0/23, which this guest's two fixed networks use. 10.89.78.0/24 is
# the local runtime's (vm/runtime/containers/cseries-apps.network) and
# 10.89.79.0/29 the remote-access door's (cseries-remote.network). podman
# never gives a new network a subnet another network already has, but a
# network made before one of those two could otherwise be given its /24, and
# that network then could not be made. The order is the default's, so the
# first network made here still gets 10.89.0.0/24.
# scripts/test_remote_door_loopback.py checks these against both networks.
[network]
default_subnet_pools = [
  {"base" = "10.89.0.0/18", "size" = 24},
  {"base" = "10.89.64.0/21", "size" = 24},
  {"base" = "10.89.72.0/22", "size" = 24},
  {"base" = "10.89.76.0/23", "size" = 24},
  {"base" = "10.89.80.0/20", "size" = 24},
  {"base" = "10.89.96.0/19", "size" = 24},
  {"base" = "10.89.128.0/17", "size" = 24},
  {"base" = "10.90.0.0/15", "size" = 24},
  {"base" = "10.92.0.0/14", "size" = 24},
  {"base" = "10.96.0.0/11", "size" = 24},
  {"base" = "10.128.0.0/9", "size" = 24},
]
