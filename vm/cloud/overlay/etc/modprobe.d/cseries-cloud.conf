# br_netfilter is never loaded on a cloud box. With it, frames bridged between
# two containers of one network (the Host and its database, its apps, its
# remote-access door) pass through the IP hooks, where door.nft's forward
# chain drops every new connection to a private range: each of those hops
# would be cut. Nothing on the box uses it (netavark does not), and a request
# to load it, a module's dependency or `modprobe br_netfilter`, fails here.
# cseries-firewall load turns its hooks off where a kernel has it anyway.
install br_netfilter /bin/false
