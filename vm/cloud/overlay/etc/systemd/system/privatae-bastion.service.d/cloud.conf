# On the cloud box the bastion's outbound connections are limited by
# door.nft's bastion_vet, through a rule that names this service's cgroup.
# systemd makes that cgroup anew at each start and ExecStartPre already runs
# inside it, so the rule is loaded here, before the bastion starts.
[Unit]
After=cseries-firewall.service
Wants=cseries-firewall.service

[Service]
ExecStartPre=/usr/local/sbin/cseries-firewall bastion
