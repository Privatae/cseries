# WordCraft Engine: the open-source WordCraft
# word processor (github.com/storytold/wordcraft, MIT or Apache-2.0), run headless for the
# Host. The program is in the creative toolchain image, pinned by sha256
# (sidecars/app-runtime-creative/crafts.txt); this app is a recipe: the command
# starts the image's own MCP bridge (creative_mcp.py), and `mcp` makes that
# server one of the Host's connections when the app is installed
# (manifest.McpSpec). The whole ArtCraft set, so a person can
# make everything they need. Memory: 41 MB for a short document, 200 MB for 146 pages saved as DOCX and
# PDF (measured). vcpus 1: everything finished under 0.25 s, as fast
# on 1 CPU as on 4.
# A window is billed at its ceiling.
id: wordcraft-engine
name: WordCraft Engine
description: Your Host writes documents with WordCraft, an open-source word processor with styles, lists, tables and Word files. It drafts, formats and saves your documents as Word files or PDFs, and everything it makes appears in this window.
icon: icon.png
icon_small: icon-64.png
# 1.0.1 (2026-10-18): the product is renamed C-Series (names, paths, env vars).
# 1.0.2 (2026-10-18): comments rewritten as plain rationale, with no tracker or review references; no behaviour change.
version: "1.0.2"
provenance: standard
entrypoint: index.html
permissions: []
network: []
resources:
  baseline_memory_mi: 512
  vcpus: 1
runtime:
  kind: process
  image: creative
  command: ["python3", "/opt/app-runtime/creative_mcp.py", "wordcraft"]
  ready_path: /health
  ready_timeout_seconds: 120
mcp:
  path: /mcp
window:
  title: WordCraft Engine
  width: 900
  height: 640
  resizable: true
prompt_behavior:
  what_it_is: |
    WordCraft Engine is the person's own word processor that you operate: an MCP
    server named wordcraft-engine (skill 'wordcraft-engine' says how). Its window shows the files
    you made there.
  user_path: "the WordCraft Engine app (install it from the App Store)"
