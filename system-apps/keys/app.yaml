id: keys
name: Keys
description: Store and govern your credentials — provider keys, harness sign-ins, site databases, SSH keys — sealed so only you can read them. Deactivate any key temporarily instead of revoking it.
icon: icon.svg
icon_small: icon.svg
entrypoint: index.html
provenance: standard
system: true
# 0.1.1 (2026-08-05): copy pass for the provider/model routing rework — the
# provider-slot strip and the add modal now say explicitly that the API key
# slot is the default (model routing runs on it) and the OAuth token slot is
# only for a login surface the user builds themselves.
# 0.2.0 (2026-08-06): rebuilt as a MENU, not a wall of cards (a wall of
# individual bubbles was confusing; a clean menu with working buttons). Five
# sections on the left — Providers (first-party vs generic, the split the
# platform routes on), Builders (each coding harness and the credential it
# runs on, with Connect running the vendor's OWN login through the host),
# Sites, Privatae, Vault — one credential row shape throughout, and a single
# delegated click handler so no button can go dead after a re-render.
# 0.3.0 (2026-08-06): the providers pass (same day). "Generic" is now
# Marketplace Providers (OpenRouter, DeepInfra, Together, Fireworks, Groq) and
# marketplace slots are API-KEY-ONLY — there is no OAuth surface at a reseller
# (the /api/vault/providers slot list drives this, so no stale OAuth row can
# render). The Builders tab is GONE: it conflated the Providers tab (what key
# could opencode possibly have? — that is the provider you pick in the
# Orchestrator's coding matrix); harness credentials live in the Vault now.
# Every stored key gains Deactivate/Activate next to Revoke — a temporary
# off-switch backed by vault_envelope.deactivated_at: the value stays sealed,
# every resolver reads it as absent, Activate restores it with no re-issue.
# 0.3.1 (2026-08-25): prompt_behavior said "SSH keys, API keys, and tokens",
# which left out the typed sign-ins the app actually stores and labels —
# claude_oauth "Claude sign-in", gitea_oauth, oauth_token, database_url,
# totp_secret (app.js:85-97). The omission answered the commonest question
# there is ("where do I connect my Claude subscription?") with the wrong app.
# Manifest-only change.
# 0.4.0 (2026-08-30): the Autofill section — the sites you saved form entries
# for, and which of them your Host may fill without you watching. The grant
# lives HERE and nowhere else: creating one is the user's own act, because
# a grant widens what happens unattended and must not originate from a model
# a hostile page can talk to.
# The Host can read a grant and revoke one — revoking only tightens — but only
# this screen creates one, confirmed explicitly, mirroring the widen/tighten
# asymmetry the Network app already applies to NAC grants.
# No new scopes: read:vault + write:vault already cover
# /api/browser/forms{,/grants}. MINOR bump because the installer is
# only-ever-forward and this is a real surface change, not a manifest edit.
# 0.5.0 (2026-08-31): the OAuth slot stops pretending to be the user's
# job, and Reveal stops asking for a factor that isn't set up.
#   - The provider OAuth slot has NO Add button and no "build your own login
#     surface" copy. OAuth lights up once a harness is authenticated through the
#     Host; no login service is built for it. So the HOST
#     fills it — GET /api/vault/providers now reads the login artifact the
#     harness lane already sealed (harness:claude_oauth, harness:codex:credentials,
#     harness:grok:auth) and marks the slot `source: host`. It renders as a
#     status chip ("via Claude Code" / "Connect Claude Code"), never a control.
#     A provider no builder can sign into gets no slot at all rather than a dark
#     box. A legacy pasted <provider>-oauth still counts and still routes.
#   - The add modal's Credential picker is gone with it: an API key is the only
#     thing left to add, so there was nothing to choose between.
#   - Reveal CHECKS first (GET /api/vault/stepup) and runs enrollment when no
#     factor exists, instead of opening a 6-box prompt for a code that cannot
#     exist and surfacing the truth only via the 409 after six digits.
#   - GOOGLE is now a provider. No app change — Keys renders the registry — but it shows
#     up here: server/vault/providers.py gained a `google` row on Google's own
#     OpenAI-compatibility base, and its sign-in slot is filled by Antigravity's
#     Google sign-in.
#   - resolve:decision added — WITHOUT IT THE ENROLLMENT THIS APP OFFERS COULD
#     NOT BE COMPLETED. POST /api/network/nac/stepup/confirm has always required
#     it (server/routes/network.py:545); Keys declared only write:network, so
#     Confirm 403'd and a first-time reveal was a dead end. Same scope, same
#     reason, as the Network app (system-apps/network/app.yaml:114).
# 0.5.1 (2026-09-04): the "Autofill" section is now "Sign-ins" — the site
#   logins the user saved in the Browser app, and the credential home of the
#   browser agents recorded there (the credentials must be identified
#   and sealed, as in a separate password vault). It already was one: per-site sealed entries with a standing grant. Labels
#   only; the section id, routes and grant table are unchanged.
# 0.5.2 (2026-10-01): the HTML escape helper escapes both quotes as well, so a
# value from the Host, a machine or a provider stays inside the attribute it
# is written into. App-only change.
# 0.6.0 (2026-10-05): sign-in for xAI is a button again. A user whose
#   only subscription is Grok has no model, so there is no Host to ask
#   "connect Grok" — and an xAI sign-in is a Host model path,
#   not only a coding engine's login. So this reverses 0.5.0's "a chip, never
#   a control" for the xAI sign-in slot ONLY: it always carries a button —
#   "Sign in with xAI" while there is no sign-in to use (none, or switched
#   off), "Reconnect with xAI" beside the chip once one is stored, and the
#   chip says Expired or Unreadable when a Host's model call would (the
#   server judges it with resolve_signin). That button is the way back the
#   Host's messages name ("press Reconnect with xAI on the xai row in the Keys
#   app"); the server sends its exact words as `signin_label`. The click
#   starts the same vendor sign-in the Host's harness_connections tool runs
#   (POST /api/vault/providers/xai/signin, then /signin/finish polled every
#   3 s for up to 15 minutes, the time the Host holds the sign-in pod). The
#   dialog links the vendor's page, shows a one-time code when there is one,
#   and ends on "Signed in with xAI" — plus "Your Host now runs on <model>"
#   when the Host had no Host model and the sign-in set one (only a model the
#   Host model standard lists eligible and xAI serves on the sign-in). Which
#   slot gets the button is the server's call (`signin_from_keys` on
#   /api/vault/providers); Claude Code, Codex and Antigravity stay chips.
#   No new scopes: the routes take write:vault, which Keys already declares,
#   and accept only the Keys app's own token.
# 0.6.1 (2026-10-18): comments rewritten as plain rationale, with no tracker or review references; no behaviour change.
version: "0.6.1"
# Environment-catalog facts (host-facing, code-true). Source for the L1
# topology block + describe_app — this is a control panel, not a conversational
# surface, so: what_it_is / user_path only.
prompt_behavior:
  what_it_is: |
    Keys is where the user keeps everything that proves who they are to
    somewhere else, locked in a vault the platform itself cannot read. It
    holds API keys, tokens, SSH keys, two-factor secrets, database
    connection strings, and SIGN-INS — a Claude sign-in, a gitea sign-in,
    other logged-in accounts. So when the user asks where to connect their
    Claude subscription, or any account they log into rather than paste a
    key for, this is the app.

    You never touch the raw value. You ask for an action and get the
    result back; the secret stays sealed. The user can see a value in the
    clear only in this app and only after their second factor — never in
    chat, so never offer to show one. Any stored item can be switched off
    without deleting it: everything then reads it as missing, and turning
    it back on restores it with no new key needed.
  user_path: "the Keys app, in the dock"

window:
  title: Keys
  width: 760
  height: 600
  resizable: true
  min_width: 520
  min_height: 380

permissions:
  - read:vault
  - write:vault
  # The reveal step-up reuses the host's existing second factor (the same one the
  # Network app enrolls): POST /api/network/nac/stepup/{enroll,confirm}.
  - write:network
  # …and CONFIRM is gated on resolve:decision, not write:network
  # (server/routes/network.py:545). Without this the app could start an
  # enrollment and never finish one — every first-time Reveal 403'd on Confirm.
  - resolve:decision
