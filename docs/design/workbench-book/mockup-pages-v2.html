<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pages — round 2 mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E6E1D6; --page:#FBFAF6; --ink:#1C2220; --ink2:#59625D; --ink3:#9AA19B; --rule:#E7E3DA;
  --green:#2E6A55; --mint:rgba(155,227,194,.6); --amber:#B7791F; --amberglow:rgba(244,184,96,.55); --mintglow:rgba(95,174,127,.55);
  --cc:#C46A3A; --cx:#4F5FCB;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --book-l:150px; --book-w:660px; --right-l:1012px;
}
#app.ci{ --book-l:262px; --book-w:610px; --right-l:1040px; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font:15.5px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{position:relative;width:100vw;height:100vh;min-width:1320px;min-height:760px;overflow:hidden;background:radial-gradient(1000px 760px at 45% 40%, #EEEAE1, var(--desk))}
#grain{position:absolute;inset:0;opacity:.32;mix-blend-mode:multiply;pointer-events:none}

/* top bar */
.bar{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;padding:0 28px;z-index:50}
.bar .who{font:500 11px Inter;letter-spacing:.18em;color:var(--ink2)} .bar .who b{color:var(--ink);font-weight:600}
.switch{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid #DDD7CA}
.switch button{border:0;background:transparent;font:500 12.5px Inter;color:var(--ink2);padding:5px 14px;border-radius:999px;cursor:pointer}
.switch button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(60,45,20,.12)}
.bar .clock{margin-left:auto;font:500 11px var(--mono);color:var(--ink3)}

/* contacts (Circles) */
#contacts{position:absolute;left:20px;top:64px;width:214px;bottom:24px;display:none;z-index:5}
#app.ci #contacts{display:block}
.ck{font:500 10px Inter;letter-spacing:.18em;color:var(--ink3);margin:6px 0 8px 10px}
.cv{display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(255,255,255,.5);border:1px solid #DDD7CA;margin:0 0 14px 6px;width:fit-content}
.cv button{border:0;background:transparent;font:500 12px Inter;color:var(--ink2);padding:4px 14px;border-radius:999px;cursor:pointer}
.cv button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(60,45,20,.12)}
.cv button i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);vertical-align:2px;margin-left:3px}
.contact{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;position:relative}
.contact:hover{background:rgba(255,255,255,.45)}
.contact.on{background:rgba(255,255,255,.75);box-shadow:0 1px 2px rgba(60,45,20,.08)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 13px Inter;color:#fff;flex:none;position:relative}
.av.host{border-radius:11px}
.av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid #EEEAE1;background:#5FAE7F}
.contact .n{font:500 13.5px Inter;color:var(--ink)} .contact .s{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.contact .u{position:absolute;right:10px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--amber);transform:translateY(-50%);box-shadow:0 0 0 4px rgba(244,184,96,.18)}

/* the book */
#book{position:absolute;left:var(--book-l);width:var(--book-w);top:62px;bottom:-30px;z-index:10;transition:left .4s, width .4s}
.under{position:absolute;inset:0;background:#F5F3ED;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 10px 28px rgba(60,45,20,.08)}
.page{position:absolute;inset:0;background:var(--page);border-radius:3px;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.05),0 2px 6px rgba(60,45,20,.06),0 30px 70px rgba(60,45,20,.14)}
.page.ghost,.page.sheet{z-index:40;transform-origin:0% 50%;transition:transform .72s cubic-bezier(.45,.05,.25,1), opacity .72s, box-shadow .72s;will-change:transform}
.page.sheet{transition:none}
.page.sheet.turn{animation:riff .46s cubic-bezier(.5,.05,.3,1) forwards;transform:none;opacity:1}
@keyframes riff{0%{transform:perspective(2400px) rotateY(0);opacity:1}80%{transform:perspective(2400px) rotateY(-78deg);opacity:1}100%{transform:perspective(2400px) rotateY(-96deg);opacity:0}}
.page.ghost.turn,.page.sheet.turn{transform:perspective(2400px) rotateY(-96deg);opacity:0;box-shadow:-30px 0 60px rgba(60,45,20,.25)}
.page .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(40,30,10,0),rgba(40,30,10,.16));opacity:0;transition:opacity .72s;pointer-events:none}
.page.turn .shade{opacity:1}
.inner{position:absolute;left:52px;right:52px;top:0;bottom:0}
.head{display:flex;justify-content:space-between;margin-top:24px;font:500 10.5px Inter;letter-spacing:.18em;color:var(--ink3)}
h1{font:400 40px/1.02 var(--serif);margin:12px 0 12px;letter-spacing:-.4px}
.stands{border-left:2px solid var(--green);padding:1px 0 1px 15px}
.stands .k{font:500 10px Inter;letter-spacing:.18em;color:var(--green);margin-bottom:4px}
.stands ul{margin:0;padding:0;list-style:none;font:400 16px/1.45 var(--serif)}
.stands li:before{content:"— ";color:var(--ink3)}
.hl{background:linear-gradient(transparent 55%, var(--mint) 55%);background-repeat:no-repeat;background-size:100% 100%}
.hl.sweep{animation:sweep 1.2s ease-out}
@keyframes sweep{0%{background-size:0% 100%}100%{background-size:100% 100%}}
.need{color:var(--amber)}
.tally{font:500 11px var(--mono);letter-spacing:0;color:var(--ink2);cursor:default;border-bottom:1px dotted #CFCABE;transition:color .3s}
.tally.bump{color:var(--green)}
.tk{font:500 10px var(--mono);letter-spacing:0;color:var(--ink3)}
.nudge{font:italic 400 14.5px var(--serif);color:var(--ink2);margin:8px 0 0 14px;border-left:2px solid #D9D4C8;padding-left:10px}
.nudge b{font:500 10px Inter;font-style:normal;letter-spacing:.14em;color:var(--ink3);margin-right:6px}
.working{font:500 10.5px Inter;letter-spacing:.14em;color:var(--ink3);margin:13px 0 0;display:flex;gap:8px;align-items:center}
.working i{width:6px;height:6px;border-radius:50%;background:#5FAE7F;animation:blink 1.1s infinite}
.stopl{font:500 11.5px Inter;color:var(--ink2);cursor:pointer;margin-left:8px;border-bottom:1px solid #D9D4C8}
.upd{font-size:11.5px;color:var(--ink3);margin:6px 0 0 17px}
.flow{position:absolute;left:0;right:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px);mask-image:linear-gradient(to bottom,transparent 0,#000 16px)}
.w{font:500 10.5px Inter;letter-spacing:.14em;color:var(--ink3);margin:13px 0 3px;display:flex;gap:9px;align-items:center}
.w b{color:var(--ink2);font-weight:600}
.tag{font:500 10px/16px var(--mono);letter-spacing:0;padding:0 6px;border:1px solid #DDD8CC;border-radius:8px;color:var(--ink2)}
.tag.eff{border-color:rgba(46,106,85,.4);color:var(--green)}
.you{font:600 15.5px/1.5 Inter;color:var(--ink)} .you p,.host p{margin:0 0 5px}
.host{font:400 17px/1.5 var(--serif);color:var(--ink)}
.marker{font:italic 400 13.5px var(--serif);color:var(--green);margin:12px 0 0;display:flex;gap:8px;align-items:baseline}
.marker:before{content:"";flex:none;width:18px;border-top:1px solid rgba(46,106,85,.4);transform:translateY(-4px)}
.num{font:500 14px var(--mono)}
.print{float:right;margin:-10px 0 0 16px;padding:4px 4px 11px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 18px rgba(60,45,20,.16);transform:rotate(2.2deg)}
.ledger{margin:8px 0 2px;font:400 14.5px var(--serif)}
.ln{display:flex;align-items:baseline;gap:8px;margin:4px 0}
.ln .dots{flex:1;border-bottom:1.5px dotted #CFCABE;transform:translateY(-4px)}
.ln .v{white-space:nowrap;font:500 12.5px var(--mono);color:var(--ink2)}
.pencil{height:2px;background:#E9E5DC;position:relative;overflow:hidden;border-radius:1px}
.pencil i{position:absolute;left:0;top:0;bottom:0;background:var(--cx);opacity:.6;transition:width .6s}
.opts{display:flex;gap:10px;margin:8px 0 4px}
.opt{flex:1;border:1px solid #E4DFD4;border-radius:10px;padding:10px 12px;background:#fff;font-size:13px;color:var(--ink2)}
.opt b{display:block;font:500 15px var(--serif);color:var(--ink)} .opt span{font:500 12px var(--mono);color:var(--green)}
.slip{position:relative;margin:13px 0 0 -6px;padding:10px 16px 9px;background:#FFF6E2;border:1px solid #F0DDB2;border-radius:2px;
  box-shadow:0 1px 1px rgba(0,0,0,.05),0 10px 22px rgba(120,80,10,.10);transform:rotate(-.6deg)}
.slip .q{font:500 16px var(--serif)} .slip .d{font-size:12.5px;color:var(--ink2);margin:1px 0 8px}
.sign{display:flex;align-items:center;gap:14px}
.sigbox{position:relative;width:230px;height:36px;border-bottom:1.5px solid #CDB98C;cursor:pointer;user-select:none;touch-action:none}
.sigbox span{position:absolute;left:0;bottom:5px;font:italic 400 13.5px var(--serif);color:#A48A55;pointer-events:none}
.sigbox svg{position:absolute;left:0;top:0;width:230px;height:36px;overflow:visible}
.slip .alt{font-size:12.5px;color:var(--ink2);cursor:pointer}
.stamp{position:absolute;right:14px;top:10px;font:600 11px Inter;letter-spacing:.2em;color:var(--green);border:2px solid var(--green);padding:2px 7px;border-radius:3px;transform:rotate(-8deg);opacity:0;transition:opacity .3s}
.stamp.on{opacity:.85}
.composer{position:absolute;left:0;right:0;bottom:34px}
.line{display:flex;align-items:flex-end;gap:14px;border-bottom:1.5px solid #D9D4C8;padding-bottom:7px}
.line textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:400 17.5px/1.5 var(--serif);height:28px;padding:0}
.line textarea::placeholder{color:#B2B5AE;font-style:italic}
.press{position:relative;width:42px;height:42px;border-radius:50%;border:1.5px solid #CFCABE;background:#fff;cursor:pointer;padding:0;touch-action:none;flex:none;box-shadow:0 2px 4px rgba(0,0,0,.06)}
.press svg{position:absolute;inset:0;width:100%;height:100%}
.lvl{position:absolute;right:0;bottom:58px;pointer-events:none;font:500 12px Inter;color:var(--ink);background:#fff;border:1px solid #E0DBD0;border-radius:999px;padding:5px 12px;opacity:0;transform:translateY(4px);transition:.15s;white-space:nowrap;box-shadow:0 6px 16px rgba(60,45,20,.1)}
.lvl b{font:600 11px var(--mono);color:var(--green);margin-right:6px;letter-spacing:.06em} .lvl.on{opacity:1;transform:none}
.chint{margin-top:7px;font-size:11.5px;color:var(--ink3)}
.archived-note{font:italic 400 13.5px var(--serif);color:var(--ink2);background:#F3F0E8;border-radius:6px;padding:6px 10px;margin-top:10px}

/* index page */
.ix-input{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding:6px 0 8px;margin-top:6px}
.ix-input svg{flex:none}
.ix-input input{flex:1;border:0;outline:0;background:transparent;font:400 22px var(--serif);color:var(--ink)}
.ix-input input::placeholder{color:#AEB2AB;font-style:italic}
.ix-mode{display:flex;gap:6px;margin:10px 0 2px;font-size:12px;color:var(--ink2);align-items:center}
.ix-mode button{border:1px solid #DDD8CC;background:#fff;border-radius:999px;padding:3px 10px;font:500 11.5px Inter;color:var(--ink2);cursor:pointer}
.ix-mode button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.results{position:relative;margin-top:12px}
.res{position:relative;border:1px solid #E4DFD4;background:#fff;border-radius:8px;padding:10px 14px 10px 14px;margin-bottom:8px;cursor:pointer;
  box-shadow:0 1px 2px rgba(60,45,20,.05);transition:box-shadow .2s}
.res:hover{box-shadow:0 6px 18px rgba(60,45,20,.12)}
.res .t{font:500 16.5px var(--serif);color:var(--ink);display:flex;gap:10px;align-items:baseline}
.res .t small{font:500 10px Inter;letter-spacing:.14em;color:var(--ink3)}
.res .s{font-size:13px;color:var(--ink2);margin-top:2px}
.res mark{background:var(--mint);color:inherit;padding:0 1px;border-radius:2px}
.res .go{position:absolute;right:12px;top:10px;font:500 11px Inter;color:var(--green);opacity:0}
.res.top{border-color:rgba(46,106,85,.45);box-shadow:0 0 0 3px rgba(155,227,194,.25)}
.res.top .go{opacity:1}
.res .rel{position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--green);opacity:.5}
.chapters{margin-top:14px}
.chapters .k{font:500 10px Inter;letter-spacing:.18em;color:var(--ink3);margin-bottom:8px}
.chaps{display:flex;gap:12px}
.chap{flex:1;cursor:pointer;position:relative;height:74px;border-radius:4px;background:linear-gradient(180deg,#F6F3EC,#EFEBE2);border:1px solid #E1DCD0;padding:10px 12px;
  box-shadow:0 1px 0 #fff inset, 3px 3px 0 -1px #F2EFE7, 3px 3px 0 0 #DED8CB, 6px 6px 0 -1px #F2EFE7, 6px 6px 0 0 #DED8CB;transition:transform .2s}
.chap:hover{transform:translateY(-2px)}
.chap b{font:500 17px var(--serif);display:block} .chap span{font-size:12px;color:var(--ink3)}

/* tabs */
#tabs{position:absolute;top:92px;bottom:118px;width:150px;left:calc(var(--book-l) + var(--book-w) - 8px);z-index:6;transition:left .4s}
.tab{position:relative;height:50px;margin-bottom:6px;padding:7px 24px 0 18px;border-radius:0 9px 9px 0;cursor:pointer;
  background:#EFEBE2;border:1px solid #DDD7CA;border-left:0;box-shadow:2px 3px 8px rgba(60,45,20,.07);transition:background .2s, box-shadow .3s, transform .2s}
.tab:hover{transform:translateX(4px)}
.tab .tt{font:500 13px Inter;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .ts{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .chip{position:absolute;right:10px;top:13px;width:7px;height:7px;border-radius:50%}
.tab.cur{background:var(--page);z-index:2;box-shadow:3px 3px 10px rgba(60,45,20,.10);border-color:#E4DFD4}
.tab.cur .tt{font-weight:600}
.tab.lit{background:#F2FBF6;border-color:rgba(95,174,127,.6);animation:glow 1.8s ease-in-out infinite}
.tab.lit .ts{color:var(--green)}
.tab.need{background:#FFF7E8;border-color:rgba(214,158,60,.6);animation:glowa 1.8s ease-in-out infinite}
.tab.need .ts{color:var(--amber)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 var(--mintglow)}50%{box-shadow:0 0 0 6px rgba(95,174,127,0),0 0 22px rgba(95,174,127,.45)}}
@keyframes glowa{0%,100%{box-shadow:0 0 0 0 var(--amberglow)}50%{box-shadow:0 0 0 6px rgba(244,184,96,0),0 0 22px rgba(244,184,96,.5)}}
#ixtab{position:absolute;bottom:58px;width:150px;left:calc(var(--book-l) + var(--book-w) - 8px);height:52px;z-index:6;cursor:pointer;
  background:var(--ink);color:#F3F1EA;border-radius:0 9px 9px 0;padding:8px 12px 0 18px;box-shadow:2px 4px 12px rgba(20,20,20,.18);transition:left .4s, transform .2s}
#ixtab:hover{transform:translateX(4px)}
#ixtab b{font:600 13px Inter;display:block;letter-spacing:.02em} #ixtab span{font-size:11px;color:#A9B0AA}
#ixtab svg{position:absolute;right:12px;top:13px}
#ixtab.cur{background:#2a3330}

/* right side: controls */
#right{position:absolute;left:var(--right-l);right:24px;top:64px;bottom:24px;z-index:5;transition:left .4s}
.sec{margin-bottom:20px}
.sec .k{font:500 10px Inter;letter-spacing:.18em;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between}
.ctl{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink2);margin:7px 0}
.ctl b{font-weight:500;color:var(--ink)}
.pill{border:1px solid #DDD7CA;background:rgba(255,255,255,.7);border-radius:999px;padding:3px 11px;font:500 12px Inter;color:var(--ink);cursor:pointer}
.seg{display:flex;border:1px solid #DDD7CA;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.6)}
.seg button{border:0;background:transparent;font:500 11.5px Inter;color:var(--ink2);padding:4px 10px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.meter{height:5px;border-radius:3px;background:#E1DCD1;overflow:hidden;margin-top:4px} .meter i{display:block;height:100%;background:var(--green);opacity:.7}
.wait{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:rgba(255,247,232,.85);border:1px solid #F0DDB2;margin-bottom:7px;cursor:pointer;font-size:13px}
.wait i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-top:6px}
.wait b{font-weight:500} .wait span{display:block;font-size:12px;color:var(--ink2)}
.day{display:flex;gap:10px;font-size:13px;color:var(--ink2);margin:6px 0} .day b{font:500 12px var(--mono);color:var(--ink);width:82px;flex:none}
#benchsvg{width:100%;height:auto;display:block;overflow:visible}
.score{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.score td{padding:5px 0;border-top:1px solid #E1DCD1;color:var(--ink2)} .score td.n{font:500 11.5px var(--mono);text-align:right;color:var(--ink)}
.score td b{font-weight:500}
.livebadge{font:500 10px Inter;letter-spacing:.12em;color:var(--green)}
.livebadge:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#5FAE7F;margin-right:6px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

#badge{position:absolute;right:20px;bottom:6px;font:11px var(--mono);color:#A29D91;z-index:60}
#toast{position:absolute;right:24px;top:58px;transform:translate(0,-8px);padding:7px 14px;border-radius:999px;background:#fff;border:1px solid #E0DBD0;color:var(--ink);font-size:12.5px;opacity:0;transition:.2s;z-index:80;pointer-events:none;box-shadow:0 6px 16px rgba(60,45,20,.1)}
#toast.on{opacity:1;transform:translate(0,0)}
.keys{position:absolute;left:var(--right-l);bottom:30px;font-size:11px;color:#A29D91;z-index:5}
.keys kbd{font:10px var(--mono);border:1px solid #D6D0C3;border-radius:4px;padding:0 4px;background:rgba(255,255,255,.6);color:var(--ink2)}
#app.ci .keys{display:none}
</style>
</head>
<body>
<div id="app" class="wb">
  <svg id="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .18 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="bar"><span class="who"><b>IVY</b> · YOUR HOST</span>
    <div class="switch"><button class="on" data-mode="wb">Workbench</button><button data-mode="ci">Circles</button></div>
    <span class="clock">TUE 21:49</span></div>

  <div id="contacts"></div>
  <div id="book">
    <div class="under" style="transform:translate(9px,7px) rotate(.35deg)"></div>
    <div class="under" style="transform:translate(5px,4px) rotate(.18deg)"></div>
    <div class="page current" id="pg"></div>
  </div>
  <div id="tabs"></div>
  <div id="ixtab" title="Index — type what you remember, or just write your message">
    <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#F3F1EA" stroke-width="1.5"><circle cx="5" cy="5" r="3.8"/><path d="M8 8l3 3"/></svg>
    <b>Index</b><span>type to find any page</span></div>
  <div id="right"></div>
  <div class="keys"><kbd>←</kbd><kbd>→</kbd> flip pages · <kbd>/</kbd> index · hold the ink button to think harder</div>
  <div id="toast"></div>
  <div id="badge">Mockup · sample content</div>
</div>

<script>

  if(flipping) return; flipping=true;

  const cover=pg.cloneNode(true); cover.removeAttribute('id'); cover.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id')); cover.classList.remove('current'); cover.classList.add('sheet');
  const nodes=[cover, ...sheets.map(s=>{ const d=document.createElement('div'); d.className='page sheet';
    d.innerHTML=`<div class="shade"></div><div class="inner"><div class="head"><span>${s.chapter.toUpperCase()} CHAPTER</span><span>${s.date.toUpperCase()}</span></div><h1>${s.title}</h1><div class="stands"><div class="k">WHERE THIS ENDED</div><ul><li>${s.text}</li></ul></div></div>`; return d; })];
  nodes.forEach((n,i)=>{ n.style.zIndex=60+nodes.length-i; book.appendChild(n); });
  open=landOn; renderPage(pg,landOn); renderTabs(false); renderRight();
  nodes.forEach((n,i)=>setTimeout(()=>n.classList.add('turn'), 60 + i*120 + (i>nodes.length-3? (i-(nodes.length-3))*110 : 0)));

    <div class="results" id="ixr"></div>
    ${mode==='wb'?`<div class="chapters"><div class="k">ARCHIVE · CHAPTERS</div><div class="chaps">${ARCH.map((c,i)=>`<div class="chap" data-c="${i}"><b>${c.chapter}</b><span>${c.pages.length} pages</span></div>`).join('')}</div></div>`:''}
  </div>`;
  const q=node.querySelector('#ixq');
  node.querySelectorAll('.ix-mode button').forEach(b=>b.onclick=()=>{ ixMode=b.dataset.m; const v=q.value; renderIndex(node); const q2=node.querySelector('#ixq'); q2.value=v; q2.focus(); drawResults(v,false); });
  node.querySelectorAll('.chap').forEach(c=>c.onclick=()=>{ const ch=ARCH[+c.dataset.c]; const sheets=ARCH.slice(0,+c.dataset.c+1).flatMap(x=>x.pages.map(p=>({...p,chapter:x.chapter}))); riffle(sheets.slice(0,-1), ch.pages[ch.pages.length-1].id); });
  q.addEventListener('input',()=>drawResults(q.value,true));
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); resurface(q.value); } if(e.key==='Escape'){ flipTo(order()[0]); } });
  drawResults('',false);
  setTimeout(()=>q.focus(),50);
}
let lastRes=[];
function drawResults(q,animate){
  const box=document.getElementById('ixr'); if(!box) return;
  const first=new Map([...box.querySelectorAll('.res')].map(r=>[r.dataset.id,r.getBoundingClientRect().top]));
  const res=search(q); lastRes=res;
  const max=Math.max(1,...res.map(r=>r.score));
  if(!res.length){ box.innerHTML=`<div class="res top" data-id="__new"><div class="t">A new page <small>NOTHING MATCHES</small></div><div class="s">${ixMode==='send'?'Enter starts a new page with your message on it.':'Nothing matches yet.'}</div><span class="go">↵ new page</span></div>`; return; }
  box.innerHTML=res.map((r,i)=>`<div class="res${i===0&&q.trim()?' top':''}" data-id="${r.id}">${q.trim()?`<span class="rel" style="opacity:${.15+.7*r.score/max}"></span>`:''}
    <div class="t">${esc(r.title)} <small>${r.live?'OPEN PAGE':r.where+' · '+r.date.toUpperCase()}</small></div><div class="s">${hlText(r.text,q)}</div>
    <span class="go">${ixMode==='send'?'↵ sends here':'↵ opens'}</span></div>`).join('');
  if(!q.trim()) box.insertAdjacentHTML('afterbegin','<div style="font:500 10px Inter;letter-spacing:.18em;color:var(--ink3);margin:0 0 8px">MOST RECENT</div>');
  box.querySelectorAll('.res').forEach(r=>r.onclick=()=>openResult(r.dataset.id,null));
  if(animate) box.querySelectorAll('.res').forEach(r=>{ const f=first.get(r.dataset.id); const l=r.getBoundingClientRect().top;
    r.style.transition='none'; r.style.transform= f==null? 'translateY(14px)':`translateY(${f-l}px)`; r.style.opacity= f==null? 0 : 1;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ r.style.transition='transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s'; r.style.transform=''; r.style.opacity=1; })); });
}
function resurface(text){
  const t=text.trim(); if(!t) return;
  const top=lastRes[0];
  if(ixMode==='find'){ if(top) openResult(top.id,null); return; }
  if(!top || (top.score<=0 && t.split(/\s+/).length>2 && search(t).length===0)){ // nothing matches: a new page, started by the message
    const id='p'+Date.now(); NOW+=1; pages[id]={title:t.split(/\s+/).slice(0,4).join(' '),kind: mode==='wb'?'PROJECT · NEW':'IVY · NEW PAGE',chip:'#2E6A55',t:NOW,status:'just started',stands:['Just started.'],upd:'',flow:[{marker:"Ivy started this page: nothing open matched what you wrote."}]};
    openResult(id,t); return;
  }
  openResult(top.id,t);
}
function openResult(id,message){
  if(id==='__new'){ resurface(document.getElementById('ixq')?.value||''); return; }
  const live=!!pages[id];
  const post=()=>{ if(!message) return; const p=pages[open]; if(!p) return;
    p.flow.push({marker:`Ivy picked this page for your message: ${pickReason(p)}`});
    p.flow.push({who:'you',time:'now',html:`<p>${esc(message)}</p>`}); NOW+=1; p.t=NOW;
    renderPage($('#pg'),open); renderTabs(true);
    setTimeout(()=>{ p.flow.push({who:'host',time:'now',html:`<p>Mockup reply. In the real thing the Host answers here, on the page it picked, and says so in the line above.</p>`}); renderPage($('#pg'),open); },1500); };
  if(live){ flipTo(id,{after:post}); return; }
  // archived: riffle back through the chapters, land on it, and bring it back to the top
  const a=findArchived(id); let sheets=[];
  for(const c of ARCH){ for(const p of c.pages){ if(p.id===id) break; sheets.push({...p,chapter:c.chapter}); } if(c.chapter===a.chapter) break; }
  if(message){ NOW+=1; pages[id]={title:a.title,kind:'BACK FROM THE '+a.chapter.toUpperCase()+' CHAPTER',chip:'#8C9B94',t:NOW,status:'back from '+a.chapter,
      stands:[a.text],upd:`Ivy brought this back from ${a.chapter}`,flow:[{marker:`This page was in the ${a.chapter} chapter; last written ${a.date}.`}]}; }
  riffle(sheets.slice(-7), id, post);
}
function pickReason(p){ return p.title==='Storefront'?'it is about checkout speed on phones.': p.title==='Checkout redesign'?'it is where checkout speed was last measured (September).':`it matches "${p.title}".`; }

// ─────────── signing (approvals) ───────────
function wireSign(sb,id){
  const sp=sb.querySelector('.sigpath'); const L=sp.getTotalLength(); sp.style.strokeDasharray=L; sp.style.strokeDashoffset=L;
  let st=null,raf; const slip=sb.closest('.slip');
  const step=()=>{ const p=Math.min(1,(performance.now()-st)/1250); sp.style.strokeDashoffset=L*(1-p); sb.querySelector('span').style.opacity=0;
    if(p>=1){ slip.querySelector('.stamp').classList.add('on'); st=null;
      if(id==='storefront'){ WB.storefront.need=false; WB.storefront.status='landed · watching it'; slip.querySelector('.q').textContent="Signed. The live site now serves Claude Code's version."; slip.querySelector('.d').textContent='Undo stays on this page for an hour.'; }
      else if(id==='resizer'){ WB.resizer.need=false; WB.resizer.status='approved · merging'; slip.querySelector('.q').textContent='Signed. "Resize all" is merging.'; slip.querySelector('.d').textContent=''; renderRight(); }
      else { slip.querySelector('.d').textContent='Signed and sent.'; }
      renderTabs(false); return; }
    raf=requestAnimationFrame(step); };
  sb.addEventListener('pointerdown',e=>{ if(slip.querySelector('.stamp').classList.contains('on')) return; e.preventDefault(); st=performance.now(); raf=requestAnimationFrame(step); });
  const stop=()=>{ if(st==null) return; cancelAnimationFrame(raf); st=null; sp.style.transition='stroke-dashoffset .3s'; sp.style.strokeDashoffset=L; setTimeout(()=>sp.style.transition='',320); sb.querySelector('span').style.opacity=1; };
  sb.addEventListener('pointerup',stop); sb.addEventListener('pointerleave',stop);
}

// ─────────── the ink button: hold to think harder ───────────
function drawPress(svg,level,holding,p){ svg.innerHTML=''; const r=holding?6+12*p:7;
  el('circle',{r,fill:'#1C3F33',opacity:holding?.92:.85},svg); if(holding) el('circle',{r:r+3,fill:'none',stroke:'#1C3F33','stroke-opacity':.15,'stroke-width':4},svg);
  for(let i=0;i<4;i++){ const a=(-90+i*90)*Math.PI/180; el('circle',{cx:18*Math.cos(a),cy:18*Math.sin(a),r:1.3,fill:i<=level?'#2E6A55':'#D6D1C5'},svg); } }
function wirePress(node,press,id){
  const svg=press.querySelector('svg'), lvl=node.querySelector('.lvl'), ta=node.querySelector('textarea'); drawPress(svg,defaultEff,false,0);
  let hold=null;
  const tick=()=>{ if(!hold) return; const T=performance.now()-hold.t0; if(T>240){ const p=Math.min(1,(defaultEff+1)/4-.12+(T-240)/2400); const li=Math.max(defaultEff,Math.min(3,Math.floor(p*3.999))); hold.level=li;
      lvl.innerHTML=`<b>${LV[li].k.toUpperCase()}</b>${LV[li].d}`; lvl.classList.add('on'); drawPress(svg,li,true,p);} hold.raf=requestAnimationFrame(tick); };
  const start=()=>{ if(hold) return; hold={t0:performance.now(),level:defaultEff}; tick(); };
  const end=()=>{ if(!hold) return; cancelAnimationFrame(hold.raf); const lv=hold.level, held=performance.now()-hold.t0>240; hold=null; lvl.classList.remove('on'); drawPress(svg,defaultEff,false,0);
    const v=ta.value.trim(); if(!v){toast('Write something first');return;} const p=pages[id]; if(!p) return;
    if(p.busy){ const wi=p.flow.findIndex(x=>x.working); p.flow.splice(wi<0?p.flow.length:wi,0,{nudge:true,time:'now',html:esc(v)}); p.nudged=(p.nudged||0)+1;
      renderPage($('#pg'),id); toast('Nudged. Ivy reads it before its next step.'); return; }
    p.flow.push({who:'you',time:'now',held:held?LV[lv].k:null,html:`<p>${esc(v)}</p>`}); p.flow.push({working:true}); p.busy=true; NOW+=1; p.t=NOW; renderPage($('#pg'),id); renderTabs(true);
    setTimeout(()=>{ p.flow=p.flow.filter(x=>!x.working); p.busy=false;
      const tk=[6200,11800,21400,38600][lv];
      p.flow.push({who:'host',time:'now',eff:held&&lv>=2?LV[lv].k:null,tk,html:`<p>Mockup reply at <em>${LV[lv].k}</em>${p.nudged?`, after reading your nudge`:''}. The block at the top would update after it, and the counter above just added this turn.</p>`}); p.nudged=0;
      if(open===id) renderPage($('#pg'),id); bumpTally(id,tk,tk*0.0000085); }, 4200+lv*500); };
  press.addEventListener('pointerdown',e=>{e.preventDefault();start();}); press.addEventListener('pointerup',end); press.addEventListener('pointerleave',()=>{ if(hold) end(); });
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(!e.repeat) start(); } });
  ta.addEventListener('keyup',e=>{ if(e.key==='Enter') end(); });
}

// ─────────── right side: controls ───────────
let cx={tests:15,secs:453,done:false};
function renderRight(){
  const r=$('#right');
  const effSeg=`<div class="seg">${LV.map((l,i)=>`<button data-e="${i}" class="${i===defaultEff?'on':''}">${l.k}</button>`).join('')}</div>`;
  if(mode==='wb'){
    const waits=Object.entries(WB).filter(([k,p])=>p.need).map(([k,p])=>`<div class="wait" data-go="${k}"><i></i><div><b>${p.title}</b><span>${p.stands.find(s=>s.includes('Waiting'))?strip(p.stands.find(s=>s.includes('Waiting'))).replace('Waiting on you: ',''):p.status}</span></div></div>`).join('');
    const ixSec = `<div class="sec"><div class="k"><span>THE INDEX</span><span>EVERY PAGE</span></div><div class="ctl" style="display:block;line-height:1.5">Searches the open pages and every chapter, by meaning and by words. With <b>sends it</b> on, Enter gives your message to the page Ivy picks, and Ivy writes on that page why it picked it.</div></div>`;
    const pageSec = `<div class="sec"><div class="k"><span>THIS PAGE</span><span>${pages[open]?esc(pages[open].title):''}</span></div>
        <div class="ctl"><span>Model</span><span class="pill" onclick="toast('Model picker opens here')">Opus 5.5 ▾</span></div>
        <div class="ctl"><span>Effort</span>${effSeg}</div>
        <div class="ctl" style="display:block"><div style="display:flex;justify-content:space-between"><span>Context</span><span style="font:500 11.5px var(--mono);color:var(--ink)">41k of 1M</span></div><div class="meter"><i style="width:6%"></i></div></div>
        <div class="ctl" title="${pages[open]?tallyTip(pages[open]):''}"><span>On this page, all turns</span><b style="font:500 12px var(--mono)">${pages[open]&&pages[open].tok!=null?fmtK(pages[open].tok)+' tokens · $'+pages[open].usd.toFixed(2):'—'}</b></div></div>`;
    const benchSec = `<div class="sec"><div class="k"><span>BENCH · STOREFRONT</span><span class="livebadge">${cx.done?'FINISHED':'LIVE'}</span></div><svg id="benchsvg" viewBox="0 0 380 118"></svg>
        <table class="score"><tr><td><b style="color:var(--cc)">Claude Code</b></td><td>usable in 1.1 s</td><td class="n">6:12</td><td class="n">$0.38</td></tr>
        <tr><td><b style="color:var(--cx)">Codex</b></td><td>${cx.done?'usable in 1.6 s':'testing '+cx.tests+'/20'}</td><td class="n">${cx.done?'8:02':Math.floor(cx.secs/60)+':'+String(cx.secs%60).padStart(2,'0')}</td><td class="n">${cx.done?'$0.21':'…'}</td></tr></table></div>`;
    const waitSec = `<div class="sec"><div class="k"><span>WAITING ON YOU</span><span>${Object.values(WB).filter(p=>p.need).length}</span></div>${waits||'<div style="font-size:13px;color:var(--ink3)">Nothing right now.</div>'}</div>`;
    r.innerHTML = (open==='__index' ? ixSec : pageSec) + benchSec + waitSec;
    drawBench();
  } else {
    const c=CONTACTS.find(x=>x.id===contact);
    r.innerHTML=`<div class="sec"><div class="k"><span>${c.host?'THIS HOST':'THIS CONVERSATION'}</span><span>${esc(c.name)}</span></div>
        ${c.id==='ivy'?`<div class="ctl"><span>Model</span><span class="pill" onclick="toast('Model picker opens here')">Opus 5.5 ▾</span></div><div class="ctl"><span>Effort</span>${effSeg}</div>`:`<div class="ctl"><span>Ivy may reply for you</span><span class="pill">ask first ▾</span></div><div class="ctl"><span>Can reach you</span><span class="pill">anytime ▾</span></div>`}</div>
      <div class="sec"><div class="k"><span>WAITING ON YOU</span><span>2</span></div>
        <div class="wait" data-go="inbox"><i></i><div><b>3 replies to sign</b><span>Inbox · Joel, Mara, the dentist</span></div></div>
        <div class="wait" data-go="gift"><i></i><div><b>Pick Sam's gift</b><span>3 options · order by the 1st</span></div></div></div>
      <div class="sec"><div class="k"><span>COMING UP</span><span>THIS WEEK</span></div><div class="day"><b>Thu 16:00</b><span>Pick up the framed print · Mara</span></div><div class="day"><b>Thu ${CI.ivy.dinner.status.includes('7:30')?'19:30':'19:00'}</b><span>Dinner with Ana · Corvo</span></div></div>`;
  }
  r.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ defaultEff=+b.dataset.e; renderRight(); const pg=$('#pg'); const svg=pg.querySelector('.press svg'); if(svg) drawPress(svg,defaultEff,false,0); const h=pg.querySelector('.chint'); if(h) h.innerHTML=`Enter sends at ${LV[defaultEff].k} · hold the ink button to think harder · drop files onto the page`; });
  r.querySelectorAll('.wait').forEach(w=>w.onclick=()=>{ const g=w.dataset.go; if(pages[g]) flipTo(g); });
}
function drawBench(){
  const s=document.getElementById('benchsvg'); if(!s) return; s.innerHTML='';
  const X=m=>40+m/9*330; // minutes → x
  for(let m=0;m<=9;m+=3){ el('line',{x1:X(m),x2:X(m),y1:12,y2:104,stroke:'#D9D3C6','stroke-dasharray':'2 3'},s); const t=el('text',{x:X(m),y:116,'text-anchor':'middle',fill:'#9AA19B','font-size':9.5,'font-family':'JetBrains Mono'},s); t.textContent=m+':00'; }
  const lanes=[{n:'CC',c:'#C46A3A',y:34,end:6.2,done:true,steps:[.3,.9,1.4,2.2,2.6,3.1,3.9,4.4,5.1,5.8],think:[[.5,1.2],[3.2,3.8]]},
               {n:'CX',c:'#4F5FCB',y:76,end:cx.done?8.03:cx.secs/60,done:cx.done,steps:[.4,1.1,1.6,2.9,3.4,4.2,5,5.6,6.3,6.9,7.3],think:[[1.7,2.7],[5.1,5.5]]}];
  lanes.forEach(L=>{ const t=el('text',{x:0,y:L.y+4,fill:L.c,'font-size':11,'font-family':'JetBrains Mono','font-weight':500},s); t.textContent=L.n==='CC'?'Claude':'Codex';
    // the strand: one line per engine, forked from the brief at 0:00
    el('path',{d:`M ${X(0)} 56 C ${X(.25)} 56, ${X(.2)} ${L.y}, ${X(.55)} ${L.y} L ${X(L.end)} ${L.y}`,stroke:L.c,'stroke-width':2.4,fill:'none','stroke-linecap':'round',opacity:.85},s);
    L.think.forEach(([a,b])=>{ if(a<L.end) el('rect',{x:X(a),y:L.y-5,width:X(Math.min(b,L.end))-X(a),height:10,rx:4,fill:L.c,opacity:.16},s); });
    L.steps.forEach(m=>{ if(m<L.end) el('circle',{cx:X(m),cy:L.y,r:2.3,fill:'#FBFAF6',stroke:L.c,'stroke-width':1.3},s); });
    if(L.done){ el('circle',{cx:X(L.end),cy:L.y,r:6.5,fill:L.c},s); el('path',{d:`M${X(L.end)-3} ${L.y}l2 2 4-4.2`,stroke:'#fff','stroke-width':1.6,fill:'none','stroke-linecap':'round'},s); }
    else { const h=el('circle',{cx:X(L.end),cy:L.y,r:9,fill:L.c,opacity:.18},s); h.innerHTML='<animate attributeName="r" values="6;11;6" dur="1.6s" repeatCount="indefinite"/>'; el('circle',{cx:X(L.end),cy:L.y,r:4,fill:L.c},s); }
  });
  el('circle',{cx:X(0),cy:56,r:4.5,fill:'#2E6A55'},s);
  const tb=el('text',{x:X(0)-8,y:60,'text-anchor':'end',fill:'#59625D','font-size':9.5,'font-family':'Inter'},s); tb.textContent='brief';
}

// ─────────── contacts (Circles) ───────────
function renderContacts(){
  const box=$('#contacts');
  const unreadPeople=CONTACTS.some(c=>c.view==='people'&&c.unread), unreadHosts=CONTACTS.some(c=>c.view==='hosts'&&c.unread);
  const list=CONTACTS.filter(c=>c.view===cview); const secs=[...new Set(list.map(c=>c.sec))];
  box.innerHTML=`<div class="cv"><button data-v="hosts" class="${cview==='hosts'?'on':''}">Hosts${unreadHosts&&cview!=='hosts'?' <i></i>':''}</button><button data-v="people" class="${cview==='people'?'on':''}">People${unreadPeople&&cview!=='people'?' <i></i>':''}</button></div>`
    + secs.map((sec,i)=>`<div class="ck"${i?' style="margin-top:14px"':''}>${sec}</div>`+list.filter(c=>c.sec===sec).map(cHTML).join('')).join('');
  box.querySelectorAll('.cv button').forEach(b=>b.onclick=()=>{ cview=b.dataset.v; renderContacts(); });
  box.querySelectorAll('.contact').forEach(n=>n.onclick=()=>{ if(contact===n.dataset.id) return; contact=n.dataset.id; pages=CI[contact]; const top=order()[0]; open=null; CONTACTS.find(c=>c.id===contact).unread=false; renderContacts(); flipTo(top); });
}
function cHTML(c){ return `<div class="contact${c.id===contact?' on':''}" data-id="${c.id}"><div class="av${c.host?' host':''}" style="background:${c.color}">${c.name[0]}${c.id==='ivy'||c.id==='ana'?'<i></i>':''}</div><div><div class="n">${c.name}</div><div class="s">${c.sub}</div></div>${c.unread?'<span class="u"></span>':''}</div>`; }

// ─────────── mode switch ───────────
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{ if(b.dataset.mode===mode) return; setMode(b.dataset.mode); });
function setMode(m){
  mode=m; document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('on',x.dataset.mode===m));
  $('#app').className=m; if(m==='wb'){ pages=WB; } else { contact='ivy'; pages=CI.ivy; renderContacts(); }
  const top=order()[0]; open=null;
  setTimeout(()=>{ renderPage($('#pg'),top); open=top; renderTabs(false); renderRight(); },10);
}

// ─────────── live events ───────────
setInterval(()=>{ if(cx.done) return; cx.secs++; const v=document.querySelector('[data-live="cxv"]'); if(v) v.textContent=`testing ${cx.tests}/20 · ${Math.floor(cx.secs/60)}:${String(cx.secs%60).padStart(2,'0')}`; if(mode==='wb') { const sc=document.querySelector('.score'); if(sc){ renderRight(); } } },1000);
const cxTick=setInterval(()=>{ if(cx.done) return; cx.tests++;
  document.querySelectorAll('[data-live="cxn"]').forEach(n=>n.textContent=Math.min(cx.tests,20)); document.querySelectorAll('[data-live="cxp"]').forEach(n=>n.style.width=Math.min(100,cx.tests/20*100)+'%');
  if(cx.tests>=20){ clearInterval(cxTick); setTimeout(()=>{ cx.done=true;
    WB.storefront.stands=[`Phones: 3.8 s now. <span class="hl sweep">Claude Code's change: 1.1 s. Codex's: 1.6 s.</span> Neither is live yet.`,`<span class="need">Waiting on you: which version lands.</span>`];
    WB.storefront.upd='Ivy updated this at 21:50'; WB.storefront.status='2 versions ready'; WB.storefront.flow[1].html=WB.storefront.flow[1].html.replace(/testing 15\/20 · 7:33/,'usable in 1.6 s ✓ · 8m 02s').replace('width:75%','width:100%');
    WB.storefront.flow[3]={slip:true,q:'Both are ready. Which one lands?',d:"Sign for Claude Code's (1.1 s), or tap Codex's (1.6 s) to switch the slip."};
    if(mode==='wb'&&open==='storefront') renderPage($('#pg'),'storefront');
    if(mode==='wb') land('storefront','Codex finished · 1.6 s');
  }, 900); }
}, demo?900:2300);
// another page lands while you're reading this one
setTimeout(()=>{ WB.newsletter.stands=[`Signup form built and tested; <span class="hl">the preview is ready</span>.`,`The confirmation email is drafted. Read it before it's connected.`]; WB.newsletter.upd='Ivy updated this at 21:49'; WB.newsletter.status='preview ready';
  WB.newsletter.flow.push({who:'host',time:'21:49',html:`<p>The signup form is in the preview: one field, one button, a thank-you line. The confirmation email is drafted below; read it before I connect it.</p>`});
  if(mode==='wb') { land('newsletter','preview ready'); toast('Newsletter signup — the preview landed'); } }, demo?3500:7000);
setTimeout(()=>{ const a=CONTACTS.find(c=>c.id==='ana'); a.unread=true; a.sub='can we do 7:30?'; CI.ivy.dinner.stands=[`<span class="hl">Ana asked for 7:30; Ivy moved the table.</span>`,`Corvo, Thursday 7:30 pm, away from the bar.`]; CI.ivy.dinner.status='moved to 7:30'; CI.ivy.dinner.upd='Ivy updated this just now';
  if(mode==='ci'){ if(contact==='ivy') land('dinner','moved to 7:30'); renderContacts(); } }, demo?5000:9000);

// keys: flip, index
window.addEventListener('keydown',e=>{
  if(e.target.closest('textarea,input')) return;
  const ids=order(); const i=ids.indexOf(open);
  if(e.key==='ArrowRight'&&i>=0&&i<ids.length-1) flipTo(ids[i+1]);
  if(e.key==='ArrowLeft'&&i>0) flipTo(ids[i-1]);
  if(e.key==='/'){ e.preventDefault(); flipTo('__index'); }
});
$('#ixtab').onclick=()=>flipTo('__index');

document.fonts.ready.then(()=>{ renderPage($('#pg'),open); renderTabs(false); renderRight(); });
window.addEventListener('resize',()=>{ fitFlow($('#pg')); });
