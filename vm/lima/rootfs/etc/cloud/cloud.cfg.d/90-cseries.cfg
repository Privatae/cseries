# The cseries guest's settings come only from the disk Lima attaches
# (NoCloud), so cloud-init asks no network service for any.
datasource_list: [NoCloud, None]

# Lima's network settings are written for systemd-networkd, which this guest
# runs (with systemd-resolved for DNS).
system_info:
  network:
    renderers: [networkd]
    activators: [networkd]
