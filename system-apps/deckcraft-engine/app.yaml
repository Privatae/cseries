# DeckCraft Engine: the open-source DeckCraft
# presentation program (github.com/storytold/deckcraft, MIT or Apache-2.0), run headless for the
# Host. The program is in the creative toolchain image, pinned by sha256
# (sidecars/app-runtime-creative/crafts.txt); this app is a recipe: the command
# starts the image's own MCP bridge (creative_mcp.py), and `mcp` makes that
# server one of the Host's connections when the app is installed
# (manifest.McpSpec). The whole ArtCraft set, so a person can
# make everything they need. Memory: 95 to 148 MB for a 3-slide deck; 555 to 579 MB exporting 61 slides
# with pictures to PDF (measured). vcpus 2: PDF export ran 1.6 to
# 1.7x faster on 4 CPUs than on 1.
# A window is billed at its ceiling.
id: deckcraft-engine
name: DeckCraft Engine
description: Your Host makes slide decks with DeckCraft, an open-source presentation program with themes, layouts, shapes, charts and PowerPoint files. It builds and edits your presentations, exports them to PowerPoint, PDF and images, and everything it makes appears in this window.
icon: icon.png
icon_small: icon-64.png
# 1.0.1 (2026-10-18): the product is renamed C-Series (names, paths, env vars).
# 1.0.2 (2026-10-18): comments rewritten as plain rationale, with no tracker or review references; no behaviour change.
version: "1.0.2"
provenance: standard
entrypoint: index.html
permissions: []
network: []
resources:
  baseline_memory_mi: 1024
  vcpus: 2
runtime:
  kind: process
  image: creative
  command: ["python3", "/opt/app-runtime/creative_mcp.py", "deckcraft"]
  ready_path: /health
  ready_timeout_seconds: 120
mcp:
  path: /mcp
window:
  title: DeckCraft Engine
  width: 900
  height: 640
  resizable: true
prompt_behavior:
  what_it_is: |
    DeckCraft Engine is the person's own presentation program that you operate: an MCP
    server named deckcraft-engine (skill 'deckcraft-engine' says how). Its window shows the files
    you made there.
  user_path: "the DeckCraft Engine app (install it from the App Store)"
