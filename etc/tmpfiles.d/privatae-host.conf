# The directory a C-Series Host and the bastion on the same machine share
# (server/network/local_bastion.py):
#
#   enroll.sock      the Host's; the bastion's `pair` redeems its token here
#   lane.sock        the Host's; the bastion's lane dials in here (mutual TLS)
#   runs/<id>.sock   the bastion's; one coder run's control plane each
#
# /run is a tmpfs, so the directory is made again at every boot. Install once,
# as root, on a machine with systemd:
#
#   groupadd --system privatae-host
#   install -m 0644 etc/tmpfiles.d/privatae-host.conf /etc/tmpfiles.d/privatae-host.conf
#   systemd-tmpfiles --create /etc/tmpfiles.d/privatae-host.conf
#
# and tell compose the group's id (in .env beside compose.yaml):
#
#   CSERIES_BASTION_GID=$(getent group privatae-host | cut -d: -f3)
#
# Without systemd, run the same two `install -d` lines at every boot, before
# the Host starts:
#
#   install -d -m 1770 -o root -g privatae-host /run/privatae-host
#   install -d -m 0750 -o root -g privatae-host /run/privatae-host/runs
#
# Then, with the Host up, pair the bastion on this machine to it (bastion
# 0.52.0 or later), with a token from the Host's "Set up a bastion":
#
#   sudo -H privatae-bastion pair --redeem-url unix:///run/privatae-host/enroll.sock <token>
#   sudo -H privatae-bastion set-mode networked
#   privatae-bastion device-init        on the device you approve with; prints its key
#   sudo -H privatae-bastion pin-device <key>
#   sudo -H privatae-bastion claim-anchor
#
# device-init and pin-device come BEFORE claim-anchor: an anchored machine
# with no approval device refuses the Host's coder grant and leaves no way to
# approve it.
#
# Why 1770 and not 0750: the Host runs as uid 1000 with no capabilities and
# must create enroll.sock and lane.sock here, which needs write on the
# directory; 0750 refuses it (EACCES). The sticky bit keeps what the group
# can do to its own files: the Host can replace its sockets but cannot rename
# or remove runs/ or anything else root made. runs/ stays 0750 root, so only
# the bastion creates run sockets and the Host can only connect to them.
d /run/privatae-host       1770 root privatae-host -
d /run/privatae-host/runs  0750 root privatae-host -
