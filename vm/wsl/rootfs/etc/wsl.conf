# WSL settings for the cseries distribution. WSL reads this file when the
# distribution starts.
#
# The distribution sees none of the machine: no Windows drives, no Windows
# programs, no Windows PATH. These switches live inside the guest, so they are
# a default and not a wall; the container hardening in
# /etc/containers/systemd is the barrier around the Host.

[boot]
systemd=true

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[user]
default=cseries
