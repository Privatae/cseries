# Remote access for a member's Host: open this Host from a phone or another
# computer anywhere, with nothing on this machine open to the internet.
#
#   docker compose -f compose.yaml -f compose.remote.yaml up -d --build
#
# compose.yaml alone is the local install, unchanged: this file only adds.
#
# How a browser gets in: the Host keeps a connection out to the network's
# relay (server/network/remote_tunnel.py). The relay passes a browser's
# still-encrypted connection down it, and the Host hands it to the door, a
# container of its own (sidecars/remote-door). The door ends TLS with the
# remote address's certificate, whose key is made in the door's volumes and
# never leaves this machine, asks the Host about every request, and passes on
# only what the Host lets in.
#
# THE RULE THIS FILE KEEPS. The Host lets a request from loopback in without
# a session. A browser from the internet must never arrive that way, so it
# reaches the Host only from the door's own address on the `remote` network
# below: the tunnel dials the door at its address (CSERIES_REMOTE_DOOR, never
# loopback; server/network/remote_access.py refuses one), and the door passes
# to the Host's address there. The door publishes no port, and the `remote`
# network is internal: nothing but the Host and the door is on it, and it has
# no way out. scripts/test_remote_door_loopback.py checks this file.
#
# The door reaches the Host's web port and nothing else. The Host listens on
# more than that on every address it has (the bastion's 8810 and 8811, the
# apps' egress lane on 13129, whatever an app binds), the remote network among
# them. In the WSL and Lima guests remote access's firewall filters the
# remote network's bridge (vm/wsl/rootfs/etc/cseries-remote/remote.nft).
# Compose has no filter between two containers on one network, so here the
# door filters itself: its container starts as root with NET_ADMIN, SETUID,
# SETGID and SETPCAP only, door-filter (sidecars/remote-door/door-filter)
# loads a table in the door's own network namespace that lets it open a
# connection to the Host's web port and nothing else, and take one from the
# Host's tunnel on its own port and nothing else, then drops every capability
# and runs the door as 1000:1000. If the table does not load, the door does
# not start. scripts/test_remote_door_compose_filter.py checks this.
#
# The two addresses are fixed so each side can name the other exactly. The
# default, 10.89.79.0/29, is the guest's (vm/wsl/rootfs/etc/containers/
# systemd/cseries-remote.network): outside 172.16.0.0/12, where WSL's NAT and
# Docker's default networks are, and 192.168.0.0/16, where home networks and
# Docker's later pools are. If it is in use on this machine anyway, set all
# three of CSERIES_REMOTE_SUBNET, CSERIES_REMOTE_HOST_ADDR and
# CSERIES_REMOTE_DOOR_ADDR to other values.
#
# The remote address is not set here: the owner turns remote access on in
# Settings, the network answers with the address, and the Host keeps it
# (server/network/remote_access.py) and writes what the certificate job needs
# into the remote-acme volume. CSERIES_REMOTE_URL and CSERIES_REMOTE_ZONE, when
# set, are used instead.

services:
  host:
    environment:
      # The remote address: https://<handle>.<address_id>.<zone>. Unset, the
      # one the network gave when the owner turned remote access on.
      CSERIES_REMOTE_URL: ${CSERIES_REMOTE_URL:-}
      # Where the tunnel hands browsers over: the door, on its own address.
      CSERIES_REMOTE_DOOR: ${CSERIES_REMOTE_DOOR_ADDR:-10.89.79.3}:8443
      # The door is the only proxy in front of the Host on that address:
      # its X-Forwarded-For (the browser's address) is believed, and only
      # its /__host/door question, carrying the door key, is answered.
      CSERIES_TRUSTED_PROXIES: ${CSERIES_REMOTE_DOOR_ADDR:-10.89.79.3}/32
      CSERIES_DOOR_SECRET_FILE: /run/cseries-door/door-secret
      # Where the Host writes the certificate job's inputs (its ACME account,
      # the acme-dns credential, cloud.json), and the job's last result.
      CSERIES_REMOTE_ACME_DIR: /var/lib/cseries-remote
      CSERIES_REMOTE_CERT_STATUS: /run/cseries-remote-cert/status.json
    volumes:
      - remote-door-key:/run/cseries-door:ro
      - remote-acme:/var/lib/cseries-remote
      - remote-cert-status:/run/cseries-remote-cert:ro
    networks:
      default: {}
      remote:
        ipv4_address: ${CSERIES_REMOTE_HOST_ADDR:-10.89.79.2}

  remote-door:
    build:
      context: .
      dockerfile: sidecars/remote-door/Dockerfile
    image: cseries-remote-door:dev
    restart: unless-stopped
    depends_on:
      - host
    # Root only until door-filter has loaded the door's table; the door itself
    # runs as 1000:1000 with no capability.
    user: "0:0"
    entrypoint: ["/usr/local/sbin/door-filter"]
    read_only: true
    pids_limit: 256
    environment:
      CSERIES_DOOR_BIND: ${CSERIES_REMOTE_DOOR_ADDR:-10.89.79.3}
      CSERIES_DOOR_PORT: "8443"
      CSERIES_TUNNEL_FROM: ${CSERIES_REMOTE_HOST_ADDR:-10.89.79.2}
      CSERIES_HOST_UPSTREAM: ${CSERIES_REMOTE_HOST_ADDR:-10.89.79.2}:8800
      # <address_id>.<zone>; unset, door-run reads it from cloud.json.
      CSERIES_REMOTE_ZONE: ${CSERIES_REMOTE_ZONE:-}
    volumes:
      - remote-door-key:/data/door-key
      - remote-door-tls:/etc/caddy/tls:ro
      - remote-acme:/etc/cseries-cloud:ro
    tmpfs:
      # Caddy's admin socket and its data, written by the door's own user: a
      # tmpfs is root's 0755 unless told otherwise.
      - /run/caddy:mode=1777
      - /tmp
    # No ports: only the Host's tunnel dials the door, on the remote network.
    networks:
      remote:
        ipv4_address: ${CSERIES_REMOTE_DOOR_ADDR:-10.89.79.3}
    cap_drop: [ALL]
    # Loading the table (NET_ADMIN) and leaving root for 1000:1000 with an
    # empty bounding set (SETUID, SETGID, SETPCAP); door-filter drops all four
    # before the door starts.
    cap_add: [NET_ADMIN, SETGID, SETPCAP, SETUID]
    security_opt:
      - no-new-privileges:true

  # The certificate job: the cloud box's cseries-cert, daily. It needs the
  # internet (Let's Encrypt and acme-dns), so it is not on the remote network,
  # and the door, which is, has no way out.
  remote-cert:
    image: cseries-remote-door:dev
    restart: unless-stopped
    depends_on:
      - remote-door
    user: "1000:1000"
    read_only: true
    pids_limit: 256
    entrypoint: ["/usr/local/sbin/door-cert", "--loop"]
    volumes:
      - remote-door-tls:/etc/caddy/tls
      - remote-cert-state:/var/lib/cseries-cloud
      # cloud.json (address_id, zone, ACME account label and server),
      # acme-dns.json and acme-dns-api.json, as on a cloud box, and the
      # Host's ACME account: what the Host writes when remote access is
      # turned on.
      - remote-acme:/etc/cseries-cloud:ro
      # Its last result, which Settings shows.
      - remote-cert-status:/var/lib/cseries-cert-status
    tmpfs:
      - /tmp
    networks:
      - default
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  remote:
    internal: true
    ipam:
      config:
        - subnet: ${CSERIES_REMOTE_SUBNET:-10.89.79.0/29}

volumes:
  remote-door-key:
  remote-door-tls:
  remote-cert-state:
  remote-acme:
  remote-cert-status:
