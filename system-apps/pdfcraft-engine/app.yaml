# PdfCraft Engine: the open-source PdfCraft
# PDF editor (github.com/storytold/pdfcraft, MIT or Apache-2.0), run headless for the
# Host. The program is in the creative toolchain image, pinned by sha256
# (sidecars/app-runtime-creative/crafts.txt); this app is a recipe: the command
# starts the image's own MCP bridge (creative_mcp.py), and `mcp` makes that
# server one of the Host's connections when the app is installed
# (manifest.McpSpec). The whole ArtCraft set, so a person can
# make everything they need. Memory: 28 MB for an ordinary edit, 92 MB rendering 256 pages, 1.65 to
# 1.74 GB once text recognition runs at 300 dpi (measured). vcpus 2:
# text recognition took 8.8 s a page on 1 CPU, 4.5 s on 2.
# A window is billed at its ceiling.
id: pdfcraft-engine
name: PdfCraft Engine
description: Your Host works on PDFs with PdfCraft, an open-source PDF editor with comments, forms, redaction and text recognition. It creates, combines, splits, marks up and saves your PDFs, and everything it makes appears in this window.
icon: icon.png
icon_small: icon-64.png
# 1.0.1 (2026-10-18): the product is renamed C-Series (names, paths, env vars).
# 1.0.2 (2026-10-18): comments rewritten as plain rationale, with no tracker or review references; no behaviour change.
version: "1.0.2"
provenance: standard
entrypoint: index.html
permissions: []
network: []
resources:
  baseline_memory_mi: 2048
  vcpus: 2
runtime:
  kind: process
  image: creative
  command: ["python3", "/opt/app-runtime/creative_mcp.py", "pdfcraft"]
  ready_path: /health
  ready_timeout_seconds: 120
mcp:
  path: /mcp
window:
  title: PdfCraft Engine
  width: 900
  height: 640
  resizable: true
prompt_behavior:
  what_it_is: |
    PdfCraft Engine is the person's own PDF editor that you operate: an MCP
    server named pdfcraft-engine (skill 'pdfcraft-engine' says how). Its window shows the files
    you made there.
  user_path: "the PdfCraft Engine app (install it from the App Store)"
