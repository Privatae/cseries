id: workbench
name: Workbench
description: The AI interface for building anything. Each project is a conversation with your host on one Code Repository — align, research, plan, then watch it build on your coding engines while everything runs live on the bench. Each change comes to you as a Code Approval in plain English; you approve it, or let the Host approve its own with Auto-Approve.
icon: icon.png
icon_small: icon-64.png
entrypoint: index.html
system: true
# 0.6.0 (2026-07-06): ground-up React rebuild (workbench-web/, the circles-web
# pattern — source at repo root, built assets placed here). The app is now
# project-first: project rail (each project = a chat thread + a workflow) ·
# the conversation with the host (same orchestrator as Circles, this surface
# prompt, project-scoped via /api/brain/messages + project_id-tagged memory) ·
# the bench (live coding runs + dispatched agents + the repo's PRs). The
# 0.5.x ladder/settings panels are gone: no user-facing routing config here —
# execution strategy is an alignment conversation with the host, not a form.
# 0.6.1 (2026-07-06, first live-test feedback): tool calls + dispatched agents
# render with the SAME cards as Circles (ported chat/tool-card.tsx — live
# agent status poll, cost, Kill veto); the bench keeps FINISHED agents visible
# with an output/failure fold (they used to vanish on completion); briefing
# gains two hard rules the test exposed: alignment before any dispatch, and
# the pool rule (agent `dispatch` refuses code-exec tools — building code is
# the build tool / review.fan_out, exactly the snag the host hit live).
# 0.6.2 (2026-07-06): project archive — trash button on the rail (soft
# delete: DELETE /api/projects/{id} -> status archived; archived projects
# leave every list so test projects stop confusing the host).
# 0.6.3 (2026-07-07, live-test fixes): (1) app-token delivery race — the
# shell wraps this iframe's fetch on 'load', which lands after React's
# mount fetches; requires_permission 401s a token-less call regardless of
# audit mode, so the app looked dead ("cant do anything"). Fix: retry-on-401
# in the api layer. (2) surfaces were the OLD blue-tinted cseries palette;
# remapped to the shared cseries green-black tokens (/css/tokens.css) — "kill
# the blue" (tokens.css:43).
# 0.6.5 (2026-07-11): agent delivery + live activity. (1) the bench matches
# the registry's real statuses/fields (in_progress, result/error/verdict —
# the old "running"/output/failure keys never matched the API, so agents
# looked finished and output never rendered); (2) running agents show the
# live tool-by-tool activity feed the registry now persists, finished ones
# open with their output prominent, a 'blocked' verdict says which code-exec
# tool was refused; (3) when an agent finishes, the chat pane refetches the
# thread so the host's delivered answer appears without a reload (rides the
# existing 3s bench poll — no new ws plumbing).
# 0.6.6 (2026-07-11): the bench becomes the full lifecycle view (the bar the
# retired factory surface set) + live-turn survival. (1) PLAN: the project's
# phases/steps with status, lazily folded; (2) RUNS: factory builds
# (factory_build registry rows from the gated build tool) join agents + fan-outs, per-variant
# rendered previews on done harnesses; (3) ACTIVITY: the project's merged
# live stream (/activity) while anything runs; (4) RESULT: the built app
# embedded from /user-apps/<id>/ with manual + build-completion refresh.
# (5) chat state is per-thread now — switching projects mid-turn no longer
# destroys the live stream; returning shows the turn still streaming.
# 0.6.7 (2026-07-11): briefing pool rule retaught for the gated build tool
# (plan → user's yes → per-phase pool builds); retired sdk_build/sdk_continue
# names purged (the prompt truth gate caught them post-retirement).
# 0.6.9 (2026-07-12): relay the host's open_app tool call to the desktop
# shell (cseries:open-app + deep-link view) — lets the host pop the Artifacts
# window from chat.
# 0.6.10 (2026-07-12): NO INVISIBLE BUILDS joins the briefing —
# user-facing surfaces get an approved artifact mock BEFORE dispatch; design
# iterates in direct responses, agents only wire.
# 0.7.0 (2026-07-14): mobile layout — window.mobile: responsive (opt out of
# the shell's phone-mode scale shim). Below md the three columns become one
# screen at a time behind a bottom tab bar (Projects / Chat / Bench); picking
# or creating a project jumps to Chat. Also fixes the chat pane's double
# scrollbar (same Conversation-wrapper overflow bug as circles 0.5.3).
# 0.8.0 (2026-07-18): the bench shows what the backend already runs. (1) run
# cards render the MoA arms off the dispatch manifest (Self-MoA samples per
# harness, vCPUs, minute cap, seeded vs greenfield — review.list_sessions now
# serializes them); (2) ACTIVE runs live-tail the SSE endpoint
# (/api/review/sessions/{id}/events, token-less status frames) so per-variant
# flips land within ~1s — the 3s poll stays as the fallback and completeness
# source, idle unchanged; (3) the Ladder section: climb runs (GET /api/ladder/
# runs) with expandable rung attempts (config, per-variant outcomes, watchdog
# verdicts, verify results, the evidence that climbed) and the human gate —
# Accept / Reject-with-note — on awaiting_review runs. Ladder routes ride the
# read:review / write:review scopes already granted below.
# 0.9.0 (2026-07-19): general-chat memory model + turn metrics (the
# cache→project design). (1) Every turn shows its timestamp; assistant turns
# add "took Ns · N tok (in/out)" from the runtime's per-turn metadata stamp
# (gen_ms/tokens_*/model at write_turn_row; live turns measure client-side
# and adopt the durable stamp on next load). (2) General is STAGING: the
# create dialog offers "bring the General conversation into this project" —
# POST /api/projects {adopt_thread} retags turns + derived memories into the
# project (never deletes) and leaves a marker turn behind; the general pane
# invalidates cleanly (never-wipe rule respected via explicit reset nonce).
# (3) Archived fold in the rail: soft-deleted projects are finally VISIBLE
# (list status='archived') with one-click restore — closes "deleted but
# where do they go".
# 0.10.0 (2026-07-20): composer upload → embedded project context. Paperclip
# on the chat composer uploads files to /api/brain/context/upload tagged
# project:<id> (general thread: untagged), so statements/CSVs/docs become
# embedded, host-searchable context for THAT project; an inline strip shows
# upload → embedding n/m → done per file (polls the per-file embed job).
# Live-test gap: there was no way to hand the host files
# from the surface where the work happens.
# 0.10.1 (2026-07-20): honest upload strip (batch-1 "stop the lying" sweep).
# The embed poll no longer caps at ~5min and then CLAIMS done (nor flips to
# done on one failed poll): it polls to a real terminal state with backoff,
# shows a paused job as "paused — retrying", and after 4 consecutive lost
# polls says it lost the job (error), never "done". job_id=null uploads now
# distinguish binary "stored" from text rows whose embedding was SKIPPED
# (backend's new embed_skipped reason) — the strip says so instead of
# implying the file is semantically searchable.
# 0.10.2 (2026-07-20): agent status cards can't go stale (batch-2 caps sweep,
# same change as circles 0.7.1): status poll runs to a terminal state with
# backoff instead of silently dying at ~6 min; agents list fetched with
# limit=100 so older still-running agents stay visible to the bench, the
# chat card, and delivery detection.
# 0.11.0 (2026-07-20): the experience pass (batch-4, the original bug
# list). (1) Agent cards in CHAT are no longer a black box: running agents
# show the live tool-by-tool activity feed (same registry data the bench
# renders), finished ones show their output/failure inline. (2) Delivery
# always lands: the post-agent thread refetch adopts on turn IDENTITY (a
# newest-60 window never grows at the cap, so the old length check could
# never fire on long threads) and waits up to ~60s for the delivery model
# call. (3) NOT JSON: tool cards render parameters and results as compact
# key→value prose with the raw payload behind a "raw" fold; long text folds,
# data never truncates. (4) "read" cards are titled by the INNER tool +
# subject ("Read · get_network — …"), never the bare meta-tool name.
# (5) Stop works after an auto-retry (the first attempt's cleanup was
# nulling the retry's abort controller).
# 0.11.2 (2026-08-04): governance floor disclosure — the chat header now
# carries the explicit "an AI, not a person" line (SB 243 / NY §1700).
# 0.12.0 (2026-08-18): provenance + context ledger (the Workbench was
# missing model provenance and the context each turn used).
# Every assistant turn's meta line now PRINTS the model and provider that
# answered (it was a hover title), flags a provider failover in amber, and
# carries a "context" toggle that opens the turn's context ledger — model
# calls with in/cached/out per call, system-prompt size, per-turn blocks,
# history turns/chars, tool-schema count/size, tool-result sizes. Live turns
# get it from the context frame; reloaded turns from the row's metadata.
# 0.12.1 (2026-08-19): honest blocked-agent caption — the ops pane prints the
# record's own blocked_reason (code-exec stripped / out of grant / grant too
# narrow) instead of one fixed "code work runs on the host's build lane"
# sentence, which mislabelled a grant refusal.
# 0.12.2 (2026-08-19): build cards name the harness ("build on kimi · failed")
# — the row carries it from open, so which builder ran is never inferred
# from error prose (a build ran on claude-code while the host said Kimi).
# 0.13.0 (2026-08-19): live delivery. The Workbench now subscribes to the
# kernel's /ws like Circles does — a finished agent/build push refetches
# the thread at once (the bench poll stays as fallback), and the kernel's
# "Finished / Couldn't finish" notification frames render as an in-app
# notice stack (they only ever reached the dashboard shell before). Row
# status now follows the run's outcome (a failed run is red, not green
# "completed · fail"), and a failed phase says failed.
# 0.13.1 (2026-08-20): the run surface (the build's live terminal renders
# inline under its chip) PLUS the landed result's FACE: a finished
# build's terminal block gains "open app", rendering the project's LANDED
# entry via the new /api/projects/{id}/preview (same asset-inlining + jail
# as the artifact render) in a sandboxed iframe. Origin: the finance build
# landed (index.html at the project root) and the user still had nothing to
# look at — and the host, with no read path into the landed tree, offered
# to redraw the app from spec instead of showing the real one.
# 0.13.2 (2026-08-20): fan-out rows on the bench. A chat review.fan_out now
# opens a registry row (task_type 'fan_out') like a build does, so the bench
# shows "fan-out on claude-code, kimi · in_progress" while it runs and the
# host's completion report lands in the thread. Pool rows (build + fan-out)
# share one rule: build-style card, project-scoped, no veto, RESULT refresh
# on finish. Origin: an Opus 5 fan-out ran clean for 203 s and the user saw
# neither a card nor a follow-up — the run had no row to be seen through.
# 0.13.3 (2026-08-20): n harnesses → n terminals. A review.fan_out chip now
# mounts ONE inline RunTerminal PER VARIANT under itself (live scrollback off
# the per-variant stream; Self-MoA samples are their own rows), and each
# finished variant gets its own "open app" rendering THAT harness's worktree
# via /api/review/sessions/{id}/preview/{harness} — nothing lands in the
# project until a pick/merge, so the project preview would be the wrong
# face. The session id rides the chip (live result; persisted chip carries
# session_id since this ship; older chips resolve it from their fan_out
# registry row). Origin: two clean claude-code fan-outs showed
# a chip and nothing else; a fan-out build of n should show n live views and
# n open-app buttons.
# 0.13.4 (2026-08-20): three kinks from the first claude-code builds.
#   - Project rail orders by MOST RECENT ACTIVITY (server last_activity_at =
#     newest of row update / chat turn in the thread / build against it);
#     sending into an older project moves it to the top at once, and a
#     delivery re-reads the order.
#   - The run terminal shows the SUBSTANCE: the prompt the host sent the
#     harness (collapsed header, full text on click), each tool call's
#     command/path/description (shell commands verbatim, clipped at 40
#     lines), and each result's output — it used to print "→ Bash" / "✓"
#     and nothing else ("users can't see what the host sends the coding
#     agent … same with commands the harness is running").
#   - Kernel side (same ship): the build delivery no longer restates the
#     harness's closing report that the run card already shows ("two
#     identical responses"); manifest prompt cap 2000 → 8000 chars.
# 0.13.5 (2026-08-21): the run terminal JOINS token deltas. Vendors stream
# prose and reasoning a word or two at a time — one grok build emitted 675
# such frames, and antigravity splits a sentence across its ACTIVE/DONE pair
# — and this surface rendered ONE LINE PER FRAGMENT (Bench had joined them
# since the grok fix; the Workbench half had no joining at all). foldFrame
# now appends chunks the parser marked `delta` into one block and closes it
# on any non-delta frame, so prose reads as prose and nothing is glued
# across a tool call.
# 0.14.0 (2026-08-22): the bench's right pane becomes a NUMBERED runs log:
# a collapsible log on the right, so a user can run down the numbered runs,
# click open app, and reference a run by number in the conversation.
#   - RUNS is now one row per harness_run, labelled #<id>, newest first,
#     inside a collapsible section. Expanding a row mounts the SAME
#     RunTerminal the chat feed uses, so the scrollback and the "open app"
#     button are the same component, not a second rendering of the truth.
#     The chat copy is untouched — the live feeds stay where they were.
#   - Why harness_run.id and not a fresh counter: the row already exists, it
#     is written one-per-(session, harness), so a 7-harness fan-out is 7
#     addressable rows — the unit the user actually has an opinion about.
#     It is unique across projects and it never dies (curate_harness_runs
#     strips transcripts, never rows), so a number said tomorrow resolves.
#   - The old per-session RunCards and the finished-agent cards are GONE;
#     that list showed the same work in a shape nothing could point at. What
#     survives is a "Working now" strip of work still IN FLIGHT, because a
#     dispatched agent has no harness_run row and a running one must never
#     be invisible here.
#   - Reads GET /api/compute/runs (already shipped, already covered by the
#     read:inference_log permission below) — no new route, no new scope.
#   - Kernel side (same ship): harness_transcript takes `run_id`, so the host
#     can resolve a run the user names by NUMBER. Its only address used to be
#     (session_id, harness) — a UUID plus a name — which nobody can say out
#     loud, so a spoken run reference had nothing to resolve against.
# 0.15.0 (2026-08-22): the bench pane keeps what points at something, and a
# run's buttons follow what that run produced.
#   - LADDER / ACTIVITY / RESULT sections are GONE (the ladder is not
#     always used, and activity was unnecessary). RESULT was also broken: it probed /user-apps/<id>/index.html
#     and framed /user-apps/<id>/, and the directory form is not served, so a
#     raw {"detail":"Not Found"} rendered in the iframe. Since run-scoped
#     worktrees it was stale by construction anyway. "Install as my app" is KEPT
#     — it merely lived inside that section — and moves beside "Publish as site"
#     under "Ship this project".
#   - OPEN APP now renders THIS run's own worktree, never the project's last
#     landed state. A finished backend run used to offer "open app" and show an
#     older frontend run. REVIEW DIFF sits beside it on every completed run —
#     a build worktree is seeded, so an inherited index.html cannot tell a UI
#     run from a backend one; the diff always can.
#   - The chat feed shows AUTO-ADVANCED phases live. The chat mounts a terminal
#     off a `build` tool chip, and a phase the approved-plan chain starts has no
#     tool call in any turn — so nothing moved in the conversation while it ran
#     and it only appeared when the host reported it ("it shows up when its
#     done ... the only thing i see is live activity in the right pane"). The
#     bench poll now reports running pool builds up; any without a chip get the
#     SAME RunTerminal below the thread. Not a synthetic tool chip: a tool call
#     the model never made would corrupt the history.
#   - The run terminal says when its LIVE FEED dies instead of freezing under a
#     pulsing "live" badge (kernel-side status/stream_lost frame).
# 0.15.1 (2026-08-22): a session that is not there YET is not a session that is
# MISSING. The chat mounts a run terminal the instant `build` returns its
# task_id, but the DETACHED build creates the session dir ~650ms later
# (measured on a live task: task row 18:38:23.891, session dir
# 18:38:24.545). The mount fetched ONCE and latched on that 404, printing "no
# recorded session (predates the run surface)" over a healthy, actively
# streaming build for the rest of its life — a race, so it hit some runs and
# not others, which is why 311-313 looked fine and 314 did not.
#   - The resolve now retries while the session is unresolvable (404, or a 200
#     whose manifest.json has not landed yet — the second half of the same
#     race), backing off to 2s, and only calls it missing after 30s.
#   - The message states what was observed, not a cause: a session can be
#     absent because the run predates the run surface, because the retention
#     sweep reclaimed it, or because it never started, and this component
#     cannot tell those apart.
# 0.15.3 (2026-08-25): prompt_behavior hardcoded the coding-engine roster and
# had gone stale twice over — it omitted grok AND antigravity, both in
# server/routes/review.py:81-82 HARNESS_APP_IDS. Replaced with a pointer to
# `coding_bench` (public_tool_registry.py:2145), which returns the connected
# engines, so the list cannot rot again. Also added the two shipped surfaces
# the block never mentioned: composer file upload (assets/index-DCOfKugF.js,
# POST /api/brain/context/upload) and the one-click "Publish as site" button
# on the bench. Manifest-only change.
# 0.16.0 (2026-08-28): the PR surface tells the truth, and can land the plan.
#   All four from one session on one project.
#   1. The PR section defaulted to the FIRST repo the gitea listed for the whole
#      account, because PrSection took no project id at all — so with a project
#      open it showed another project's pull requests, or an honest-looking
#      "no open pull requests" for a repo that was not this one. It now opens on
#      the selected project's own repo (projects.repo, which the list route has
#      always sent — projects.py:432 — and nothing had ever declared).
#   2. A phase's SAVE POINT is now on the bench: "committed <sha> to PR #N",
#      linked. sync_project_repo has written that since the pipeline shipped and
#      it was projected nowhere, so a phase could commit and open a PR with the
#      bench showing no trace — which reads as "the build did nothing".
#   3. Auto-merge PRs — a per-project opt-in under the PR section. One rolling
#      PR (host/build), each phase a commit inside it; with this on the host
#      merges that PR when the LAST phase of the approved plan lands clean, so
#      the plan finishes without stopping to ask. Off by default: the standing
#      rule is still that the user merges (workbench.py merge_pr). It refuses to
#      merge a PR carrying build-contract violations or a conflict.
#   4. A FAILED phase now gets one seeded retry (the failure text goes back to
#      the same harness), then the chain stops and says so. Before, failure hit
#      the `if ok:` guard: nothing ran and nothing explained why.
#   Backend: projects.py get/set_auto_merge (projects.config, no migration),
#   project_git.merge_project_pr, tools._phase_retry_pick, agent_dispatch
#   list_agents now projects repo_sync + auto_merge.
# 0.16.1 (2026-08-28): pasted keys are caught before they leave the composer.
#   Same strip as Circles 0.9.1: a credential shape in the draft (vendor API
#   key, PEM, JWT, bearer, URL password) holds the send — "Send redacted" or
#   "Edit message"; soft hits (assignment, high-entropy token) also offer
#   "Send as-is". Rules come from the one shared file
#   brain/mastercode/secret_shapes.json; the pod redacts the hard shapes at the
#   top of send_message regardless. Nothing scanned leaves the browser.
#   Plus "Store in Keys": one click seals the caught key into the vault (the
#   Keys app's own POST /api/vault/secrets; vendor keys on the canonical
#   provider name) and the message goes out with (stored in Keys as "…") in
#   its place. Adds write:vault for that one call.
# 0.16.2 (2026-09-02): stub projects speak. A fresh entity held a "Trading
#   software" project with a repo, zero phases and an empty description, and
#   nothing prompted "this has no plan — want me to draft one?".
#   list_projects now carries has_plan / phase_count / phases_ready /
#   phases_complete / last_phase_at and a hint on plan-less rows; the briefing
#   tells the host to surface a stub and offer the plan on selection. Prompt
#   copy only here; no route, scope, or schema change in the app.
# 0.16.4 (2026-09-03): placement rule in the briefing. A host found the
#   in-pod lane, called it merely feasible, and told the user to use a
#   bastion — nothing in the briefing or the skill
#   said where a personal app runs. Now it does: the pod by default, a site
#   when it is a site, a bastion only when the user names one or the work
#   needs their hardware (build-workflow skill, "Where it runs"). Prompt copy
#   only; no route, scope, or schema change. Kernel-side (same ship): a
#   dispatch round narrates EVERY agent it fired, the narration reaches the
#   screen even after streamed prose, and when the last agent of a project
#   round reports the host is woken to synthesize and continue the workflow
#   instead of leaving the reports in the thread with nobody acting.
#   "Where it runs" states the runtime lane the way 0.16.3 requires: the
#   lifetime is read from the "What this machine can run" block, and a 24/7
#   loop is runtime.lifecycle: resident, not a bastion.
# 0.16.5 (2026-09-03): desktops are artifacts, not app builds. A user asked
#   for a desktop here and the host scaffolded an app with coders — the
#   briefing said code runs only on the pool and every build follows the
#   build workflow, while the desktop skill says the document is written
#   in-turn. Now the briefing names the lane: one index.html on the desktop
#   contract; variety via review.fan_out across harnesses/models and the
#   user's pick; the host then lands the pick as an artifact + set_desktop
#   (the pointer only accepts an artifact — appearance.py
#   set_desktop_artifact). Same ship: the document's cseries-tokens meta
#   recolours the shell and every app. Prompt copy only; no route, scope, or schema change.
# 0.16.3 (2026-09-02): alignment at the user's altitude. A host planning
#   an always-on app argued runtime architecture in the
#   alignment conversation from an inferred (and false) model of what the pod
#   can run, decided the pod could not host it, and recommended a VPS — against
#   the standing rule that a personal app's runtime lives in the pod. Two
#   changes: the briefing now carries a "What this machine can run" block
#   generated by server/applications/build_contract.host_runtime_brief() from
#   the same constants the build validator enforces (rendered by
#   prompt_builder here and in Circles, where alignment often starts), and
#   do_when_active gains the rule:
#   align on the want, never design the how, never propose external hosting.
#   Prompt copy only; no route, scope, or schema change in the app.
# 0.16.6 (2026-09-03): the run card stops calling a static render an app.
#   On one project three phases landed, the card said "open
#   app" over a page that had never been installed, and the host told the
#   user three times to open the live app. The static render is now
#   "preview files"; "open app" appears only when the platform OBSERVED an
#   installed app for the project (review get_session_service `app`, from
#   server/applications/app_state) and opens it the way the desktop does.
#   Same ship (v124): phases carry executed acceptance and a user approval
#   gate — the plan pane shows "awaiting your approval" with an Approve
#   button (the ONLY writer of approved_at), "landed, unproven" for a phase
#   in 'review', and "proven · N checks" when the pod ran its checks.
#   Bundle repacked; new route POST /api/projects/{id}/phases/{pid}/approve.
# 0.16.7 (2026-09-03): "Install as my app" works. The button has always
#   called POST /api/applications/build (ops-pane.tsx PublishSection), the
#   route has always been scope-gated, and this manifest never declared the
#   scope — so every click 403'd with "app 'workbench' did not declare
#   permission 'execute:install'" (reproduced in-pod with a real
#   window token). Handing Workbench execute:install would have fixed it and
#   also granted store checkout, refunds, entitlement and uninstall-any-app,
#   so /build moved to a new narrow scope instead (execute:ship_project,
#   scopes.py) and this manifest declares that. The host's own ship path was
#   never affected — it reaches /build through the internal loopback
#   allow-list — which is why `ship_project_app` succeeded while the button
#   did not. Bundle repacked.
# 0.31.9 (2026-10-18): prompt_behavior is one paragraph saying what the app is
#   and what lives in it; do_when_active is gone from the manifest contract,
#   and its how-to lines live in skills and tool descriptions the Host reads on
#   demand. Manifest-only; bundle rebuilt, repacked and re-signed.
# 0.31.10 (2026-10-18): rebuilt from sources whose comments were rewritten as plain rationale; no behaviour change.
# 0.31.11 (2026-10-21): with no git forge configured, Code Approvals says the Host
#   is not configured for one, as the wiki does, in place of "no forge login yet",
#   which read as something that would arrive. App-only change; bundle rebuilt.
# 0.32.0 (2026-10-21): on a git server the owner connected in Settings, Approve
#   opens the pull request's own page on that server, where the person merges
#   signed in as themselves, and the card says which server; the card's watch
#   and the bench's listing notice the merge there as they do on the platform
#   forge. With no git server, Code Approvals says to connect one in Settings,
#   Git server. Bundle rebuilt.
version: "0.32.0"
# 0.31.8 (2026-10-18): when a turn ends without reading words you
#   typed into it and your Host starts its next turn with them, the page now
#   always follows that turn. It used to miss it now and then on a busy
#   machine, and stayed on the ended turn. Bundle rebuilt, repacked and
#   re-signed.
# 0.31.5 (2026-10-11, brief prompt): the runtime brief no longer
#   rides the prompt as a block; the line that said it was "rendered below"
#   now names where it is, find_tools(name='capability:machine-runtime').
#   The bundle is rebuilt because its bytes changed.
# 0.31.7 (2026-10-12): "Where this stands" at the top of a page is one line
#   (its label and the first line) until you tap it, as in Circles. Open, it
#   is capped in height with its own scroll, so the conversation stays in
#   view; each page remembers which way you left it on this device. Bundle
