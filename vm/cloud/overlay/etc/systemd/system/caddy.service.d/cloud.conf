# The cloud box's Caddy: its admin API is a unix socket in /run/caddy, which
# only the caddy user can reach (Caddyfile: admin unix//run/caddy/admin.sock),
# it starts after the firewall, and it has the door key.
[Unit]
After=cseries-firewall.service

[Service]
# CSERIES_DOOR_SECRET, for the Caddyfile's {$CSERIES_DOOR_SECRET}. systemd
# reads this file as root before each start and before each reload, so
# `systemctl reload caddy` takes a new key (cseries-cloud-bootstrap
# rotate-door-key). Without it Caddy does not start.
EnvironmentFile=/etc/cseries-cloud/door-secret.env
# Debian's unit runs `caddy run --environ`, which prints every environment
# variable, the door key with them, to the journal. The same command without it.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
NoNewPrivileges=yes
ProtectHome=yes
PrivateDevices=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
