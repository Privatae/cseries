# The ports the Host's bastion listeners are published on, named the way
# compose.yaml names them: server/network/local_bastion.py builds the redeem
# and lane addresses it hands a bastion from them. cseries-host.container
# publishes 8810 and 8811 on the guest's 127.0.0.1, where WSL's forwarding
# connects.
[Container]
Environment=CSERIES_ENROLL_PORT=8810
Environment=CSERIES_LANE_PORT=8811
