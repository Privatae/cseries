# SoundCraft Engine: the open-source SoundCraft
# audio workstation (github.com/storytold/soundcraft, MIT or Apache-2.0), run headless for the
# Host. The program is in the creative toolchain image, pinned by sha256
# (sidecars/app-runtime-creative/crafts.txt); this app is a recipe: the command
# starts the image's own MCP bridge (creative_mcp.py), and `mcp` makes that
# server one of the Host's connections when the app is installed
# (manifest.McpSpec). The whole ArtCraft set, so a person can
# make everything they need. Memory: a bounce holds the whole mix, about 0.66 MB a second of audio: 400 MB
# for 10 minutes, 1.19 GB for 30 (measured). vcpus 1: a bounce runs
# on one CPU at about 100x real time whatever it is given.
# A window is billed at its ceiling.
id: soundcraft-engine
name: SoundCraft Engine
description: Your Host makes music and sound with SoundCraft, an open-source audio workstation with tracks, built-in instruments, effects and a mixer. It writes parts, mixes your recordings and bounces the mix to WAV, and everything it makes appears in this window.
icon: icon.png
icon_small: icon-64.png
# 1.0.1 (2026-10-18): the product is renamed C-Series (names, paths, env vars).
# 1.0.2 (2026-10-18): comments rewritten as plain rationale, with no tracker or review references; no behaviour change.
version: "1.0.2"
provenance: standard
entrypoint: index.html
permissions: []
network: []
resources:
  baseline_memory_mi: 2048
  vcpus: 1
runtime:
  kind: process
  image: creative
  command: ["python3", "/opt/app-runtime/creative_mcp.py", "soundcraft"]
  ready_path: /health
  ready_timeout_seconds: 120
mcp:
  path: /mcp
window:
  title: SoundCraft Engine
  width: 900
  height: 640
  resizable: true
prompt_behavior:
  what_it_is: |
    SoundCraft Engine is the person's own audio workstation that you operate: an MCP
    server named soundcraft-engine (skill 'soundcraft-engine' says how). Its window shows the files
    you made there.
  user_path: "the SoundCraft Engine app (install it from the App Store)"
