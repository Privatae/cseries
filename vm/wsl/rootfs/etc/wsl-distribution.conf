# How WSL sets up the cseries distribution. The cseries command creates the
# user in the image itself, so there is no first-run prompt, and the
# distribution adds nothing to the Start menu or Windows Terminal: it is the
# Host's machine, not a shell for the user.
[oobe]
defaultUid = 1000
defaultName = cseries

[shortcut]
enabled = false

[windowsterminal]
enabled = false
