# cancel and vetoes an agent with POST /api/agents/{id}/cancel. All four had no
# scope, so any app on the Host could do the same; they now take
# read:brain_tasks / write:brain_tasks (dispatched agents are entity_tasks rows)
# and read:calendar / write:calendar (scheduled work is calendar_events rows),
# which this manifest now declares. Manifest-only change; bundle repacked.
# 0.21.1 (2026-09-28): 0.20.7 carried onto 0.21.0. "Publish as site" says a new site goes live public, and
#   Sites sets who else can see it. Bundle rebuilt and repacked.
# 0.21.0 (2026-09-27): Code Repositories and Code Approvals. A project
#   mounts one Code Repository: Start offers a new one (the default) or any the
#   Host can reach, and one that already has a project, or that the Host can only
#   read, is offered as a fork into the new project. Its name and link sit at the
#   top of the project; the right pane's repository dropdown is gone. "Pull
#   requests" became Code Approvals: plain-English rows that open a card over
#   the chat — Approve opens a window on privatae.ai that merges as the person,
#   Ask for changes sends their words to the Host. The Merge button that merged
#   with the Host's own login is gone. Auto-deliver became Auto-Approve and moved
#   beside the chat input, offered only where the Host can merge. Archiving a
#   project asks, unticked, whether to delete its Code Repository too, where
#   that is allowed. Bundle repacked.
# 0.20.7 (2026-09-27): "Publish as site" says what now happens -- a new site
#   goes live public, and Sites sets who else can see it. It used to promise
#   a private preview that any logged-in account could open.
# 0.20.6 (2026-09-25): a project whose code lives on the user's own machine
#   (pipeline source machine-forge — the code server the Host built there).
#   The project table shows its repo as "on your machine" instead of a
#   forge link (only the Host can reach that server), and the PR
#   pane opens on its pull requests — reached through the Host — whether or
#   not a platform gitea is linked.
# 0.20.5 (2026-09-25): the approval card for an op on one of the person's
#   machines: the card rises here too
#   from mgmt_run's op door, with the machine's own dry-run diff folded under
#   the words (app-web-kit/ask.ts `attachment`). The module list names the
#   `op` target — a program for one of the person's machines.
# 0.20.4 (2026-09-24): a pipeline change that adds a check running outside the
#   platform takes a code from the person's authenticator. The ask card shows
#   a code box on the option the kernel marked (the `pipeline` result's
#   stepup_option — never an option a Host wrote); 'apply' stays disabled
#   until six digits are in; the code rides that decide only, and a wrong one
#   leaves the card open.
# 0.20.3 (2026-09-24): the ask card also rises for a pipeline proposal — the
#   `pipeline` tool's result carries the decision ticket the kernel filed
#   (app-web-kit/ask.ts RESULT_ASK_TOOLS). Only
#   that named tool, read from `operate`'s args.tool when the Host runs it as
#   a registry op: an ask-shaped result from any other tool raises nothing.
# 0.20.2 (2026-09-24): the ask card — an overlay over the chat, never a message
#   in it. An `escalate` the Host raises on a
#   live turn opens a dialog over the thread; the click decides the ticket
#   through the Tickets route and the Host reads the person's words as the
#   next message on the thread (an answer given mid-turn waits for the turn
#   to end — the Workbench has no nudge lane — and goes to the thread that
#   asked, whichever project is open by then). Not now sets the card aside;
#   the ticket stays in Tickets; a credential ask opens Circles › Tickets.
#   Scopes: + read:tickets, write:tickets (the decide route and the read-back
#   that keeps a replayed turn from re-raising an answered ticket).
#   app-web-kit/ask.ts + ui/ask-overlay.
# 0.20.1 (2026-09-23): faster streaming replies. The reply text now lands at most
#   once per animation frame (app-web-kit/stream-batch.ts) instead of one React
#   update per streamed chunk; tool calls, errors and the end of the turn flush
#   it first, so what the user sees arrives in the same order. Messages split
#   into blocks incrementally while they stream (app-web-kit/incremental-
#   blocks.ts) — only the end of the reply is re-split, not the whole text —
#   pinned equal to Streamdown's own split by test/incremental-blocks.test.ts.
#   Streamdown 2.5.0 -> 2.6.0 for remend 1.3.1, whose link repair was measured
#   at 47 ms per update on a 40 KB reply under 1.3.0 (7.8 ms under 1.3.1).
#   Build assets are now cached by the browser (server/applications/proxy.py
#   _asset_cache_control), so reopening the window no longer re-downloads the
#   app. Scopes unchanged.
# 0.20.0 (2026-09-23): parallel builds. A PLAN
#   phase row says what it waits for ("after 2, 3" — the phase numbers, by
#   the same rule the build chain schedules with), its own engine when the
#   plan named one, and "did not land — collided with another phase" (the
#   conflict in its tooltip) when its run could not be merged with a phase
#   that landed while it built. Route: GET /api/projects/{id}/phases adds
#   waits_for, depends_on, harness, model, integration_error. Scopes
#   unchanged. Bundle repacked.
# 0.19.0 (2026-09-23): the three panes.
#   Left rail: buckets replace the four status groups. Buckets ARE the v130
#   folders, renamed in the UI and the API (/api/projects/buckets, bucket_id;
#   the table keeps its name). The rail is bucket → project; status is a badge
#   on the row and a filter over the rail ("Open" = not archived, by default).
#   A bucket is created inline, renamed in place, coloured from a swatch and
#   deleted from its header (its projects come back unfiled). Projects are
#   dragged into a bucket and, in Manual order, into place inside it — one
#   request per drop (PATCH /api/projects/{id}/place, v173 projects.sort_order,
#   the bucket renumbered 1..n server-side); Recent order is the alternative.
#   Right pane: MODULES at the top — module → versions, one "open version"
#   each, "make current" / "undo" on the pointer, and the finished runs built
#   for a module that are not a version yet as candidates with "use as
#   version" (review.adopt into=module). Installed/running is a badge on the
#   module (observed app state, from the module's own app.yaml; the root app's
#   for a project with no modules). PLAN groups phases under their module with
#   how each is proven. RUNS opens collapsed.
#   Chat pane: a run card carries ONE button, "open version" — the run's own
#   worktree, adopted or not, installed or not, with its changes beside it;
#   disabled while the run is live. "preview files", "open app" and "review
#   diff" are gone. The compare view (compare-terminals.tsx, was
#   fan-out-terminals.tsx) is N terminals with N open-version buttons.
#   Routes: GET /api/projects/{id}/modules adds candidates, app and root_app;
#   GET /api/projects/{id}/phases adds module and validation. Scopes
#   unchanged (write:review already covers review.adopt). Bundle repacked.
# 0.18.1 (2026-09-23): a link can open a project. The view `project:<id>` —
#   on the frame (`#view=`) when the window is launched with one, or as a
#   `cseries:app-view` message while it is open — selects that project instead
#   of the newest one. It is what a "build finished" reach-out links to
#   (server/deep_link.py: /?open=workbench&view=project:<id>). A project
#   that is gone says so, a failed load says that instead. A view posted
#   before the app mounted is held, not lost, and boot and a later view share
#   one requested project so neither overrides the other.
#   src/lib/app-view.ts; scopes unchanged.
# 0.18.0 (2026-09-22): one build door. The host's
#   words are "build" (one task, one engine) and "compare" (the same task on
#   N engines/models, the user picks); "fan-out" is retired from the UI. A
#   compare is now build(action='run', variants=[…]) — the chat mounts its N
#   terminals off that chip (a `build` chip that named variants or carries a
#   compare session id) instead of the removed review.fan_out; a single
#   build(action='run') mounts the one build terminal as before. Chips in
#   older history under the review.fan_out name still mount. Bench rows and
#   the loading line say "compare". Bundle repacked; no route or scope change.
# 0.17.5 (2026-09-17): Search in the rail — the one index. A dialog over the
#   whole window with one box over everything the host can see: its memory and
#   the user's documents (the SAME recall engine, filters and relevance floor
#   the host's per-turn pre-fire uses; not its per-model visibility filter,
#   own-words cap or 6-item cut), plus projects, the journal and the in-pod code index, each under its
#   own heading and honest when it could not run; a project hit opens that
#   project. One index surface for finding context, files, etc.
#   Shared with Circles through app-web-kit/search.tsx; the route is GET
#   /api/search (server/routes/search.py). New scope read:search.
# 0.17.4 (2026-09-17): a turn lives with the project its work touched. Once
#   the ask for an app was typed into a stub project; the host reached
#   create_project through `operate` (no surface gate on that lane, by design)
#   and made a second project for the same work, the carry-forward pulled
#   turns into it, and every reply and every "yes" stayed in the first
#   (filed by window) while every build report landed in the second (filed by
#   build). Kernel: create_project is
#   refused inside a project thread and names the project to plan on; the
#   carry-forward moves untagged (Circles) turns only and stamps their
#   source_context; when a turn's WRITE tools acted on exactly one other
#   project, the reply is filed there, the user row follows, a marker stays
#   where it was typed, and a `thread_moved` frame tells this client
#   (runtime/turn_home.py). Here: the chat hook carries the two bubbles to
#   the target thread, leaves the same marker locally, and the app opens
#   that project with a notice. project_adopt_thread(kind='project') folds
#   one project's conversation into another — the repair for a split that
#   already happened. Briefing gains one line on where an ask lands; the
#   builder's shared "Finding projects" block is split per surface (the
#   Workbench copy no longer offers to create). Bundle repacked.
# 0.17.3 (2026-09-16): a per-turn spend budget in dollars, beside the depth
#   dial — "Budget for each turn", with what the next turn is projected to
#   cost and what the last one actually cost under it. The host stops
#   starting new rounds of tool calls once it cannot afford the next one,
#   instead of being cut at a per-model round count that meant nothing to the
#   person paying. A reply is never cut mid-sentence, so the worst overspend
#   is one reply. On a model with no published per-token price the panel says
#   the budget is measured in tokens rather than showing fabricated dollars.
# 0.17.2 (2026-09-16): the context panel says WHY it has nothing to show.
#   A peer thread (dm/entity) is built by the OTHER host, so no prompt is
#   assembled here and the block list and pre-fired memories are empty
#   permanently — the panel now says that in a sentence instead of
#   rendering an empty section that reads as a bug. A thread that simply
#   has not had a turn yet says that instead. Reads the new
#   `prefire_state` field on GET thread-context; a backend that does not
#   send it renders exactly as before. No scope change.
# 0.17.1 (2026-09-15): an agent whose cost the platform cannot price now reads
#   "unpriced" on the bench instead of showing nothing. Agent runs are priced
#   from the model catalog and come back null when it holds no published rate
#   for the model that ran; a hardcoded rate table in
#   agent_dispatch.py used to invent a number rather than admit that, and removing it
#   left an empty cell — which a person reads as $0, the one thing it does not
#   mean. Two surfaces: the ops-pane row and the chat agent card. A run still
#   in flight is unchanged (no cost reported yet is not the same as no rate).
# 0.17.0 (2026-09-07): everything is a project. The General staging thread
#   and the New-project form are gone; Start opens "What would you like to
#   work on?" — one box, the typed text ranked against existing projects by
#   the new project index (GET /api/projects/search: core Postgres full-text
#   over name/description/phase titles, plus the host's own embedding model
#   when one is configured, semantic:false otherwise — never an outage). Pick
#   a match and its thread opens with the text in the composer; nothing fits
#   and the text becomes the description of a new project, the title
#   suggested from it. The Workbench opens on the newest Active project, or
#   on that dialog when there is none. The rail is four collapsible groups
#   (Active/Pending/Completed/Archived, counts, Active open) under the user's
#   folders (v130 — flat, one folder per project, "Unfiled" for the rest;
#   deleting a folder never deletes a project), and "All projects" opens a
#   full-window viewer: filter by group/folder, search, sort, bulk move /
#   archive / restore / complete, folder management. An entity that still
#   has turns in the old General thread gets the dialog pre-filled on first
#   open and the project it opens adopts them (retag, never delete). The
#   frame no longer describes a General thread. Bundle repacked; new routes
#   GET/POST/PATCH/DELETE /api/projects/folders[/{id}], GET
#   /api/projects/search, PUT /api/projects/{id} takes folder_id, GET
#   /api/projects takes include_archived (Workbench-only; the default and
#   the host's list_projects are unchanged).
#   (0.19.0 renamed these: /api/projects/buckets[/{id}] and bucket_id.)
# 0.16.13 (2026-09-06): the Workbench behavior block stops restating the
#   build-workflow skill. The static prompt measured at 78k chars with
#   ~7.4k of it this manifest's prompt_behavior, most of it a second copy of
#   the skill (alignment gate, parallel research, cheap rung first, review,
#   proven delivery, where it runs, desktops, invisible builds). The skill is
#   the one copy now (the three rules it lacked moved INTO it); this block
#   keeps only what is about THIS window — run numbers, project names, the
#   machine block — and one pointer. Manifest-only; bundle repacked.
# 0.16.12 (2026-09-06): tool cards are titled "<Tool> <op>" with the argument
#   as a muted, quoted subject — same change as circles 0.11.2 (the card code
#   is the ported copy). Bundle repacked.
# 0.16.11 (2026-09-06): a variant waiting for memory never freezes. The
#   stream route's 30-minute tail was a TOTAL per connection (its idle counter
#   never reset on a frame) and the run terminal treated a clean end as
#   terminal, so a queued variant's tab timed out on "waiting for memory" and
#   the run's output never arrived without a reload. The route now measures
#   idle from the last frame, and run-terminal.tsx resumes from its cursor
#   when a stream ends cleanly while the run is still live
#   (run-frames.ts resumeAfterCleanEnd). Bundle repacked.
# 0.16.10 (2026-09-06): a fan-out variant queued for memory reads "waiting
#   for memory", not "live" and not "failed". Check available
#   resources for multi-harness runs and run in series when the memory limit
#   is the issue — series is the fallback, parallel stays parallel where the
#   plan has room. review.py now runs the harnesses the plan holds as wave 1
#   and starts the rest as running harnesses release; the kernel writes a
#   `status/waiting` frame with the plain reason before such a run starts.
#   run-frames.ts folds that into RunSummary.waiting (cleared by the run's
#   first frame); run-terminal.tsx shows an outline "waiting for memory"
#   badge with no pulse instead of a pulsing "live" over an empty scrollback.
#   Bundle repacked.
# 0.16.8 (2026-09-04): delivery is proven. A host had no read on
#   its app's runtime pod (log_tail was "" for pod apps by construction), the
#   ship ended at "installed", and the user had to paste the bootstrap
#   failure into the chat. Now: after every install the kernel starts the app
#   and proves it (mastercode.runtime.app_verify — ready check + captured
#   log), reports a 'prove: <app>' task, and with auto-deliver on dispatches
#   up to two seeded repairs itself. The switch is renamed Auto-deliver in
#   the ops pane (it now merges + installs + proves, not just merges); the
#   briefing gains the "delivery is proven" rule below and the host's runtime
#   brief its matching block. Bundle repacked.
# 0.15.2 (2026-08-22): "open app" now re-asks what the run left behind.
#   hasEntry is review._session_entrypoints' answer — is there an index.html in
#   THIS run's worktree — and it was captured once, on mount. A greenfield
#   worktree is empty at mount by construction, so every from-scratch run
#   latched hasEntry=false and offered only "review diff" (one session:
#   antigravity mounted 21:39:54 against an empty tree, wrote
#   index.html 21:43:17, finished 21:43:26). Seeded runs inherit the project's
#   index.html at t=0, so the only lane this broke was the greenfield one that
#   "open app" was built for. A separate effect re-fetches on the terminal
#   frame — safe because collection lands first (21:43:25.980 vs 21:43:26.040).

# Chat-surface briefing (rendered by runtime/prompt_builder._build_surface_role
# into "## Where You Are" when the host is active in this app). Workbench is a
# CHAT SURFACE with its own system prompt.
prompt_behavior:
  project_scoped: true
  what_it_is: >-
    The Workbench is where projects are built. Each project is a conversation thread
    plus a workflow: the user aligns with you there, you research, plan and phase,
    and builds run on the user's connected coding engines, live on the bench with
    their output and time. Runs are numbered on the bench (#<number>), and that number is
    the run's id. Agents doing untrusted outside work show on the bench too. Each
    project's turns are memory-tagged to it. Projects open from the book's tabs and
    its Index. Diffs land as pull requests on the user's own gitea and the user
    merges them; Code Approvals are approved here. The composer takes file uploads,
    which become context files. "Publish as site" on the bench puts a finished
    project on the public web, with no upload step.
  user_path: "the Workbench app, in the dock"

window:
  title: Workbench
  width: 1440
  height: 900
  resizable: true
  min_width: 1024
  min_height: 640
  start_maximized: true
  # Phone mode: render native full-width and reflow (three columns become
  # one screen at a time behind a bottom tab bar) instead of the scale shim.
  mobile: responsive

permissions:
  - read:review
  - write:review
  - read:inference_catalog
  - write:inference_routing
  - read:inference_log
  # Chat surface (the no-sessions brain path + history + project scoping).
  - write:session
  - read:brain_memory
  - read:projects
  # The Start dialog creates projects (POST /api/projects).
  - write:projects
  # One-click "Publish as site" -> /api/applications/sites/publish-project.
  - publish:sites
  # 0.16.7: the other disposition in the same section — "Install as my app"
  # -> POST /api/applications/build. Narrow by construction: this scope ships
  # the user's OWN project and nothing else. It is NOT execute:install, which
  # would also hand Workbench store checkout/refunds and uninstall-any-app.
  - execute:ship_project
  # Composer upload -> /api/brain/context/upload (project-tagged, embedded).
  - write:memory
  # 0.16.1: the composer's "Store in Keys" seals a caught credential
  # (POST /api/vault/secrets). Write only — no read:vault, no reveal.
  - write:vault
  # 0.20.2: the ask card decides the Host's decision ticket from the overlay
  # (POST /api/tickets/{id}/decide) and reads it back before raising a card
  # for a replayed turn (GET /api/tickets/{id}). The same scopes Circles holds
  # for its Tickets pane; nothing else under /api/tickets is called from here.
  - read:tickets
  - write:tickets
  # 0.21.2: the live view -> GET /api/agents, POST /api/agents/{id}/cancel,
  # GET /api/agents/scheduled, POST /api/agents/scheduled/{id}/cancel.
  - read:brain_tasks
  - write:brain_tasks
  - read:calendar
  - write:calendar
  # 0.23.0: the pairing code card in the chat reads the one-time code itself
  # (GET /api/network/nac/connector/{id}/code, read:topology) and the open
  # pairings started in this project (GET /api/network/nac/connector). The
  # code route also answers only the person's own windows as the platform
  # signed them (routes/network.py _person_window: network, circles,
  # workbench), so no other holder of this scope reads a code. Read-only; the
  # same scope Circles holds.
  - read:topology
