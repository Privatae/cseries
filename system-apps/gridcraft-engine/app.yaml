# GridCraft Engine: the open-source GridCraft
# spreadsheet (github.com/storytold/gridcraft, MIT or Apache-2.0), run headless for the
# Host. The program is in the creative toolchain image, pinned by sha256
# (sidecars/app-runtime-creative/crafts.txt); this app is a recipe: the command
# starts the image's own MCP bridge (creative_mcp.py), and `mcp` makes that
# server one of the Host's connections when the app is installed
# (manifest.McpSpec). The whole ArtCraft set, so a person can
# make everything they need. Memory: 238 MB for a 100,000-row sheet with formulas and a chart (measured). vcpus 1: writing and saving it was no faster on 4 CPUs.
# A window is billed at its ceiling.
id: gridcraft-engine
name: GridCraft Engine
description: Your Host builds spreadsheets with GridCraft, an open-source spreadsheet with formulas, formatting, tables, charts and XLSX files. It enters and analyses your data, adds charts and saves your workbooks as XLSX or CSV, and everything it makes appears in this window.
icon: icon.png
icon_small: icon-64.png
# 1.0.1 (2026-10-18): the product is renamed C-Series (names, paths, env vars).
# 1.0.2 (2026-10-18): comments rewritten as plain rationale, with no tracker or review references; no behaviour change.
version: "1.0.2"
provenance: standard
entrypoint: index.html
permissions: []
network: []
resources:
  baseline_memory_mi: 512
  vcpus: 1
runtime:
  kind: process
  image: creative
  command: ["python3", "/opt/app-runtime/creative_mcp.py", "gridcraft"]
  ready_path: /health
  ready_timeout_seconds: 120
mcp:
  path: /mcp
window:
  title: GridCraft Engine
  width: 900
  height: 640
  resizable: true
prompt_behavior:
  what_it_is: |
    GridCraft Engine is the person's own spreadsheet that you operate: an MCP
    server named gridcraft-engine (skill 'gridcraft-engine' says how). Its window shows the files
    you made there.
  user_path: "the GridCraft Engine app (install it from the App Store)"
