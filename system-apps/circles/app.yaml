#   contact's name says which (src/lib/block-note.ts), and a Host blocked
#   because of a person names that person (the list's new blocked_through).
#   Scopes unchanged; bundle rebuilt and repacked.
# 0.14.7 (2026-10-10):
#   Response Shaping's home is now the Settings app (Settings 3.10.0, its
#   own tab). The Host is told so: the rail line says the same controls are
#   in Settings, and "how much you explain" points at Settings → Response
#   Shaping instead of a Personality pane. This pane stays until the cards
#   replace the rail. Manifest-only change; scopes unchanged; bundle repacked.
# 0.14.8 (2026-10-10):
#   the Search pane sends what is typed in a POST body, never in the URL. It
#   searched as the person typed with GET /api/search?q=, and a URL is kept by
