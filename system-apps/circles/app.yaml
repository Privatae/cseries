id: circles
name: Circles
description: Your Host and everyone you know, as a deck of cards — each person's chat on the front and their Host on the back, your own Host's conversation on your card, what waits on you, and who is at the door.
# One SVG serves both sizes — it scales, so there is no 64px raster to keep in
# sync. These previously declared icon.png / icon-64.png, neither of which was
# ever produced, so every surface that loads the FILE (rather than the shared
# glyph) 404'd. The mark is not new: same geometry as the "linked rings" glyph
# at dashboard/base/js/icons.js:30, materialised as a standalone file.
icon: icon.svg
icon_small: icon.svg
entrypoint: index.html
system: false
# 0.4.1 (2026-06-28): restore the features the React rebuild dropped vs the legacy
# app — named conversations (read display_name; backend joins the peer's own name),
# delete/clear a conversation (soft: self-thread -> archived, entity DM -> archived_at),
# in-chat model picker (per-thread model override), A/B compare, regenerate, nudge,
# attachment send. Adds read:inference_catalog for the in-chat model picker dropdown.
# 0.4.2 (2026-06-28): in-chat model picker no longer references the removed `validated`
# catalog field (validated/benchmark concept ripped out in favor of user favorites).
# 0.4.3 (2026-06-28): in-chat model picker now shows the host's FAVORITES + default
# (from the Privatae app) instead of the full ~339 OpenRouter catalog; and after a
# self-thread reply persists, the thread reloads so Regenerate/Compare appear on it
# (they key off the entity_memory turn id; the live-streamed bubble only had a
# synthetic one). Render-verified headless (picker + actions draw).
# 0.4.4 (2026-06-28): common-sense rebuild of the model affordances. The in-chat
# picker is now a SEARCHABLE catalog (cmdk dialog) instead of a gated dropdown —
# favorites surface at the top, the full catalog is searchable below, and every
# row shows PRICING ($/M in·out + ctx) so a model can actually be judged. Empty
# favorites no longer hides the picker (the 0.4.3 regression). Regenerate now has
# an inline model picker ("Regenerate with <model>"); A/B Compare uses the same
# searchable picker for both sides. Render-verified headless against a real host
# (340 models, search->19 on "claude", pricing rows).
# 0.4.5 (2026-06-28): A/B Compare now does what it's for — picking a side SWITCHES
# the thread to that model and continues the chat on it ("Continue on A/B"), so you
# can see which model fits a topic and keep going on it (the pick still trains your
# preference). Bigger default window for the side-by-side real estate.
# 0.4.6 (2026-06-29): FIX blank-screen-on-send. The app never wrapped itself in a
# TooltipProvider, so every shadcn <Tooltip> (the compose box send/stop button, message
# actions, tool cards) threw "`Tooltip` must be used within `TooltipProvider`" on mount —
# with no error boundary that unmounted the whole desktop. Added one TooltipProvider at
# the App root. Latent since the 0.4.0 React rebuild.
# 0.4.7 (2026-07-04): Settings → Coding harnesses is READ-ONLY — the selection and
# per-harness model/effort are decided in the Orchestrator app (the single
# orchestration surface, untangled spec); the pane shows what fans out and deep-links
# there. saveCodingHarnesses removed, closing the last second write surface for
# behavioral_params.coding_harnesses.
# 0.4.8 (2026-07-04): thinking-effort knob in the chat composer — the host's chat
# reasoning depth (default/max/high/medium/low/off) is set HERE at the user's
# discretion (reads/writes /api/inference/host-engine; takes effect on the
# host's routed model). Effort is a chat-time choice, not an
# Orchestrator setting.
# 0.4.9 (2026-07-07): retry-on-401 for the app-token delivery race (parity
# with workbench 0.6.3) + surfaces remapped from the old blue-cseries palette
# to the shared cseries green-black tokens (/css/tokens.css). "kill the blue."
# 0.4.10 (2026-07-12): relay the host's open_app tool call to the desktop
# shell (cseries:open-app + deep-link view) — lets the host pop the Artifacts
# window from chat.
# 0.4.11 (2026-07-12): artifact doctrine in the briefing — "show,
# don't describe": visual/structural replies become live artifacts.
# 0.4.12 (2026-07-12): doctrine hardened from the first live test — the Host
# DISPATCHED agents to sketch (3 duplicate artifacts, nothing visible in
# chat, no window). Artifacts are built by the HOST in its own turn, one per
# design, iterated with op='write'; agents are never dispatched for sketches.
# 0.4.13 (2026-07-12): artifact-bridge compose lane (slices 3+4) — composer
# renders tune-mode pills (select refs + applied edits ride the next message)
# and sends declared acts/variant picks as the user's own message.
# 0.4.14 (2026-07-12): design-template doctrine — when a template is active
# (the Design Language prompt block), artifacts get designed IN it, and
# style requests map to the Designs lanes (the catalog tool /
# update_project design_system) instead of ad-hoc improvisation.
# 0.4.15 (2026-07-12): project close-out doctrine — taste signals (template/
# variant picks and kept artifacts teach the default, out loud) and change
# history ("go back to before X" = artifact history + revert, never a
# from-memory rewrite).
# 0.5.0 (2026-07-13): mood + constitution surfaces (the doctrine:
# stored weights = CONSTITUTION, user-approved changes only; NT
# state = MOOD, ephemeral/attributable/decays, never an engagement mechanic).
# New Constitution rail tab: seed-vs-
# current 10-dim view, envelope consent sliders (new PUT
# /api/brain/personality/envelope, Invariant-9-gated + audited), and the
# recommendation approval queue (approve/reject = the ONLY weight-change
# path). Adds read:brain_personality + read/write:brain_codebooks scopes.
# 0.5.1 (2026-07-13): FIX Constitution bar scale. The seed-vs-current bars +
# seed ticks clamped at 1.0, but dimensions run 0..2 (mastercode dimension_spec,
# max 2.0, 1.0 = neutral) — so every weight ≥1.0 pegged full and the pane read
# "maxed on everything". Bars/ticks now scale to 2.0 with a neutral-1.0 center
# marker + 0/1/2 axis labels; envelope drift sliders share the 0..2 scale.
# 0.5.2 (2026-07-13): derivation disclaimer (honesty + liability). Shared
# DerivationNote — persistent one-line frame ("computed by fixed formulas, not
# written by an AI … not a claim of real emotion or consciousness, not a
# psychological/medical assessment") + inline-expandable full explanation of the
# mood (lexicon→fixed-formula NT→fixed-axes, no LLM) and constitution
# (user-approval-only) derivation. Wired into BOTH the Constitution pane and the
# mood inner-state panel so the framing travels with the popover.
# 0.5.3 (2026-07-14): FIX double scrollbar on the chat pane. The Conversation
# wrapper kept overflow-y-auto from the old use-stick-to-bottom API where the
# root WAS the scroll element; v1.1+ renders its own internal scroller, so both
# nested divs painted a scrollbar at the same right edge. Wrapper is now
# overflow-hidden; the library's scroller is the only one.
# 0.6.0 (2026-07-14): mobile layout — window.mobile: responsive (opt out of the
# shell's phone-mode scale shim; at 1600px design width Circles scaled to ~24%
# on a phone). Below the md breakpoint: the icon rail becomes a bottom bar,
# every two-column pane becomes master-detail (full-width list, detail slides
# in with Back), conversations lands directly in the self thread with Back to
# the list, policy stacks form + rules in one scroll. Desktop unchanged.
# 0.6.1 (2026-07-16): RENAME the Constitution tab/pane -> Response Shaping.
# The 0.5.0 note below records "stored weights =
# CONSTITUTION"; that name was wrong and it spread. The three layers are
# distinct and the UI now says so:
#   - RESPONSE SHAPING (this pane) — the 10-dim personality weights, i.e. the
#     cognition. User-approved changes only. Was mislabelled "Constitution".
#   - CEIGAS — mathematical governance (capability bits on every crossing).
#   - CONSTITUTION — the rules the Host lives by, stored as read-only memories:
#     entity_memory(memory_type='constitutional'), retrieved by
#     memory_engine.retrieve_constitutional() with NO decay, injected every
#     rebuild (runtime/prompt_schema.py:665 Block("constitutional", …, always))
#     at BOTH global scope (entity 0 — platform-protecting rules, e.g. never
#     impersonate) and entity scope (prompt_schema.py:255-256). They protect
#     the user and the platform. No pane surfaces them yet.
# Copy-only + one local component rename (ConstitutionRow -> ShapingRow); no
# API, route, scope, or schema change.
# 0.6.2 (2026-07-16): FIX calendar unreachable on phone. The 0.6.0 master-detail put the event LIST in the sidebar and
# the month GRID in the main panel — below md the main stays hidden until an
# event is selected, so the actual calendar (grid, month nav, + Event) never
# rendered on a phone. The month grid + nav + compose now also render as a
# compact block pinned above the agenda in the phone sidebar (md:hidden);
# desktop markup unchanged.
# 0.7.0 (2026-07-19): per-turn metrics on every chat surface (there was no
# timestamp, duration or token use anywhere). Each turn shows its
# clock time; assistant turns add "took Ns · N tok (in/out)" — durable from
# the runtime's turn-row metadata stamp (surfaced by _read_self_thread as
# msg.metrics), measured client-side for the just-streamed turn (duration =
# send→done, tokens from the d:/e: finish-frame usage the stream client now
# parses). Hover the meta line for the model that ran.
# 0.7.1 (2026-07-20): agent status cards can't go stale (batch-2 caps sweep).
# The dispatched-agent card's status poll had a silent 120-tick (~6 min) cap —
# any agent outliving it froze on "Running" forever. Now polls to a real
# terminal state (3s → 10s backoff, hidden tab skips fetches), and the agents
# list is fetched with limit=100 (the newest-20 window dropped older
# still-running agents from the poll entirely — same frozen badge).
# 0.8.0 (2026-07-20): the experience pass (batch-4, shared with workbench
# 0.11.0). Agent cards in chat show the live activity feed while running and
# the real output/failure when done; tool cards render parameters/results as
# compact key→value prose (raw JSON behind a fold, long text folds); "read"
# cards title by the inner tool + subject instead of the bare "read".
# 0.8.7 (2026-08-19): host-tooling cleanup — dead-engine vocabulary out of the
# briefing; the stream no longer unwraps the retired engine's read() shape.
# 0.8.8 (2026-08-21): Settings → coding pane reads the Orchestrator's Coding
# Engines (connected engines, their saved default model/effort, and the
# Default tick — where an unnamed build runs) instead of the retired
# Parallel-Builders selection ("every connected harness fans out" is no longer
# true and no longer said). Read-only, as before; deep-links to the
# Orchestrator.
# 0.8.9 (2026-08-25): prompt_behavior described the chat pane only, so a host
# in this window had nothing true to say about the other eight rail modes it
# ships (assets/index-DMp3yAbk.js:456 — inbox, calendar, address book, domain
# policy, reviews, response shaping, activity, settings), all of which are
# already covered by this manifest's own permission list. Manifest-only change.
# 0.9.0 (2026-08-28): background-activity ribbon in the strip above the
# composer (self thread only) — what the Host ran that the user never saw:
# memory consolidation, research, summarising, and LOUDLY anything that
# failed. Click opens the last 24h with the provider's own error text and a
# plain-language cause ("no model is routed for this"). It reads
# GET /api/inference/activity, which serves both halves of inference_cost_log:
# completed calls, and — new — FAILED ones. Until now a failed model call
# wrote nothing anywhere (the gateway's failure paths recorded through
# _prompt_console, which nothing wires in the pod), so a background role that
# stopped answering was invisible outside the pod log; that is exactly how
# fact derivation ran dead for 16 days. Renders nothing at all
# when there has been no background work and nothing is wrong.
# 0.9.1 (2026-08-28): pasted keys are caught before they leave the composer.
#   A send whose text carries a credential shape — a vendor API key (sk-ant-,
#   sk-, xai-, ghp_, AKIA…), a PEM private key, a JWT, a bearer token, a
#   password inside a URL — is held behind a strip instead of sent: "Send
#   redacted" (the value becomes [REDACTED:<kind>]) or "Edit message" (the text
#   goes back into the box). Soft hits — a `password = …` assignment or a
#   random-looking 32+ char token — get a gentler strip with "Send as-is" too.
#   The rules are ONE file, brain/mastercode/secret_shapes.json, shared with
#   the pod, which redacts the hard shapes at the top of send_message
#   regardless (text reaches the host from more doors than this composer), so
#   the hit the user was shown is the hit the pod cuts. Nothing scanned here
#   leaves the browser. A key or known credential the user pastes is
#   caught before it goes to inference.
#   Plus "Store in Keys": one click seals the caught key
#   into the vault (POST /api/vault/secrets — the Keys app's own call; a
#   vendor API key lands on its canonical provider name so routing picks it
#   up, anything else on a plain name) and the message goes out with
#   (stored in Keys as "…") in its place. Adds write:vault for that one call.
# 0.10.0 (2026-08-29): Reviews → TICKETS. One queue, two kinds. Decisions
#   (entity_tickets, unchanged: what the Host is waiting on the user for) and
#   SUPPORT — platform-help tickets the Host raises for the user, categorized
#   (bug / question / feature / billing / access) and identified by project.
#   The Host drafts a four-part card (problem / context / recommendation /
#   pushback — the same shape the operator reads on their side) and the pod
#   assembles a shared-context list beside it (C-Series version + apps, recent
#   errors, recent model-call failures, named files — secrets cut). NOTHING
#   LEAVES THE POD until the user reads that list in this pane, unticks what
#   they will not share, and presses Send. Then the platform's answer comes
#   back into the same card: received → reproducing → pr_open → approved →
#   fixed, or needs_info (a question, answered from the pane) / rejected.
#   Replaces the trusted-reporter `report_bug` lane (two hand-enrolled
#   entities, zero reports ever filed). server/routes/support.py; the Host's
#   side is the `tickets` tool's support_* ops + default-skills/tickets.md.
# 0.10.1 (2026-09-02): Personality pane copy tells the truth about drift. The
#   envelope section said "how far she may drift on her own" / "your consent
#   slider for autonomous movement" — but no code path moves the weights off
#   the user's setting (runtime/personality_validate.REGISTERED_WRITER_SOURCES:
#   sliders + genesis write seed AND current together; the breach path resets
#   TO seed; the autonomous writer is deleted). A fresh host read
#   that copy back to a stranger as a hidden learning process. The envelope is
#   now described as what it is: the tamper check's safety bound. Copy only;
#   no API, route, scope, or schema change.
# 0.11.0 (2026-09-02): Hosts | People. The conversation list is now two views
#   (two separate lists so people know when they are talking to a human).
#   HOSTS: Your Host / Peers (hosts you've connected) / Circles (rooms of
#   several hosts). PEOPLE: People (persons you've connected, keyed by their
#   email) / Circles (group chats between people — listed, not built yet).
#   Every message from the composer now carries the verified person who typed
#   it (X-Authentik-Email), so a person → host message shows the person "via"
#   their host in the other side's Peers thread, and a person → person message
#   files under People on both sides. Neither host's model reads or answers a
#   People message. New: /api/contacts/request-by-email (connect with a person;
#   the answer never says whether the address exists), thread kind 'dm' read +
#   clear, contacts.peer_entity_id (migration v123). Bridge: circles.send_dm +
#   contacts.request_by_email, and the person fields are verified against
#   operator_entities before they travel. Fixes the Peers thread read, which
#   called /api/messages/thread with a peer id against a uuid column.
#   Scopes unchanged (read/write:circles, read/write:address_book).
# 0.11.9 (2026-09-18): the price is on the turn. Every assistant turn's meta
#   line now ends with its list-price estimate at the served model's rates
#   ("$0.0031"), or the basis word where there is no per-token price (free /
#   subscription / unpriced) — never "$0" for "unknown". A regenerated
#   alternate and each side of an A/B compare print the SAME line (model ·
#   took Ns · N tok · price), so Regenerate and Compare are a price
#   comparison against the original, not only a text one.
#   Backend: session.py stamps est_cost_usd + price_basis on the turn row
#   (inference.estimate_turn_cost, the cost log's own arithmetic); /replay
#   and /ab return `metrics` per variant / side; the variant row keeps them.
#   Old rows carry neither field and print nothing about price. Scopes
#   unchanged.
# 0.12.12 (2026-10-01): the ask card follows the answer's turn. When the turn
#   that asked has ended, deciding the ticket starts a turn with the answer in
#   this thread on the server (tickets.decide_ticket_service ->
#   session.answer_after_turn — one path for every surface, the Tickets pane
#   included); the card reattaches to it instead of sending the answer again.
#   While a turn HOLDS for what it started the composer stays a Send composer
#   (Stop beside it) and a send is nudged into that turn; a nudge's saved row
#   replaces its echo. Scopes unchanged. Bundle rebuilt and repacked.
# 0.13.0 (2026-10-03): HTML in chat: the Host can reply with HTML when
#   appropriate (thumbnails for artifacts, in-chat renderings). (1) VISUALS
#   (the noun is "visual"): a ```visual
#   fence in the Host's reply is drawn as the page, in the sealed frame every host-authored document gets (sandbox
#   allow-scripts only + the shared CSP from /js/sandbox-csp.js, now loaded by
#   index.html; fails closed without it), wearing the desktop's tokens, sized
#   to its content. Nothing is saved automatically, only the usual
#   save/export options: Save as artifact, Download, Copy, Full
#   size, Code. Only the user's own Host's replies run; Peers/People show the
#   source. (2) An artifact a turn made or changed shows as a live thumbnail
#   that opens the Artifacts window — live and after reload (the chip's digest
#   now keeps artifact_id, runtime/tool_trail.py). (3) prompt_behavior: a
#   one-line VISUALS pointer; when to answer with a visual vs build an
#   artifact is in skill 'artifacts'. The frame, the block and
#   the card live in app-web-kit/visuals, shared with the Workbench. Scopes:
#   + read:projects, write:projects. Bundle rebuilt and repacked.
# 0.13.1 (2026-10-04): a link can open a thread. The view `thread:<uuid>`
#   (or `thread:original`) opens Conversations on that thread of the Host's
#   own conversation. A messaging connector sends this link when part of a
#   reply (a visual html2pic cannot draw, an image it cannot attach) could
#   not be shown in the messaging app (server/connectors/reply_parts.py).
#   The thread is opened
#   once the conversations have loaded. src/lib/app-view.ts; scopes
#   unchanged. Bundle rebuilt and repacked.
# 0.13.2 (2026-10-04): a messaging connector's pairing card takes the
#   authenticator code in Tickets. The card (kind connector_pairing, filed by
#   server/network/nac_connector.py) is approved with a code from the
#   person's authenticator; the code box showed only for a pipeline proposal,
#   so approving it here was refused with a pointer to Network. The rule is
#   src/lib/ticket-stepup.ts, read from the payload only the platform writes,
#   with its own line under the box. Scopes unchanged. Bundle rebuilt and
#   repacked.
# 0.13.3 (2026-10-05): create_project no longer carries the conversation into
#   the new project (brain/mastercode/runtime/tools.py _exec_create_project):
#   the exchange stays whole in this thread, and the
#   project's thread opens with a marker linking back to it. The brief told
#   the Host the conversation "will be carried into the project's chat
#   history"; it now says it stays here and the project links back.
#   Manifest-only; bundle repacked.
# 0.14.0 (2026-10-05): cards come up in the conversation, and Circles reopens
#   where it was left: no chasing apps in the middle of a conversation,
#   tickets render in chat, and opening Circles no longer jumps to an old
#   thread. (1) The open thread's own tickets — every
#   one the platform filed during a turn there, and a connector's approval
#   card filed outside one — come up as the ask card on opening the thread
#   and on the 10 s badge poll (GET /api/tickets?asked_in=); "Not now" is
#   remembered on the device so a card is never raised twice. (2) A credential
#   ask is answered on the card: the sealed field and "Store in Keys" (if
#   absent, never replacing a key; the Host gets the name only). (3) A
#   connector pairing the Host starts shows its one-time code on a card, read
#   from the code route by this window (the Host never sees it), with a
#   countdown; a code lost to a restart (410) or run out says so. (4) The
#   open thread is kept across rail tabs and stored on the Host (GET/PUT
#   /api/circles/last-open); a link still wins, a deleted thread falls back
#   to the original. (5) The composer catches Telegram bot tokens and Slack
#   app-level tokens (brain/mastercode/secret_shapes.json), Slack refresh,
#   rotating and workflow tokens, and a Google key or JWT ending in '-'
#   (those slipped past a trailing \b). The step-up rule
#   moved from src/lib/ticket-stepup.ts into app-web-kit/ask.ts. (6) A card
#   answered somewhere else (Network, Tickets, another window) goes on the
#   next poll: a card whose ticket the thread's open list no longer names is
#   read back (GET /api/tickets/{id}) and dropped once it is not open, so it
#   can no longer be clicked into "ticket status is 'decided'"; a card that
#   reads back open stays. Scopes unchanged. Bundle rebuilt and repacked.
# 0.14.1 (2026-10-05): manifest-only. The 0.4.14 note below named the asset
#   catalog's tool, which is removed from the platform with the catalog
#   (migrations/v206); it
#   names it in words now. The behaviour notes already said artifacts wear the
#   desktop (0.12.10). Scopes unchanged; bundle repacked.
# 0.14.2 (2026-10-07): a support draft can be found. Measured on a live Host: a
#   draft waited for the person's Send while Tickets opened on Decisions and
#   the rail showed one number for decisions + drafts + platform questions.
#   Tickets now opens on Support while a draft is waiting (a link still wins),
#   the Support entry says how many drafts wait, and the rail's Tickets number
#   counts what the person must answer (open decisions + the platform's
#   questions) with a separate "draft" mark beside it. New views `support`
#   and `support:<id>` (src/lib/app-view.ts) let the Host's open_app land the
#   person on the support list or one draft. The Host can now rewrite a
#   draft, so Send names the draft version on screen and the server refuses
#   an older one: the pane reloads the draft and says why, nothing is sent.
#   Scopes unchanged; bundle rebuilt and repacked.
# 0.14.3 (2026-10-07): a reasoning-effort pick beside the model picker,
#   so a Host on Claude can be run at another effort per thread
#   (the Anthropic wire now sends output_config.effort). It offers the levels
#   of the model this thread's turns run on (the picked model, else the Host
#   model route), from GET /api/inference/effort-options, and its blank reads
#   as that model's own default ("Default · medium" on Claude Haiku 5.5).
#   The pick rides each send like the model pick (`effort` on
#   /api/circles/messages): never stored, reset with the thread, and dropped
