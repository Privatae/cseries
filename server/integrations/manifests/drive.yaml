key: drive
display_name: Google Drive
categories: [files, google]

connection_kind: files
connection_provider: drive

auth:
  mode: oauth2
  family: google
  authorize_endpoint: https://accounts.google.com/o/oauth2/v2/auth
  token_endpoint: https://oauth2.googleapis.com/token
  revoke_endpoint: https://oauth2.googleapis.com/revoke
  scopes:
    - https://www.googleapis.com/auth/drive.metadata.readonly
    - https://www.googleapis.com/auth/userinfo.email
  extra_authorize:
    access_type: offline
    prompt: consent
    include_granted_scopes: "true"

proxy:
  base_url: https://www.googleapis.com/drive/v3
  rate_limit:
    requests_per_minute: 240
    concurrent: 4

resources:
  - name: file
    canonical_model: File
    sync:
      strategy: cursor                # Drive Changes API via pageToken
      cursor_field: pageToken
      endpoint: changes.list
      page_size: 100
      poll_seconds: 60
    signal:
      operation_read: read
      source_display: Google Drive

reauth_triggers:
  - invalid_grant
  - unauthorized_client
