<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchestrator</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/motion.css">
    <link rel="stylesheet" href="/css/cseries-components.css">
    <link rel="stylesheet" href="/css/model-picker.css">
    <link rel="stylesheet" href="/system-apps/orchestrator/style.css">
</head>
<body class="cseries-scroll">
    <div class="app">
        <header class="app-header">
            <div class="app-brand">
                <img src="/system-apps/orchestrator/icon-64.png" alt="" class="app-brand-icon">
                <div class="app-brand-text">
                    <div class="app-brand-title">Orchestrator</div>
                    <div class="app-brand-sub label-sys">Route the right models for the right task.</div>
                </div>
            </div>
        </header>

        <div class="cseries-seam"></div>

        <main class="app-body">
            <!-- The single orchestration surface. Every decision independent —
                 each text role picks provider → model, plus a fallback provider. -->
            <section class="orch-section" aria-labelledby="routing-heading">
                <h2 id="routing-heading" class="orch-heading">Every decision, one surface</h2>
                <p class="orch-desc">Pick who runs what — text roles, coding builders,
                embeddings. Keys live in the Keys app.</p>
                <div id="model-picker-host"></div>
            </section>
        </main>
    </div>

    <script src="/js/model-picker.js"></script>
    <script src="/system-apps/orchestrator/app.js"></script>
</body>
</html>
