# The containers' network on a cloud box, fixed so the Host's address
# (cseries-host.container.d/cloud.conf) and the address it sees Caddy
# connect from are known, and door.nft can name them. Addresses handed out
# by themselves come from the top half only, so no other container (the
# database starts first) can take the Host's 10.89.77.2.
[Network]
Subnet=10.89.77.0/24
Gateway=10.89.77.1
IPRange=10.89.77.128/25
