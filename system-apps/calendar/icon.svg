    <rect x="66" y="146" width="22" height="20" rx="5"/>
    <rect x="100" y="146" width="22" height="20" rx="5"/>
    <rect x="168" y="146" width="22" height="20" rx="5"/>
    <rect x="66" y="176" width="22" height="20" rx="5"/>
    <rect x="100" y="176" width="22" height="20" rx="5"/>
    <rect x="134" y="176" width="22" height="20" rx="5"/>
  </g>
  <!-- one lit day: something is set for it -->
  <rect x="134" y="146" width="22" height="20" rx="5" fill="#4F7F6A"/>
  <circle cx="145" cy="156" r="4.5" fill="#9be3c2"/>
